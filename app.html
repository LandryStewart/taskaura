<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TaskAura</title>
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@600,700&display=swap" rel="stylesheet">
<style>
:root{
 --pri:#f97316;--pri-d:#ea580c;--pri-l:#fff7ed;
 --bg:#f8fafc;--card:#fff;--text:#0f172a;--text2:#475569;--border:#e2e8f0;
 --shadow:0 2px 8px rgba(0,0,0,.08);
 --crit:#dc2626;--high:#f97316;--med:#7c3aed;--low:#16a34a;
 --hdr:48px;--radius:8px;--sidebar-w:240px;
 --success:#16a34a;--success-light:#dcfce7;
 --warning:#d97706;--warning-light:#fef3c7;
 --danger:#dc2626;--danger-light:#fee2e2;
 --info:#0891b2;--info-light:#cffafe;
 /* Dev module CSS variable aliases */
 --primary:var(--pri);--primary-light:var(--pri);--primary-dark:var(--pri-d);
 --text-muted:var(--text2);--text-light:#94a3b8;
 --bg-white:var(--card);--bg-hover:var(--pri-l);
 --border-dark:#94a3b8;
}
[data-theme="dark"]{
 --bg:#0d1117;--card:#161b22;--text:#e6edf3;--text2:#7d8590;--border:#21262d;
 --shadow:0 2px 12px rgba(0,0,0,.5);--pri-l:#431407;
 --success-light:#052e16;--warning-light:#451a03;--danger-light:#450a0a;--info-light:#083344;
 --text-light:#4b5563;--bg-white:#161b22;--bg-hover:#431407;--border-dark:#374151;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;}
button{cursor:pointer;font-family:inherit;}
input,select,textarea{font-family:inherit;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:7px 10px;font-size:13px;outline:none;}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 2px rgba(249,115,22,.15);}
textarea{resize:vertical;min-height:60px;}

/* Auth */
.auth-overlay{position:fixed;inset:0;background:linear-gradient(135deg,#0d1117 0%,#1a0a00 50%,#7c2d12 100%);display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s;}
.auth-overlay.hidden{opacity:0;visibility:hidden;pointer-events:none;}
.auth-card{background:#fff;border-radius:16px;padding:40px 36px;width:400px;max-width:92vw;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center;}
.auth-card h1{font-size:22px;color:var(--pri-d);margin-bottom:4px;}
.auth-card .auth-sub{font-size:13px;color:#777;margin-bottom:24px;}
.auth-card input{width:100%;padding:11px 14px;border:1px solid #d0d5dd;border-radius:8px;font-size:14px;margin-bottom:12px;background:#f9fafb;}
.auth-card input:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(249,115,22,.15);}
.auth-card .auth-btn{width:100%;padding:11px;background:linear-gradient(135deg,var(--pri-d),var(--pri));color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;margin-top:4px;}
.auth-card .auth-btn:hover{opacity:.9;}
.auth-error{color:var(--crit);font-size:12px;font-weight:600;margin-bottom:8px;min-height:18px;}
.auth-toggle{font-size:13px;color:var(--pri);cursor:pointer;margin-top:16px;}
.auth-toggle:hover{text-decoration:underline;}

/* Topbar */
.topbar{background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;height:var(--hdr);gap:12px;flex-shrink:0;z-index:100;}
.topbar .logo{display:flex;align-items:center;gap:8px;font-family:'General Sans',sans-serif;font-weight:700;font-size:17px;color:var(--text);white-space:nowrap;}
.logo-tile{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--pri-d),var(--pri));display:inline-flex;align-items:center;justify-content:center;font-size:14px;color:#fff;font-weight:600;flex-shrink:0;}
.topbar .spacer{flex:1;}
.top-btn{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:6px;font-size:12px;font-weight:500;display:flex;align-items:center;gap:5px;transition:all .15s;white-space:nowrap;}
.top-btn:hover{border-color:var(--pri);color:var(--pri);}
.top-btn.accent{background:linear-gradient(135deg,var(--pri-d),var(--pri));color:#fff;border:none;font-weight:700;}
.top-btn.accent:hover{opacity:.9;}
.dark-toggle{background:none;border:none;color:var(--text);font-size:18px;padding:4px;cursor:pointer;}

/* Layout */
.app-body{display:flex;flex:1;min-height:0;overflow:hidden;}
.sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0;}
.sidebar-section{padding:12px;}
.sidebar-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text2);margin-bottom:8px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--radius);font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;transition:all .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nav-item:hover{background:var(--pri-l);color:var(--text);}
.nav-item.active{background:var(--pri);color:#fff;}
.nav-item .nav-icon{font-size:15px;flex-shrink:0;width:20px;text-align:center;}
.nav-item-add{color:var(--pri);font-weight:600;}
.nav-divider{height:1px;background:var(--border);margin:4px 12px;}

/* Main content */
.main-content{flex:1;overflow-y:auto;padding:24px;min-width:0;}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.card-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.card-header h3{font-size:14px;font-weight:700;}
.card-body{padding:18px;}

/* Badges */
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;white-space:nowrap;}
.badge-green{background:var(--success-light);color:#15803d;}
.badge-yellow{background:var(--warning-light);color:#a16207;}
.badge-red{background:var(--danger-light);color:#dc2626;}
.badge-blue{background:var(--info-light);color:#0e7490;}
.badge-gray{background:#f1f5f9;color:#475569;}
[data-theme="dark"] .badge-gray{background:#1e293b;color:#94a3b8;}
.badge-orange{background:#fff7ed;color:#c2410c;}
[data-theme="dark"] .badge-orange{background:#431407;color:#fb923c;}
.badge-purple{background:#f5f3ff;color:#7c3aed;}
[data-theme="dark"] .badge-purple{background:#2e1065;color:#a78bfa;}

/* Buttons */
.btn{padding:7px 16px;border-radius:var(--radius);font-size:13px;font-weight:500;border:1px solid var(--border);background:var(--card);color:var(--text);transition:all .15s;}
.btn:hover{border-color:var(--pri);color:var(--pri);}
.btn-primary{background:var(--pri);color:#fff;border-color:var(--pri);}
.btn-primary:hover{background:var(--pri-d);border-color:var(--pri-d);color:#fff;}
.btn-sm{padding:4px 10px;font-size:12px;}
.btn-danger{color:var(--crit);border-color:var(--danger-light);}
.btn-danger:hover{background:var(--danger-light);}

/* Project info bar */
.project-bar{background:linear-gradient(135deg,#0d1117,#1a0a00,#431407);color:#fff;border-radius:var(--radius);padding:18px 22px;margin-bottom:20px;display:flex;gap:28px;align-items:center;flex-wrap:wrap;}
.project-bar .pb-name{font-size:20px;font-weight:800;}
.project-bar .pb-meta{font-size:12px;opacity:.8;}
.project-bar .pb-item{display:flex;flex-direction:column;gap:2px;}
.project-bar .pb-label{font-size:10px;text-transform:uppercase;letter-spacing:.5px;opacity:.6;}
.project-bar .pb-value{font-size:14px;font-weight:600;}

/* Department tabs */
.dept-tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:20px;}
.dept-tab{padding:10px 20px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;white-space:nowrap;}
.dept-tab:hover{color:var(--text);}
.dept-tab.active{color:var(--pri);border-bottom-color:var(--pri);}
.dept-tab.summary-tab{margin-left:auto;color:var(--pri);}

/* Phase tabs */
.phase-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.phase-tab{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--card);transition:all .15s;}
.phase-tab:hover{border-color:var(--pri);color:var(--pri);}
.phase-tab.active{background:var(--pri);color:#fff;border-color:var(--pri);}

/* Tables */
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:var(--bg);font-weight:600;text-align:left;padding:10px 12px;border-bottom:2px solid var(--border);white-space:nowrap;}
td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:top;}
tr:hover td{background:var(--pri-l);}
.table-actions{display:flex;gap:4px;}
.table-actions button{padding:3px 8px;font-size:11px;border-radius:4px;border:1px solid var(--border);background:var(--card);cursor:pointer;}
.table-actions button:hover{border-color:var(--pri);color:var(--pri);}
.table-actions .btn-del{color:var(--crit);}
.table-actions .btn-del:hover{background:var(--danger-light);}

/* Bucket board */
.bucket-board{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;min-height:400px;}
.bucket{min-width:280px;max-width:310px;width:280px;background:var(--bg);border-radius:var(--radius);display:flex;flex-direction:column;flex-shrink:0;border:1px solid var(--border);}
[data-theme="dark"] .bucket{background:#0f1f3d;}
.bucket-hdr{display:flex;align-items:center;padding:10px 12px;gap:8px;border-bottom:1px solid var(--border);background:inherit;border-radius:var(--radius) var(--radius) 0 0;}
.bucket-title{font-weight:700;font-size:13px;flex:1;text-transform:uppercase;letter-spacing:.5px;}
.bucket-count{background:var(--pri);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;}
.bucket-cards{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px;}
.bucket-cards.drag-over{background:var(--pri-l);border-radius:6px;}
.task-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 12px;cursor:pointer;transition:transform .15s,box-shadow .15s;border-left:4px solid var(--border);}
.task-card:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.12);}
.task-card.dragging{opacity:.4;}
.task-card.pri-critical{border-left-color:var(--crit);}
.task-card.pri-high{border-left-color:var(--high);}
.task-card.pri-medium{border-left-color:var(--med);}
.task-card.pri-low{border-left-color:var(--low);}
.task-card-title{font-weight:600;font-size:13px;margin-bottom:6px;}
.task-card-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11px;color:var(--text2);}
.bucket-quick-add{padding:8px;border-top:1px solid var(--border);}
.quick-add-input{width:100%;padding:7px 10px;border:1px dashed var(--border);border-radius:6px;font-size:12px;background:transparent;color:var(--text);outline:none;}
.quick-add-input:focus{border-style:solid;border-color:var(--pri);background:var(--card);}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:500;padding:20px;}
.modal-overlay.show{display:flex;}
.modal{background:var(--card);border-radius:12px;width:580px;max-width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.modal-hdr{display:flex;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border);}
.modal-hdr h2{flex:1;font-size:16px;font-weight:700;}
.modal-close{background:none;border:none;font-size:22px;color:var(--text2);padding:4px;margin-left:auto;cursor:pointer;}
.modal-close:hover{color:var(--crit);}
.modal-body{padding:18px 22px;display:flex;flex-direction:column;gap:14px;}
.modal-body label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);display:block;margin-bottom:3px;}
.modal-body input,.modal-body select,.modal-body textarea{width:100%;}
.modal-row{display:flex;gap:12px;}
.modal-row>div{flex:1;}
.modal-footer{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.modal-footer button{padding:8px 20px;border-radius:6px;font-size:13px;font-weight:600;}

/* Form groups */
.form-group{margin-bottom:14px;}
.form-group label{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px;}
.form-group input,.form-group select,.form-group textarea{width:100%;}
.form-row{display:flex;gap:12px;}
.form-row .form-group{flex:1;}

/* Checklist */
.checklist{display:flex;flex-direction:column;gap:4px;}
.cl-item{display:flex;align-items:center;gap:6px;font-size:13px;}
.cl-item input[type=checkbox]{width:16px;height:16px;accent-color:var(--pri);}
.cl-item input[type=text]{flex:1;}
.cl-item .cl-rm{background:none;border:none;color:var(--crit);font-size:16px;padding:2px;cursor:pointer;}
.cl-add{font-size:12px;color:var(--pri);background:none;border:none;font-weight:600;margin-top:2px;cursor:pointer;}
.cl-add:hover{text-decoration:underline;}

/* Progress bar */
.progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;border-radius:3px;transition:width .3s;}
.pf-green{background:var(--success);}
.pf-orange{background:var(--pri);}
.pf-red{background:var(--crit);}

/* Dashboard */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:24px;}
.kpi-card{background:var(--card);border-radius:14px;padding:20px;border:1px solid var(--border);box-shadow:var(--shadow);border-top:3px solid var(--border);}
.kpi-card.kpi-pri{border-top-color:var(--pri);}
.kpi-card.kpi-red{border-top-color:var(--crit);}
.kpi-card.kpi-green{border-top-color:var(--success);}
.kpi-card.kpi-purple{border-top-color:var(--med);}
.kpi-num{font-size:32px;font-weight:900;line-height:1;color:var(--text);}
.kpi-card.kpi-pri .kpi-num{color:var(--pri);}
.kpi-card.kpi-red .kpi-num{color:var(--crit);}
.kpi-card.kpi-green .kpi-num{color:var(--success);}
.kpi-card.kpi-purple .kpi-num{color:var(--med);}
.kpi-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text2);margin-top:6px;}

/* Hero */
.hero{border-radius:16px;padding:28px;background:linear-gradient(135deg,#0d1117 0%,#1a0a00 50%,#431407 100%);color:#fff;margin-bottom:24px;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;inset:-10%;background:radial-gradient(ellipse at 80% 20%,rgba(249,115,22,.2) 0%,transparent 60%);pointer-events:none;}
.hero-content{position:relative;z-index:1;}
.hero-greeting{font-size:12px;font-weight:600;color:rgba(251,191,36,.85);letter-spacing:.8px;text-transform:uppercase;margin-bottom:4px;}
.hero-name{font-size:26px;font-weight:900;margin-bottom:6px;}
.hero-date{font-size:13px;color:rgba(203,213,225,.7);}

/* Calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border-radius:var(--radius);overflow:hidden;}
.cal-hdr{background:var(--pri-d);color:#fff;padding:8px;text-align:center;font-size:11px;font-weight:700;text-transform:uppercase;}
.cal-cell{background:var(--card);padding:6px;min-height:90px;cursor:pointer;transition:background .15s;}
.cal-cell:hover{background:var(--pri-l);}
.cal-cell.outside{opacity:.4;}
.cal-cell.today{box-shadow:inset 0 0 0 2px var(--pri);}
.cal-date{font-size:12px;font-weight:700;color:var(--text2);margin-bottom:4px;}
.cal-date .today-num{background:var(--pri);color:#fff;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;}
.cal-tasks{display:flex;flex-direction:column;gap:2px;}
.cal-task-pill{padding:2px 5px;border-radius:3px;font-size:10px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-left:3px solid var(--border);}
.cal-task-pill.pri-critical{border-left-color:var(--crit);background:var(--danger-light);color:#991b1b;}
.cal-task-pill.pri-high{border-left-color:var(--high);background:#fff7ed;color:#9a3412;}
.cal-task-pill.pri-medium{border-left-color:var(--med);background:#f5f3ff;color:#6d28d9;}
.cal-task-pill.pri-low{border-left-color:var(--low);background:var(--success-light);color:#15803d;}
[data-theme="dark"] .cal-task-pill.pri-critical{background:#450a0a;color:#fca5a5;}
[data-theme="dark"] .cal-task-pill.pri-high{background:#431407;color:#fdba74;}
[data-theme="dark"] .cal-task-pill.pri-medium{background:#2e1065;color:#c4b5fd;}
[data-theme="dark"] .cal-task-pill.pri-low{background:#052e16;color:#86efac;}
.cal-nav-bar{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.cal-nav-bar h3{font-size:18px;font-weight:700;min-width:200px;}
.cal-nav-btn{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;}
.cal-nav-btn:hover{background:var(--pri-l);border-color:var(--pri);}
.cal-today-btn{background:var(--pri);color:#fff;border:none;border-radius:6px;padding:5px 14px;font-size:12px;font-weight:600;cursor:pointer;}

/* Phase info bar */
.phase-bar{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px;display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;box-shadow:var(--shadow);}
.phase-field{display:flex;flex-direction:column;gap:4px;}
.phase-field-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);}
.phase-field-value{font-size:14px;font-weight:600;}

/* Section header */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap;}
.section-header h2{font-size:17px;font-weight:700;}

/* Delay badge */
.delay-badge{background:var(--danger-light);color:var(--crit);padding:1px 6px;border-radius:4px;font-size:10px;font-weight:600;cursor:pointer;}

/* Gantt */
.gantt-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.gantt-wrap svg{display:block;}

/* View toggle */
.view-toggle{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.view-toggle button{padding:5px 14px;font-size:12px;border:none;background:var(--card);color:var(--text2);cursor:pointer;}
.view-toggle button:hover{background:var(--pri-l);}
.view-toggle button.active{background:var(--pri);color:#fff;font-weight:600;}

/* Legal */
.lt-filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.lt-filters select{padding:6px 10px;font-size:12px;}
.lt-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;box-shadow:var(--shadow);border-left:4px solid var(--border);overflow:hidden;}
.lt-card.pri-Critical{border-left-color:var(--crit);}
.lt-card.pri-High{border-left-color:var(--high);}
.lt-card.pri-Medium{border-left-color:var(--med);}
.lt-card.pri-Low{border-left-color:var(--low);}
.lt-card-hdr{padding:12px 16px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:background .15s;}
.lt-card-hdr:hover{background:var(--pri-l);}
.lt-card-title{flex:1;font-weight:600;font-size:13px;}
.lt-card-body{padding:0 16px 14px;border-top:1px solid var(--border);font-size:13px;display:none;}
.lt-card-body.open{display:block;padding-top:12px;}

/* Summary panels */
.summary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
.summary-panel{background:var(--card);border-radius:var(--radius);padding:18px;border:1px solid var(--border);box-shadow:var(--shadow);}
.summary-panel h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border);}
.summary-stat{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid var(--border);}
.summary-stat:last-child{border-bottom:none;}

/* Empty state */
.empty-state{text-align:center;padding:48px 20px;color:var(--text2);}
.empty-state p{margin-bottom:12px;font-size:14px;}

/* Toast */
.toast{position:fixed;bottom:24px;right:24px;background:var(--card);border:1px solid var(--border);color:var(--text);padding:12px 20px;border-radius:var(--radius);box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:600;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;}
.toast.show{opacity:1;pointer-events:auto;}

/* Pending overlay */

<script>
// ════════════════════════════════════════════════════════════════════
// SUPABASE AUTH
// ════════════════════════════════════════════════════════════════════
const SUPABASE_URL = 'https://kxidfwesywhhdifekkqo.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Mpf3fQxq5253lluxVGdXxA_Se4rBp9z';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let currentUser = null;
let _unlockingApp = false;

function initSupabaseAuth() {
  // Load app immediately — no login gate
  loadState();
  document.getElementById('userName').textContent = state.myName || '';
  if (state.darkMode) document.documentElement.setAttribute('data-theme', 'dark');
  else document.documentElement.removeAttribute('data-theme');
  updateDarkIcon();
  navTo('dashboard');

  // Auth silently in background for cloud sync
  _supabase.auth.onAuthStateChange((event, session) => {
    if (session && session.user) {
      currentUser = session.user;
      document.getElementById('authOverlay').classList.add('hidden');
      syncAfterAuth();
    } else {
      currentUser = null;
      updateAuthBtn();
    }
  });
  _supabase.auth.getSession().then(result => {
    if (result.data && result.data.session) {
      currentUser = result.data.session.user;
      syncAfterAuth();
    }
  });
}

function toggleAuth() {
  if (currentUser) { doLogout(); }
  else { document.getElementById('authOverlay').classList.remove('hidden'); }
}
function updateAuthBtn() {
  const btn = document.getElementById('authBtn');
  if (!btn) return;
  if (currentUser) { btn.textContent = 'Sign Out'; btn.style.color = 'var(--crit)'; btn.style.borderColor = 'var(--danger-light)'; }
  else { btn.textContent = 'Sign In'; btn.style.color = 'var(--pri)'; btn.style.borderColor = 'var(--pri)'; }
}

async function syncAfterAuth() {
  if (_cloudLoaded) return;
  updateAuthBtn();
  const authName = (currentUser.user_metadata && currentUser.user_metadata.full_name) || currentUser.email.split('@')[0];
  if (authName) state.myName = authName;
  await loadFromCloud();
  _cloudLoaded = true;
  if (authName && state.myName !== authName) { state.myName = authName; saveState(); }
  document.getElementById('userName').textContent = state.myName;
  renderMain();
  renderSidebar();
}

async function doLogin() {
  const email = (document.getElementById('loginEmail').value || '').trim();
  const pw = document.getElementById('loginPw').value;
  const err = document.getElementById('loginError');
  err.style.color = '#dc2626'; err.textContent = '';
  if (!email || !pw) { err.textContent = 'Enter email and password.'; return; }
  const btn = document.querySelector('#authFormSignIn .auth-btn');
  btn.textContent = 'Signing in...'; btn.disabled = true;
  try {
    const result = await _supabase.auth.signInWithPassword({ email, password: pw });
    if (result.error) { err.textContent = result.error.message; btn.textContent = 'Sign In'; btn.disabled = false; }
  } catch (e) { err.textContent = 'Connection error: ' + e.message; btn.textContent = 'Sign In'; btn.disabled = false; }
}

async function doSignUp() {
  const name = (document.getElementById('signupName').value || '').trim();
  const email = (document.getElementById('signupEmail').value || '').trim();
  const pw = document.getElementById('signupPw').value;
  const err = document.getElementById('loginError');
  err.style.color = '#dc2626'; err.textContent = '';
  if (!name || !email || !pw) { err.textContent = 'Fill in all fields.'; return; }
  if (pw.length < 6) { err.textContent = 'Password must be at least 6 characters.'; return; }
  const btn = document.querySelector('#authFormSignUp .auth-btn');
  btn.textContent = 'Creating account...'; btn.disabled = true;
  const result = await _supabase.auth.signUp({ email, password: pw, options: { data: { full_name: name } } });
  if (result.error) { err.textContent = result.error.message; }
  else { err.style.color = '#16a34a'; err.textContent = '✓ Check your email to confirm, then sign in.'; setTimeout(showSignIn, 3000); }
  btn.textContent = 'Create Account'; btn.disabled = false;
}

function showSignUp() { document.getElementById('authFormSignIn').style.display = 'none'; document.getElementById('authFormSignUp').style.display = 'block'; document.getElementById('authSub').textContent = 'Create a new account'; document.getElementById('loginError').textContent = ''; }
function showSignIn() { document.getElementById('authFormSignUp').style.display = 'none'; document.getElementById('authFormSignIn').style.display = 'block'; document.getElementById('authSub').textContent = 'Sign in to your account'; document.getElementById('loginError').textContent = ''; }
function showPendingApproval() { document.getElementById('authOverlay').classList.add('hidden'); document.getElementById('appContainer').style.display = 'none'; document.getElementById('pendingOverlay').classList.remove('hidden'); }
function showLoginScreen() {
  document.getElementById('authOverlay').classList.remove('hidden');
  document.getElementById('appContainer').style.display = 'none';
  document.getElementById('pendingOverlay').classList.add('hidden');
}
function doLogout() {
  _supabase.auth.signOut().then(() => {
    currentUser = null;
    _cloudLoaded = false;
    updateAuthBtn();
    showToast('Signed out — data saved locally');
    renderMain();
  });
}

async function unlockApp() {
  // Legacy — now handled by initSupabaseAuth + syncAfterAuth
  if (currentUser && !_cloudLoaded) await syncAfterAuth();
}

// ════════════════════════════════════════════════════════════════════
// STATE & DATA MODEL
// ════════════════════════════════════════════════════════════════════
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => s ? String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;') : '';
const fmtDate = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
const todayStr = () => new Date().toISOString().split('T')[0];
const pct = n => Math.min(100, Math.max(0, Math.round(n)));

const PHASE_STAGES = ['Pre-Construction','Earthwork','Utilities','Crossings','Paving','Franchise Utilities','Post Pave Wet Utilities','Fine Grading/Flatwork','Final Walk','Substantial Completion','ON HOLD'];
const PRIORITIES = ['critical','high','medium','low'];
const STATUSES = ['not-started','in-progress','delayed','completed','on-hold'];
const DEPARTMENTS = ['acquisition','entitlement','development','legal'];
const DEPT_LABELS = { acquisition: 'Acquisition', entitlement: 'Entitlement', development: 'Development', legal: 'Legal' };
const DEFAULT_BUCKETS = ['To Do', 'In Progress', 'Under Review', 'Complete'];
const LT_COUNSEL_TYPES = ['Internal Counsel', 'External Counsel', 'DFW West'];
const LT_ACTION_TYPES = ['Drafting', 'Reviewing'];
const LT_STATUSES = ['Upcoming', 'In Progress', 'Holding Pattern', 'Complete'];

function getDefaultState() {
  return {
    projects: [],
    tasks: [],
    myName: '',
    darkMode: true,
    legalSettings: {
      counselTypes: [...LT_COUNSEL_TYPES],
      actionTypes: [...LT_ACTION_TYPES],
      statuses: [...LT_STATUSES]
    },
    _lastSaved: '',
    nonProject: { newBusiness:[], swppp:[], developmentSpends:[], brws:[], hoa:[], specialProjects:[] },
    milestones: [],
    changeLog: [],
    sections: null
  };
}

let state = getDefaultState();
let _cloudLoaded = false;
let syncTimer = null;
let currentView = 'dashboard';
let selectedProjectId = null;
let activeDeptTab = null;
let devPhaseFilter = null;
let devViewMode = 'table';

let devProjectTab = 'schedule';
let biddingPhaseFilter = 'all';
let notesPhaseFilter = 'all';
let utilityPhaseFilter = 'all';
let scheduleViewMode = 'table';
let showArchivedPhases = false;
let showArchivedSections = false;
let currentNonProject = null;
let currentProjectId = null;
let calMonth = new Date().getMonth();
let calYear = new Date().getFullYear();

function saveState() {
  state._lastSaved = new Date().toISOString();
  localStorage.setItem('taskaura_state', JSON.stringify(state));
  if (_cloudLoaded) debouncedCloudSave();
}

function loadState() {
  try {
    const raw = localStorage.getItem('taskaura_state');
    if (raw) state = JSON.parse(raw);
    else state = getDefaultState();
  } catch (e) { state = getDefaultState(); }
  if (!state.projects) state.projects = [];
  if (!state.tasks) state.tasks = [];
  if (!state.legalSettings) state.legalSettings = { counselTypes: [...LT_COUNSEL_TYPES], actionTypes: [...LT_ACTION_TYPES], statuses: [...LT_STATUSES] };
  if (!state.nonProject) state.nonProject = { newBusiness:[], swppp:[], developmentSpends:[], brws:[], hoa:[], specialProjects:[] };
  if (!state.milestones) state.milestones = [];
  if (!state.changeLog) state.changeLog = [];
}

// ── Cloud Sync ──
async function syncToCloud() {
  if (!currentUser || !_cloudLoaded) return;
  try {
    await _supabase.from('workspace_blobs').upsert({
      user_id: currentUser.id,
      workspace_key: 'taskaura_v2',
      data: state,
      updated_at: new Date().toISOString()
    }, { onConflict: 'user_id,workspace_key' });
  } catch (e) { console.error('Sync error', e); }
}
function debouncedCloudSave() { if (syncTimer) clearTimeout(syncTimer); syncTimer = setTimeout(syncToCloud, 800); }

async function loadFromCloud() {
  if (!currentUser) return;
  try {
    const { data } = await _supabase.from('workspace_blobs').select('data').eq('user_id', currentUser.id).eq('workspace_key', 'taskaura_v2').single();
    if (data && data.data) {
      const cloud = data.data;
      // Use cloud if newer
      if (cloud._lastSaved && (!state._lastSaved || cloud._lastSaved > state._lastSaved)) {
        state = cloud;
        if (!state.projects) state.projects = [];
        if (!state.tasks) state.tasks = [];
        if (!state.legalSettings) state.legalSettings = { counselTypes: [...LT_COUNSEL_TYPES], actionTypes: [...LT_ACTION_TYPES], statuses: [...LT_STATUSES] };
        if (!state.nonProject) state.nonProject = { newBusiness:[], swppp:[], developmentSpends:[], brws:[], hoa:[], specialProjects:[] };
        if (!state.milestones) state.milestones = [];
        if (!state.changeLog) state.changeLog = [];
        localStorage.setItem('taskaura_state', JSON.stringify(state));
      }
    }
  } catch (e) { /* first time, no cloud data */ }
}

function beaconSave() {
  if (!currentUser || !_cloudLoaded) return;
  try {
    const raw = localStorage.getItem('sb-kxidfwesywhhdifekkqo-auth-token');
    if (!raw) return;
    const parsed = JSON.parse(raw);
    let token = parsed.access_token || (parsed.session && parsed.session.access_token);
    if (!token) return;
    const body = JSON.stringify({ user_id: currentUser.id, workspace_key: 'taskaura_v2', data: state, updated_at: new Date().toISOString() });
    navigator.sendBeacon(SUPABASE_URL + '/rest/v1/workspace_blobs?on_conflict=user_id,workspace_key', new Blob([body], { type: 'application/json' }));
  } catch (e) {}
}
window.addEventListener('beforeunload', beaconSave);

// ════════════════════════════════════════════════════════════════════
// UTILITY FUNCTIONS
// ════════════════════════════════════════════════════════════════════
function addWorkingDays(dateStr, days) {
  if (!dateStr || !days) return dateStr;
  const d = new Date(dateStr + 'T12:00:00');
  let added = 0; const dir = days > 0 ? 1 : -1; const abs = Math.abs(days);
  while (added < abs) { d.setDate(d.getDate() + dir); if (d.getDay() !== 0 && d.getDay() !== 6) added++; }
  return d.toISOString().split('T')[0];
}

function workingDaysBetween(a, b) {
  if (!a || !b || a === b) return 0;
  const sign = b > a ? 1 : -1;
  const [from, to] = sign === 1 ? [a, b] : [b, a];
  const d = new Date(from + 'T12:00:00'), end = new Date(to + 'T12:00:00');
  let n = 0;
  while (d < end) { d.setDate(d.getDate() + 1); if (d.getDay() !== 0 && d.getDay() !== 6) n++; }
  return n * sign;
}

function statusBadge(status) {
  const map = { 'not-started': ['Not Started', 'gray'], 'in-progress': ['In Progress', 'blue'], 'delayed': ['Delayed', 'red'], 'completed': ['Completed', 'green'], 'on-hold': ['On Hold', 'yellow'], 'pending': ['Pending', 'gray'] };
  const [label, color] = map[status] || [status, 'gray'];
  return `<span class="badge badge-${color}">${esc(label)}</span>`;
}

function priorityBadge(pri) {
  const map = { critical: ['Critical', 'red'], high: ['High', 'orange'], medium: ['Medium', 'purple'], low: ['Low', 'green'] };
  const [label, color] = map[pri] || [pri, 'gray'];
  return `<span class="badge badge-${color}">${esc(label)}</span>`;
}

function showToast(msg) {
  const t = document.getElementById('toast');

}

}

function toggleDark() {

function updateDarkIcon() {

}

// Dates
function isThisWeek(dateStr) {
  if (!dateStr) return false;
  const d = new Date(dateStr + 'T00:00:00');
  const now = new Date(); const start = new Date(now); start.setDate(now.getDate() - now.getDay());
  const end = new Date(start); end.setDate(start.getDate() + 7);
  return d >= start && d < end;
}
function isOverdue(dateStr) {
  if (!dateStr) return false;
  return dateStr < todayStr();
}

// Tasks helpers
function getProjectTasks(projectId, dept) {
  return state.tasks.filter(t => t.projectId === projectId && (!dept || t.department === dept));
}
function getAllTasksForUser() {
  const name = (state.myName || '').toLowerCase().trim();
  return state.tasks.filter(t => {
    if (t.status === 'completed') return false;
    if (!name) return true;
    const assignee = (t.assignee || '').toLowerCase().trim();
    return !assignee || assignee === name;
  });
}

// MASTER CALENDAR
// ════════════════════════════════════════════════════════════════════
function renderMasterCalendar() {
  const year = calYear, month = calMonth;
  const first = new Date(year, month, 1);
  const last = new Date(year, month + 1, 0);
  const startDay = first.getDay();
  const daysInMonth = last.getDate();
  const monthName = first.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  const today = todayStr();

  // Build task map by date
  const tasksByDate = {};
  state.tasks.forEach(t => {
    const d = t.dueDate || t.projectedFinish;
    if (d) { if (!tasksByDate[d]) tasksByDate[d] = []; tasksByDate[d].push(t); }
  });

  let cells = '';
  const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  dayNames.forEach(d => { cells += `<div class="cal-hdr">${d}</div>`; });

  // Previous month filler
  const prevLast = new Date(year, month, 0).getDate();
  for (let i = startDay - 1; i >= 0; i--) {
    cells += `<div class="cal-cell outside"><div class="cal-date">${prevLast - i}</div></div>`;
  }

  // Days
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const isToday = ds === today;
    const tasks = tasksByDate[ds] || [];
    const taskPills = tasks.slice(0, 3).map(t => {
      const pri = t.priority || 'medium';
      return `<div class="cal-task-pill pri-${pri}" title="${esc(t.taskName)}">${esc(t.taskName)}</div>`;
    }).join('');
    const more = tasks.length > 3 ? `<div style="font-size:10px;color:var(--pri);font-weight:600;cursor:pointer" onclick="showCalDay('${ds}')">+${tasks.length - 3} more</div>` : '';
    cells += `<div class="cal-cell ${isToday ? 'today' : ''}" onclick="showCalDay('${ds}')">
      <div class="cal-date">${isToday ? `<span class="today-num">${d}</span>` : d}</div>
      <div class="cal-tasks">${taskPills}${more}</div>
    </div>`;
  }

  // Next month filler
  const totalCells = startDay + daysInMonth;
  const remaining = (7 - (totalCells % 7)) % 7;
  for (let i = 1; i <= remaining; i++) {
    cells += `<div class="cal-cell outside"><div class="cal-date">${i}</div></div>`;
  }

  return `
    <div class="cal-nav-bar">
      <button class="cal-nav-btn" onclick="calPrev()">◀</button>
      <h3>${monthName}</h3>
      <button class="cal-nav-btn" onclick="calNext()">▶</button>
      <button class="cal-today-btn" onclick="calToday()">Today</button>
    </div>
    <div class="cal-grid">${cells}</div>`;
}

function calPrev() { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } renderMain(); }
function calNext() { calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } renderMain(); }
function calToday() { const n = new Date(); calMonth = n.getMonth(); calYear = n.getFullYear(); renderMain(); }

function showCalDay(ds) {
  const tasks = state.tasks.filter(t => (t.dueDate === ds || t.projectedFinish === ds));
  const dateLabel = fmtDate(ds);
  const rows = tasks.length ? tasks.map(t => `
    <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;border-left:4px solid ${t.priority === 'critical' ? 'var(--crit)' : t.priority === 'high' ? 'var(--high)' : t.priority === 'low' ? 'var(--low)' : 'var(--med)'};background:var(--bg);margin-bottom:6px;cursor:pointer" onclick="closeModal();editTask('${t.id}')">
      <div style="flex:1"><div style="font-weight:600;font-size:13px">${esc(t.taskName)}</div><div style="font-size:11px;color:var(--text2)">${DEPT_LABELS[t.department] || ''} · ${esc(getProjectName(t.projectId))}</div></div>
      ${priorityBadge(t.priority)}
    </div>`).join('')
    : '<div style="padding:20px;text-align:center;color:var(--text2);font-style:italic">No tasks on this day</div>';

  openModal(`Tasks — ${dateLabel}`, rows, `<button class="btn btn-primary" onclick="closeModal();openNewTaskModal(null,'${ds}')">+ Add Task</button>`);
}

// BUCKET BOARD (Acquisition & Entitlement)
// ════════════════════════════════════════════════════════════════════
function renderBucketBoard(p, dept) {
  const tasks = getProjectTasks(p.id, dept);
  const buckets = [...DEFAULT_BUCKETS];

  const bucketsHtml = buckets.map(bucket => {
    const bucketTasks = tasks.filter(t => (t.bucket || 'To Do') === bucket);
    const cards = bucketTasks.map(t => {
      const pri = t.priority || 'medium';
      const overdue = isOverdue(t.dueDate) && t.status !== 'completed';
      return `<div class="task-card pri-${pri}" draggable="true" data-id="${t.id}"
        ondragstart="dragStart(event,'${t.id}')" ondragend="dragEnd(event)"
        onclick="editTask('${t.id}')">
        <div class="task-card-title">${esc(t.taskName)}</div>
        <div class="task-card-meta">
          ${priorityBadge(pri)}
          ${t.dueDate ? `<span style="${overdue ? 'color:var(--crit);font-weight:600' : ''}">${fmtDate(t.dueDate)}</span>` : ''}
          ${t.assignee ? `<span>👤 ${esc(t.assignee)}</span>` : ''}
          ${t.checklist && t.checklist.length ? `<span>☑ ${t.checklist.filter(c=>c.done).length}/${t.checklist.length}</span>` : ''}
        </div>
      </div>`;
    }).join('');

    return `<div class="bucket">
      <div class="bucket-hdr">
        <span class="bucket-title">${esc(bucket)}</span>
        <span class="bucket-count">${bucketTasks.length}</span>
      </div>
      <div class="bucket-cards" data-bucket="${esc(bucket)}" data-dept="${dept}" data-project="${p.id}"
        ondragover="event.preventDefault();this.classList.add('drag-over')"
        ondragleave="this.classList.remove('drag-over')"
        ondrop="bucketDrop(event,this)">
        ${cards || '<div style="padding:12px;text-align:center;color:var(--text2);font-size:12px">Drop tasks here</div>'}
      </div>
      <div class="bucket-quick-add">
        <input class="quick-add-input" placeholder="+ Add task..." data-bucket="${esc(bucket)}" data-dept="${dept}" data-project="${p.id}"
          onkeydown="if(event.key==='Enter')quickAddTask(this)">
      </div>
    </div>`;
  }).join('');

  return `
    <div class="section-header">
      <h2>${DEPT_LABELS[dept]} — ${esc(p.name)}</h2>
      <button class="btn btn-primary btn-sm" onclick="openNewTaskModal('${dept}')">+ Add Task</button>
    </div>
    <div class="bucket-board">${bucketsHtml}</div>`;
}

let draggedTaskId = null;
function dragStart(e, id) { draggedTaskId = id; e.dataTransfer.effectAllowed = 'move'; e.target.classList.add('dragging'); }
function dragEnd(e) { e.target.classList.remove('dragging'); draggedTaskId = null; document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over')); }

function bucketDrop(e, container) {
  e.preventDefault();
  container.classList.remove('drag-over');
  if (!draggedTaskId) return;
  const task = state.tasks.find(t => t.id === draggedTaskId);
  if (!task) return;
  const newBucket = container.dataset.bucket;
  task.bucket = newBucket;
  if (newBucket === 'Complete') { task.status = 'completed'; task.percentComplete = 100; }
  else if (newBucket === 'In Progress') { task.status = 'in-progress'; }
  else if (newBucket === 'Under Review') { task.status = 'in-progress'; }
  else { task.status = 'not-started'; }
  task.updatedAt = new Date().toISOString();
  saveState();
  renderMain();
}

function quickAddTask(input) {
  const name = input.value.trim();
  if (!name) return;
  const task = {
    id: uid(), department: input.dataset.dept, projectId: input.dataset.project,
    taskName: name, priority: 'medium', status: 'not-started',
    bucket: input.dataset.bucket, assignee: '', dueDate: '', percentComplete: 0,
    description: '', notes: '', checklist: [],
    createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
  };
  state.tasks.push(task);
  saveState();
  renderMain();
  showToast('Task added');
}

  ];

  // Ensure project has needed arrays
  if (!p.schedule) p.schedule = [];
  if (!p.bidding) p.bidding = [];
  if (!p.utilities) p.utilities = [];
  if (!p.notes) p.notes = [];
  if (!p.resources) p.resources = {contacts:[], links:[]};
  if (!p.amenityCenters) p.amenityCenters = [];
  if (!p.parks) p.parks = [];

  const subTabsHtml = SUB_TABS.map(t =>
    `<div class="dev-sub-tab ${devProjectTab === t.id ? 'active' : ''}" onclick="devProjectTab='${t.id}';renderMain()">${t.label}</div>`
  ).join('');

  let body = '';
  if (devProjectTab === 'schedule') body = renderSchedule(p);
  else if (devProjectTab === 'bidding') body = renderBidding(p);
  else if (devProjectTab === 'utilities') body = renderUtilities(p);
  else if (devProjectTab === 'notes') body = renderNotes(p);
  else if (devProjectTab === 'resources') body = renderResources(p);
  else if (devProjectTab === 'amenities') body = renderAmenities(p);
  else if (devProjectTab === 'sections') {
    ensureSections();
    const secTabs = (state.sections||[]).filter(sx=>!sx.archived).map(sx =>
      `<div class="phase-tab ${currentNonProject===sx.key?'active':''}" onclick="currentNonProject='${sx.key}';renderMain()">${esc(sx.label)}</div>`
    ).join('');
    const archCnt = archivedSectionCount();
    const archToggle = archCnt ? `<span class="phase-tab" style="border-style:dashed;color:var(--text2);cursor:pointer" onclick="showArchivedSections=!showArchivedSections;renderMain()">${showArchivedSections?'Hide':'Show'} archived (${archCnt})</span>` : '';
    body = `<div class="section-header"><h2>Sections</h2><button class="btn btn-primary btn-sm" onclick="openSectionModal()">+ New Section</button></div>
      <div class="phase-tabs">${secTabs}${archToggle}</div>
      ${renderNonProject()}`;
  }
  else if (devProjectTab === 'milestones') {
    currentProjectId = p.id;
    body = renderMilestones();
  }
  else body = '<div class="empty-state"><p>Tab not found.</p></div>';

  return `<div class="dev-sub-tabs">${subTabsHtml}</div>${body}`;
}


// ════════════════════════════════════════════════════════════════════
// DATA ALIAS & COMPATIBILITY LAYER FOR DEV MODULE
// ════════════════════════════════════════════════════════════════════
// data always points to current state (handles reassignment)
Object.defineProperty(window, 'data', { get: function() { return state; }, set: function(v) { state = v; }, configurable: true });
// fmt alias (dev uses fmt, app uses fmtDate)
function fmt(d) { return fmtDate(d); }
// today alias (dev uses today(), app uses todayStr())
function today() { return todayStr(); }
// logChange implementation
function logChange(projectName, section, detail) {
  if (!state.changeLog) state.changeLog = [];
  state.changeLog.unshift({ id: uid(), timestamp: new Date().toISOString(), project: projectName || '—', section, detail });
  if (state.changeLog.length > 500) state.changeLog.length = 500;
}
// openModalDev: accepts (title, bodyHtml, onSaveFn) — dev.html modal signature
function openModalDev(title, bodyHtml, onSave) {
  document.getElementById('modalContent').innerHTML =
    '<div class="modal-hdr"><h2>' + title + '</h2><button class="modal-close" onclick="closeModal()">&times;</button></div>' +
    '<div class="modal-body">' + bodyHtml + '</div>' +
    '<div class="modal-footer"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="_devSaveBtn">Save</button></div>';
  document.getElementById('modalOverlay').classList.add('show');
  document.getElementById('_devSaveBtn').onclick = function() { if (onSave) onSave(); };
}
// fmtCurrency
function fmtCurrency(val) {
  if (!val && val !== 0) return '—';
  const num = parseFloat(String(val).replace(/[^0-9.-]/g, ''));
  if (isNaN(num)) return String(val);
  return '$' + num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
// openPhaseSchedule (portfolio schedule row links)
function openPhaseSchedule(projId, phaseId) {
  selectedProjectId = projId; currentView = 'project'; devProjectTab = 'schedule'; devPhaseFilter = phaseId;
  renderSidebar(); renderMain();
}
// Weather stubs (weather subsystem not included in merge)
function wxPhaseRainHtml(p, ph) { return '<span style="color:var(--text2)">—</span>'; }
function wxEnsureSettings() {}
function wxDefaultThreshold() { return 0.1; }
function wxPhaseRain() { return null; }
// Export/Import JSON
function exportJSON() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'taskaura-backup-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
}
function importJSON(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = evt => {
    try {
      const imported = JSON.parse(evt.target.result);
      if (!imported.projects) throw new Error('Invalid backup file');
      if (!confirm('This will replace all current data. Continue?')) return;
      state = imported;
      if (!state.nonProject) state.nonProject = {};
      if (!state.milestones) state.milestones = [];
      if (!state.changeLog) state.changeLog = [];
      saveState(); showToast('Import successful'); navTo('dashboard');
    } catch (err) { alert('Import failed: ' + err.message); }
  };
  reader.readAsText(file);
}


// ════════════════════════════════════════════════════════════════════
// PHASE HELPERS (archive/unarchive, variance, stage badge)
// ════════════════════════════════════════════════════════════════════
function migratePhase(ph) {
  if(ph.originalSubComp===undefined) ph.originalSubComp = ph.targetCompletion || '';
  if(ph.constructionStart===undefined) ph.constructionStart = '';
  if(ph.currentStage===undefined) ph.currentStage = 'Pre-Construction';
  if(ph.archived===undefined) ph.archived = false;
  if(ph.archivedDate===undefined) ph.archivedDate = '';
  return ph;
}
// ---- Phase visibility helpers ----
// A phase carries an `archived` flag. Archived phases are hidden from the dashboard,
// the Schedule/Bidding/Utilities/Notes phase tabs, the Milestone tracker, and the PDF
// reports — but their data is preserved and revealed by the global "Show archived" toggle.
function activePhases(p){ return (p.phases||[]).filter(ph=>!ph.archived); }
function visiblePhases(p){ return showArchivedPhases ? (p.phases||[]) : activePhases(p); }
function archivedCount(p){ return (p.phases||[]).filter(ph=>ph.archived).length; }
// A small clickable chip that toggles the global show-archived state. Empty when no archived phases exist.
function archivedToggleChip(p){
  const n = archivedCount(p); if(!n) return '';
  return `<span class="phase-tab" style="border-style:dashed;color:var(--text-muted);cursor:pointer" onclick="showArchivedPhases=!showArchivedPhases;renderMain()">${showArchivedPhases?'Hide':'Show'} archived (${n})</span>`;
}
// Quick archive/unarchive of a single phase (used from the Schedule phase bar).
function setPhaseArchived(projId, phaseId, val){
  const p = data.projects.find(x=>x.id===projId);
  const ph = (p.phases||[]).find(x=>x.id===phaseId);
  if(!ph) return;
  ph.archived = val; ph.archivedDate = val ? todayStr() : '';
  logChange(p.name,'Project Info',`Phase "${ph.name}" ${val?'archived':'unarchived'}`);
  saveState(); showToast('Saved'); renderMain();
}
// Net schedule variance for a phase = sum of delay/improvement working days across its
// CRITICAL PATH schedule items only (secondary items don't move substantial completion).
// Positive = behind, negative = ahead.
function phaseVariance(p, phaseId) {
  migratePhase((p.phases||[]).find(x=>x.id===phaseId)||{});
  const ph = (p.phases||[]).find(x=>x.id===phaseId) || {};
  let net = 0;
  (p.schedule||[]).filter(s=>s.phaseId===phaseId && (s.category||'secondary')==='critical-path')
    .forEach(s => (s.delays||[]).forEach(d => net += (d.workingDays||0)));
  const orig = ph.originalSubComp || '';
  const cur = orig ? addWorkingDays(orig, net) : '';
  return { constructionStart: ph.constructionStart||'', orig, cur, net };
}
function daysVarianceHtml(net) {
  if(net > 0) return `<span style="color:var(--danger);font-weight:700">${net} day${net===1?'':'s'} behind</span>`;
  if(net < 0) return `<span style="color:var(--success);font-weight:700">${-net} day${net===-1?'':'s'} ahead</span>`;
  return `<span style="color:var(--text-muted)">On schedule</span>`;
}

function stageBadge(stage) {
  const s = stage || 'Pre-Construction';
  let color = 'blue';
  if (s === 'ON HOLD') color = 'red';
  else if (s === 'Substantial Completion') color = 'green';
  else if (s === 'Pre-Construction') color = 'gray';
  return `<span class="badge badge-${color}">${esc(s)}</span>`;
}

// ════════════════════════════════════════════════════════════════════
// SCHEDULE, GANTT & DELAY LOG
// ════════════════════════════════════════════════════════════════════
function renderSchedule(p) {
  if(!p.schedule) p.schedule=[];
  const allPhases = p.phases||[];
  if(!allPhases.length) return `<div class="empty-state"><p>No phases defined. Use “Edit Info” above to add a phase.</p></div>`;
  const phaseList = visiblePhases(p);
  if(!phaseList.length) return `<div class="phase-tabs">${archivedToggleChip(p)}</div><div class="empty-state"><p>All phases are archived. Use “Show archived” to view them.</p></div>`;
  // Each phase is standalone — no "All Phases". Default to first visible phase.
  if(!phaseList.some(ph=>ph.id===devPhaseFilter)) devPhaseFilter = phaseList[0].id;
  const ph = phaseList.find(x=>x.id===devPhaseFilter);
  const phaseTabsHtml = phaseList.map(x=>`<div class="phase-tab ${devPhaseFilter===x.id?'active':''}" style="${x.archived?'border-style:dashed;opacity:.7':''}" onclick="devPhaseFilter='${x.id}';renderMain()">${esc(x.name)}${x.archived?' <span style="font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted)">arch</span>':''}</div>`).join('') + archivedToggleChip(p);
  const items = p.schedule.filter(s=>s.phaseId===devPhaseFilter);

  migratePhase(ph);
  const stage = ph.currentStage || 'Pre-Construction';
  const stageOpts = PHASE_STAGES.map(st=>`<option value="${esc(st)}" ${stage===st?'selected':''}>${esc(st)}</option>`).join('');
  const v = phaseVariance(p, ph.id);
  const lbl = 'font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted)';
  const ro = 'font-size:14px;font-weight:600;padding-top:4px';
  const phaseBar = `<div class="card" style="margin-bottom:16px;padding:14px 16px;display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap">
    <div style="display:flex;flex-direction:column;gap:4px">
      <label style="${lbl}">Current Stage — ${esc(ph.name)}</label>
      <select onchange="setPhaseField('${p.id}','${ph.id}','currentStage',this.value)" style="font-weight:600">${stageOpts}</select>
    </div>
    <div style="display:flex;flex-direction:column;gap:4px">
      <label style="${lbl}">Construction Start</label>
      <input type="date" value="${v.constructionStart||''}" onchange="setPhaseField('${p.id}','${ph.id}','constructionStart',this.value)">
    </div>
    <div style="display:flex;flex-direction:column;gap:4px">
      <label style="${lbl}">Original Projected Sub. Comp.</label>
      <input type="date" value="${v.orig||''}" onchange="setPhaseField('${p.id}','${ph.id}','originalSubComp',this.value)">
    </div>
    <div style="display:flex;flex-direction:column;gap:4px">
      <label style="${lbl}">Current Sub. Comp.</label>
      <div style="${ro};${v.net>0?'color:var(--danger)':''}">${v.cur?fmtDate(v.cur):'—'}</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:4px">
      <label style="${lbl}">Days Ahead / Behind</label>
      <div style="${ro}">${daysVarianceHtml(v.net)}</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:4px">
      <label style="${lbl}">Rain Days <span style="text-transform:none;font-weight:400">· this phase</span></label>
      <div style="${ro}">${wxPhaseRainHtml(p, ph)}</div>
    </div>
    <div style="margin-left:auto;align-self:center;display:flex;gap:8px;align-items:center">${stageBadge(stage)}${ph.archived?`<span class="badge badge-gray">Archived</span><button class="btn btn-sm" onclick="setPhaseArchived('${p.id}','${ph.id}',false)">Unarchive</button>`:`<button class="btn btn-sm" title="Archive this phase (hides it from active views and the report)" onclick="setPhaseArchived('${p.id}','${ph.id}',true)">Archive</button>`}</div>
  </div>`;

  function scheduleRow(s, idx, arr) {
    const delayCount = (s.delays||[]).length;
    const totalDelayDays = (s.delays||[]).reduce((sum,d)=>sum+(d.workingDays||0),0);
    const slipped = s.originalFinish && s.projectedFinish && s.projectedFinish > s.originalFinish;
    const projStyle = slipped ? 'color:var(--danger);font-weight:600' : '';
    const isFirst = idx===0, isLast = idx===arr.length-1;
    return `<tr>
      <td>${esc(s.task)}${(s.predecessors||[]).length?`<div class="sched-note" style="border-left-color:var(--info);font-style:normal">⇠ After: ${getPredNames(p,s).map(esc).join(', ')}</div>`:''}${s.notes?`<div class="sched-note">📝 ${esc(s.notes)}</div>`:''}</td>
      <td>${fmtDate(s.startDate)}</td>
      <td style="${projStyle}">${fmtDate(s.projectedFinish)}${slipped?` <span style="font-size:10px;color:var(--text-muted)">(was ${fmtDate(s.originalFinish)})</span>`:''}</td>
      <td>${statusBadge(s.status)}</td>
      <td><div class="progress-bar" style="width:60px;display:inline-block;vertical-align:middle"><div class="progress-fill" style="width:${pct(s.percentComplete||0)}%"></div></div> <span style="font-size:11px">${pct(s.percentComplete||0)}%</span></td>
      <td>${delayCount?`<span class="delay-badge" onclick="event.stopPropagation();openDelayLog('${p.id}','${s.id}')">${totalDelayDays}d (${delayCount})</span>`:'—'}</td>
      <td><div class="table-actions"><button title="Move up" ${isFirst?'disabled style="opacity:.3;cursor:default"':''} onclick="moveScheduleItem('${p.id}','${s.id}',-1)">↑</button><button title="Move down" ${isLast?'disabled style="opacity:.3;cursor:default"':''} onclick="moveScheduleItem('${p.id}','${s.id}',1)">↓</button><button onclick="openScheduleModal('${p.id}','${s.id}')">Edit</button><button onclick="openDelayModal('${p.id}','${s.id}')">± Adj</button><button class="btn-del" onclick="deleteScheduleItem('${p.id}','${s.id}')">Del</button></div></td>
    </tr>`;
  }

  const cpItems = items.filter(s=>(s.category||'secondary')==='critical-path');
  const secItems = items.filter(s=>(s.category||'secondary')!=='critical-path');
  let tbody = '';
  if(cpItems.length) { tbody += `<tr><td colspan="7" style="background:var(--danger-light);font-weight:700;font-size:12px;padding:6px 12px">CRITICAL PATH</td></tr>` + cpItems.map(scheduleRow).join(''); }
  if(secItems.length) { tbody += `<tr><td colspan="7" style="background:var(--info-light);font-weight:700;font-size:12px;padding:6px 12px">SECONDARY</td></tr>` + secItems.map(scheduleRow).join(''); }
  if(!tbody) tbody = '<tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:20px">No schedule items yet</td></tr>';

  const body = scheduleViewMode==='gantt' ? renderGantt(p, ph, items)
    : scheduleViewMode==='delays' ? renderDelayLog(p, ph)
    : `<div class="card"><table><thead><tr><th>Task</th><th>Start Date</th><th>Projected Finish</th><th>Status</th><th>Progress</th><th>Delays</th><th>Actions</th></tr></thead><tbody>${tbody}</tbody></table></div>`;
  return `<div class="phase-tabs">${phaseTabsHtml}</div>
    ${phaseBar}
    <div class="section-header"><h2>Development Schedule — ${esc(ph.name)}</h2>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <div class="view-toggle">
          <button class="${scheduleViewMode==='table'?'vt-active':''}" onclick="scheduleViewMode='table';renderMain()">Table</button>
          <button class="${scheduleViewMode==='gantt'?'vt-active':''}" onclick="scheduleViewMode='gantt';renderMain()">Gantt</button>
          <button class="${scheduleViewMode==='delays'?'vt-active':''}" onclick="scheduleViewMode='delays';renderMain()">Delay Log</button>
        </div>
        <button class="btn btn-sm" onclick="exportScheduleCSV('${p.id}')">Export CSV</button>
        <button class="btn btn-sm" onclick="printSchedule('${p.id}')">Export PDF</button>
        <button class="btn btn-primary btn-sm" onclick="openScheduleModal('${p.id}')">+ Add Item</button>
      </div>
    </div>
    ${body}`;
}

function setPhaseField(projId, phaseId, field, val) {
  const p = data.projects.find(x=>x.id===projId);
  const ph = (p.phases||[]).find(x=>x.id===phaseId);
  if(!ph) return;
  const labels = {currentStage:'current stage', constructionStart:'construction start', originalSubComp:'original projected sub. completion'};
  if(ph[field]!==val) {
    const disp = field==='currentStage' ? val : (val ? fmtDate(val) : 'cleared');
    logChange(p.name,'Schedule',`${ph.name} ${labels[field]||field} → ${disp}`);
  }
  ph[field] = val;
  saveState(); showToast('Saved'); renderMain();
}

function openScheduleModal(projId, itemId) {
  const p = data.projects.find(x=>x.id===projId);
  const item = itemId ? p.schedule.find(s=>s.id===itemId) : null;
  const defaultPhase = (p.phases||[]).some(ph=>ph.id===devPhaseFilter) ? devPhaseFilter : (p.phases[0]?.id||'');
  const s = item || {phaseId:defaultPhase, category:'critical-path', task:'', startDate:'', projectedFinish:'', originalFinish:'', status:'not-started', percentComplete:0, notes:''};
  const phaseOpts = (p.phases||[]).map(ph=>`<option value="${ph.id}" ${s.phaseId===ph.id?'selected':''}>${esc(ph.name)}</option>`).join('');
  const catOpts = [['critical-path','Critical Path'],['secondary','Secondary']].map(([v,l])=>`<option value="${v}" ${(s.category||'secondary')===v?'selected':''}>${l}</option>`).join('');
  const statuses = ['not-started','in-progress','delayed','completed','on-hold'];
  const statusOpts = statuses.map(st=>`<option value="${st}" ${s.status===st?'selected':''}>${st.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}</option>`).join('');
  const totalDelays = (s.delays||[]).reduce((sum,d)=>sum+(d.workingDays||0),0);
  const body = `
    <div class="form-row"><div class="form-group"><label>Phase</label><select id="sf-phase">${phaseOpts}</select></div><div class="form-group"><label>Category</label><select id="sf-cat">${catOpts}</select></div><div class="form-group"><label>Status</label><select id="sf-status">${statusOpts}</select></div></div>
    <div class="form-group"><label>Task</label><input id="sf-task" value="${esc(s.task)}"></div>
    <div class="form-row"><div class="form-group"><label>Start Date</label><input type="date" id="sf-start" value="${s.startDate}"></div><div class="form-group"><label>Projected Finish</label><input type="date" id="sf-finish" value="${s.projectedFinish}"></div></div>
    ${item&&totalDelays?`<div style="font-size:12px;color:var(--text-muted);margin-bottom:12px">Original finish: ${fmtDate(s.originalFinish)} | Total delays: ${totalDelays} working days</div>`:''}
    <div class="form-group"><label>% Complete</label><input type="number" id="sf-pct" min="0" max="100" value="${s.percentComplete||0}"></div>
    <div class="form-group"><label>Predecessors <span style="font-weight:400;text-transform:none">(when these tasks move, this task shifts with them)</span></label><div id="sf-preds" style="max-height:150px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius);padding:6px 10px"></div></div>
    <div class="form-group"><label>Notes</label><textarea id="sf-notes">${esc(s.notes||'')}</textarea></div>`;
  openModalDev(item?'Edit Schedule Item':'Add Schedule Item', body, () => {
    const newFinish = document.getElementById('sf-finish').value;
    const vals = {phaseId:document.getElementById('sf-phase').value, category:document.getElementById('sf-cat').value, task:document.getElementById('sf-task').value.trim(), startDate:document.getElementById('sf-start').value, projectedFinish:newFinish, status:document.getElementById('sf-status').value, percentComplete:pct(parseInt(document.getElementById('sf-pct').value)||0), notes:document.getElementById('sf-notes').value.trim()};
    vals.predecessors = [...document.querySelectorAll('.sf-pred:checked')].map(cb=>cb.value);
    if(!vals.task) return alert('Task required');
    // Keep status and % in sync: completing a task implies 100%
    if(vals.status==='completed') vals.percentComplete = 100;
    if(item) {
      // Working-day delta for cascading to dependents (computed before overwrite)
      const delta = workingDaysBetween(item.projectedFinish, vals.projectedFinish);
      // If user manually changed projected finish, update original too if no delays exist
      if(item.projectedFinish!==vals.projectedFinish) {
        logChange(p.name,'Schedule',`"${vals.task}" projected finish changed from ${fmtDate(item.projectedFinish)} to ${fmtDate(vals.projectedFinish)}`);
        if(!(item.delays||[]).length) vals.originalFinish = vals.projectedFinish;
      }
      if(item.status!==vals.status) logChange(p.name,'Schedule',`"${vals.task}" status → ${vals.status}`);
      // If the item moved to a different phase, same-phase-only links to it are no longer valid
      if(item.phaseId!==vals.phaseId) p.schedule.forEach(x=>{ if((x.predecessors||[]).includes(item.id)) x.predecessors = x.predecessors.filter(id=>id!==item.id); });
      Object.assign(item, vals);
      cascadeShift(p, item, delta);
    } else {
      vals.originalFinish = vals.projectedFinish;
      p.schedule.push({id:uid(), ...vals, delays:[]});
      logChange(p.name,'Schedule',`Added "${vals.task}" (${vals.category})`);
    }
    saveState(); showToast('Saved'); renderMain();
  });
  // Predecessor picker: tasks in the selected phase, minus self and anything that would create a loop
  const buildPredList = checked => {
    const phaseId = document.getElementById('sf-phase').value;
    const cands = p.schedule.filter(x => x.phaseId===phaseId && x.id!==(item?item.id:null) && !(item && wouldCreateCycle(p, item.id, x.id)));
    document.getElementById('sf-preds').innerHTML = cands.length
      ? cands.map(c=>`<label style="display:flex;gap:7px;align-items:center;font-size:12.5px;text-transform:none;font-weight:400;letter-spacing:0;color:var(--text);padding:3px 0;margin:0;cursor:pointer"><input type="checkbox" class="sf-pred" value="${c.id}" ${checked.includes(c.id)?'checked':''} style="width:auto;margin:0">${esc(c.task)}</label>`).join('')
      : '<div style="font-size:12px;color:var(--text-muted)">No other tasks in this phase</div>';
  };
  buildPredList(s.predecessors||[]);
  document.getElementById('sf-phase').addEventListener('change', ()=>buildPredList([]));
}

function deleteScheduleItem(projId, itemId) {
  if(!confirm('Delete this schedule item?')) return;
  const p = data.projects.find(x=>x.id===projId);
  const item = p.schedule.find(s=>s.id===itemId);
  logChange(p.name,'Schedule',`Deleted "${item?.task}"`);
  p.schedule = p.schedule.filter(s=>s.id!==itemId);
  // Remove dangling predecessor references to the deleted item
  p.schedule.forEach(x=>{ if((x.predecessors||[]).includes(itemId)) x.predecessors = x.predecessors.filter(id=>id!==itemId); });
  saveState(); showToast('Saved'); renderMain();
}

// Reorder a schedule item up (dir=-1) or down (dir=1) within its own
// phase + category group, which is how the table is rendered.
function moveScheduleItem(projId, itemId, dir) {
  const p = data.projects.find(x=>x.id===projId);
  const item = p.schedule.find(s=>s.id===itemId);
  if(!item) return;
  const cat = item.category||'secondary';
  const sibs = p.schedule.filter(s=>s.phaseId===item.phaseId && (s.category||'secondary')===cat);
  const pos = sibs.indexOf(item);
  const swapWith = dir<0 ? sibs[pos-1] : sibs[pos+1];
  if(!swapWith) return; // already at the edge of its group
  const i1 = p.schedule.indexOf(item), i2 = p.schedule.indexOf(swapWith);
  p.schedule[i1] = swapWith; p.schedule[i2] = item;
  saveState(); showToast('Saved'); renderMain();
}

function openDelayModal(projId, itemId) {
  const p = data.projects.find(x=>x.id===projId);
  const item = p.schedule.find(s=>s.id===itemId);
  if(!item) return;
  const curFinish = item.projectedFinish || '';
  const body = `
    <div style="font-size:12px;color:var(--text-muted);margin-bottom:12px">Task: <strong>${esc(item.task)}</strong><br>Current projected finish: <strong>${fmtDate(curFinish)}</strong></div>
    <div class="form-group"><label>Date</label><input type="date" id="df-date" value="${todayStr()}"></div>
    <div class="form-group"><label>Working Days <span style="font-weight:400;text-transform:none">(positive = delay, negative = improvement)</span></label><input type="number" id="df-days" value="1"><div style="font-size:11px;color:var(--text-muted);margin-top:3px">e.g. enter <strong>5</strong> for a 5-day delay, or <strong>-3</strong> if you pulled 3 days back.</div></div>
    <div class="form-group"><label>Tag <span style="font-weight:400;text-transform:none">(cause — used for filtering the delay log)</span></label><select id="df-tag"><option value="">— Select Tag —</option>${DELAY_TAGS.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('')}</select></div>
    <div class="form-group"><label>Reason</label><textarea id="df-reason"></textarea></div>`;
  openModalDev('Log Delay / Improvement', body, () => {
    if(!item.delays) item.delays=[];
    const reason = document.getElementById('df-reason').value.trim();
    const days = parseInt(document.getElementById('df-days').value)||0;
    if(days===0) return alert('Enter a non-zero number of working days (negative for an improvement).');
    const kind = days>0 ? 'Delay' : 'Improvement';
    const signed = (days>0?'+':'') + days;
    // Store original finish on first entry
    if(!item.originalFinish) item.originalFinish = item.projectedFinish;
    const tag = document.getElementById('df-tag').value;
    item.delays.push({id:uid(), date:document.getElementById('df-date').value, workingDays:days, reason, tag});
    // Shift projected finish by the working days (negative pulls it earlier)
    if(item.projectedFinish) {
      const oldFinish = item.projectedFinish;
      item.projectedFinish = addWorkingDays(item.projectedFinish, days);
      logChange(p.name,'Schedule',`${kind}: "${item.task}" ${signed}wd — ${reason}. Projected finish ${fmtDate(oldFinish)} → ${fmtDate(item.projectedFinish)}`);
    } else {
      logChange(p.name,'Schedule',`${kind}: "${item.task}" ${signed}wd — ${reason}`);
    }
    // A delay flags the item; an improvement clears the delayed flag if it's no longer behind
    if(days>0 && item.status!=='delayed' && item.status!=='completed') item.status='delayed';
    else if(days<0 && item.status==='delayed') {
      const slipped = item.originalFinish && item.projectedFinish && item.projectedFinish > item.originalFinish;
      if(!slipped) item.status='in-progress';
    }
    // Ripple the shift through all dependent tasks
    cascadeShift(p, item, days);
    saveState(); showToast('Saved'); renderMain();
  });
}

function openDelayLog(projId, itemId) {

function deleteDelay(projId, itemId, delayId) {
  const p = data.projects.find(x=>x.id===projId);
