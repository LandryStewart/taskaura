<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TaskAura</title>
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@600,700&display=swap" rel="stylesheet">
<style>
:root{
 --pri:#f97316;--pri-d:#ea580c;--pri-l:#fff7ed;
 --bg:#f8fafc;--card:#fff;--text:#0f172a;--text2:#475569;--border:#e2e8f0;
 --shadow:0 2px 8px rgba(0,0,0,.08);
 --crit:#dc2626;--high:#f97316;--med:#7c3aed;--low:#16a34a;
 --hdr:48px;--radius:8px;--sidebar-w:240px;
 --success:#16a34a;--success-light:#dcfce7;
 --warning:#d97706;--warning-light:#fef3c7;
 --danger:#dc2626;--danger-light:#fee2e2;
 --info:#0891b2;--info-light:#cffafe;
}
[data-theme="dark"]{
 --bg:#0d1117;--card:#161b22;--text:#e6edf3;--text2:#7d8590;--border:#21262d;
 --shadow:0 2px 12px rgba(0,0,0,.5);--pri-l:#431407;
 --success-light:#052e16;--warning-light:#451a03;--danger-light:#450a0a;--info-light:#083344;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;}
button{cursor:pointer;font-family:inherit;}
input,select,textarea{font-family:inherit;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:7px 10px;font-size:13px;outline:none;}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 2px rgba(249,115,22,.15);}
textarea{resize:vertical;min-height:60px;}

/* Auth */
.auth-overlay{position:fixed;inset:0;background:linear-gradient(135deg,#0d1117 0%,#1a0a00 50%,#7c2d12 100%);display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s;}
.auth-overlay.hidden{opacity:0;visibility:hidden;pointer-events:none;}
.auth-card{background:#fff;border-radius:16px;padding:40px 36px;width:400px;max-width:92vw;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center;}
.auth-card h1{font-size:22px;color:var(--pri-d);margin-bottom:4px;}
.auth-card .auth-sub{font-size:13px;color:#777;margin-bottom:24px;}
.auth-card input{width:100%;padding:11px 14px;border:1px solid #d0d5dd;border-radius:8px;font-size:14px;margin-bottom:12px;background:#f9fafb;}
.auth-card input:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(249,115,22,.15);}
.auth-card .auth-btn{width:100%;padding:11px;background:linear-gradient(135deg,var(--pri-d),var(--pri));color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;margin-top:4px;}
.auth-card .auth-btn:hover{opacity:.9;}
.auth-error{color:var(--crit);font-size:12px;font-weight:600;margin-bottom:8px;min-height:18px;}
.auth-toggle{font-size:13px;color:var(--pri);cursor:pointer;margin-top:16px;}
.auth-toggle:hover{text-decoration:underline;}

/* Topbar */
.topbar{background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;height:var(--hdr);gap:12px;flex-shrink:0;z-index:100;}
.topbar .logo{display:flex;align-items:center;gap:8px;font-family:'General Sans',sans-serif;font-weight:700;font-size:17px;color:var(--text);white-space:nowrap;}
.logo-tile{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--pri-d),var(--pri));display:inline-flex;align-items:center;justify-content:center;font-size:14px;color:#fff;font-weight:600;flex-shrink:0;}
.topbar .spacer{flex:1;}
.top-btn{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:6px;font-size:12px;font-weight:500;display:flex;align-items:center;gap:5px;transition:all .15s;white-space:nowrap;}
.top-btn:hover{border-color:var(--pri);color:var(--pri);}
.top-btn.accent{background:linear-gradient(135deg,var(--pri-d),var(--pri));color:#fff;border:none;font-weight:700;}
.top-btn.accent:hover{opacity:.9;}
.dark-toggle{background:none;border:none;color:var(--text);font-size:18px;padding:4px;cursor:pointer;}

/* Layout */
.app-body{display:flex;flex:1;min-height:0;overflow:hidden;}
.sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0;}
.sidebar-section{padding:12px;}
.sidebar-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text2);margin-bottom:8px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--radius);font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;transition:all .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nav-item:hover{background:var(--pri-l);color:var(--text);}
.nav-item.active{background:var(--pri);color:#fff;}
.nav-item .nav-icon{font-size:15px;flex-shrink:0;width:20px;text-align:center;}
.nav-item-add{color:var(--pri);font-weight:600;}
.nav-divider{height:1px;background:var(--border);margin:4px 12px;}

/* Main content */
.main-content{flex:1;overflow-y:auto;padding:24px;min-width:0;}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.card-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.card-header h3{font-size:14px;font-weight:700;}
.card-body{padding:18px;}

/* Badges */
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;white-space:nowrap;}
.badge-green{background:var(--success-light);color:#15803d;}
.badge-yellow{background:var(--warning-light);color:#a16207;}
.badge-red{background:var(--danger-light);color:#dc2626;}
.badge-blue{background:var(--info-light);color:#0e7490;}
.badge-gray{background:#f1f5f9;color:#475569;}
[data-theme="dark"] .badge-gray{background:#1e293b;color:#94a3b8;}
.badge-orange{background:#fff7ed;color:#c2410c;}
[data-theme="dark"] .badge-orange{background:#431407;color:#fb923c;}
.badge-purple{background:#f5f3ff;color:#7c3aed;}
[data-theme="dark"] .badge-purple{background:#2e1065;color:#a78bfa;}

/* Buttons */
.btn{padding:7px 16px;border-radius:var(--radius);font-size:13px;font-weight:500;border:1px solid var(--border);background:var(--card);color:var(--text);transition:all .15s;}
.btn:hover{border-color:var(--pri);color:var(--pri);}
.btn-primary{background:var(--pri);color:#fff;border-color:var(--pri);}
.btn-primary:hover{background:var(--pri-d);border-color:var(--pri-d);color:#fff;}
.btn-sm{padding:4px 10px;font-size:12px;}
.btn-danger{color:var(--crit);border-color:var(--danger-light);}
.btn-danger:hover{background:var(--danger-light);}

/* Project info bar */
.project-bar{background:linear-gradient(135deg,#0d1117,#1a0a00,#431407);color:#fff;border-radius:var(--radius);padding:18px 22px;margin-bottom:20px;display:flex;gap:28px;align-items:center;flex-wrap:wrap;}
.project-bar .pb-name{font-size:20px;font-weight:800;}
.project-bar .pb-meta{font-size:12px;opacity:.8;}
.project-bar .pb-item{display:flex;flex-direction:column;gap:2px;}
.project-bar .pb-label{font-size:10px;text-transform:uppercase;letter-spacing:.5px;opacity:.6;}
.project-bar .pb-value{font-size:14px;font-weight:600;}

/* Department tabs */
.dept-tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:20px;}
.dept-tab{padding:10px 20px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;white-space:nowrap;}
.dept-tab:hover{color:var(--text);}
.dept-tab.active{color:var(--pri);border-bottom-color:var(--pri);}
.dept-tab.summary-tab{margin-left:auto;color:var(--pri);}

/* Phase tabs */
.phase-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.phase-tab{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--card);transition:all .15s;}
.phase-tab:hover{border-color:var(--pri);color:var(--pri);}
.phase-tab.active{background:var(--pri);color:#fff;border-color:var(--pri);}

/* Tables */
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:var(--bg);font-weight:600;text-align:left;padding:10px 12px;border-bottom:2px solid var(--border);white-space:nowrap;}
td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:top;}
tr:hover td{background:var(--pri-l);}
.table-actions{display:flex;gap:4px;}
.table-actions button{padding:3px 8px;font-size:11px;border-radius:4px;border:1px solid var(--border);background:var(--card);cursor:pointer;}
.table-actions button:hover{border-color:var(--pri);color:var(--pri);}
.table-actions .btn-del{color:var(--crit);}
.table-actions .btn-del:hover{background:var(--danger-light);}

/* Bucket board */
.bucket-board{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;min-height:400px;}
.bucket{min-width:280px;max-width:310px;width:280px;background:var(--bg);border-radius:var(--radius);display:flex;flex-direction:column;flex-shrink:0;border:1px solid var(--border);}
[data-theme="dark"] .bucket{background:#0f1f3d;}
.bucket-hdr{display:flex;align-items:center;padding:10px 12px;gap:8px;border-bottom:1px solid var(--border);background:inherit;border-radius:var(--radius) var(--radius) 0 0;}
.bucket-title{font-weight:700;font-size:13px;flex:1;text-transform:uppercase;letter-spacing:.5px;}
.bucket-count{background:var(--pri);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;}
.bucket-cards{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px;}
.bucket-cards.drag-over{background:var(--pri-l);border-radius:6px;}
.task-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 12px;cursor:pointer;transition:transform .15s,box-shadow .15s;border-left:4px solid var(--border);}
.task-card:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.12);}
.task-card.dragging{opacity:.4;}
.task-card.pri-critical{border-left-color:var(--crit);}
.task-card.pri-high{border-left-color:var(--high);}
.task-card.pri-medium{border-left-color:var(--med);}
.task-card.pri-low{border-left-color:var(--low);}
.task-card-title{font-weight:600;font-size:13px;margin-bottom:6px;}
.task-card-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11px;color:var(--text2);}
.bucket-quick-add{padding:8px;border-top:1px solid var(--border);}
.quick-add-input{width:100%;padding:7px 10px;border:1px dashed var(--border);border-radius:6px;font-size:12px;background:transparent;color:var(--text);outline:none;}
.quick-add-input:focus{border-style:solid;border-color:var(--pri);background:var(--card);}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:500;padding:20px;}
.modal-overlay.show{display:flex;}
.modal{background:var(--card);border-radius:12px;width:580px;max-width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.modal-hdr{display:flex;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border);}
.modal-hdr h2{flex:1;font-size:16px;font-weight:700;}
.modal-close{background:none;border:none;font-size:22px;color:var(--text2);padding:4px;margin-left:auto;cursor:pointer;}
.modal-close:hover{color:var(--crit);}
.modal-body{padding:18px 22px;display:flex;flex-direction:column;gap:14px;}
.modal-body label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);display:block;margin-bottom:3px;}
.modal-body input,.modal-body select,.modal-body textarea{width:100%;}
.modal-row{display:flex;gap:12px;}
.modal-row>div{flex:1;}
.modal-footer{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.modal-footer button{padding:8px 20px;border-radius:6px;font-size:13px;font-weight:600;}

/* Form groups */
.form-group{margin-bottom:14px;}
.form-group label{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px;}
.form-group input,.form-group select,.form-group textarea{width:100%;}
.form-row{display:flex;gap:12px;}
.form-row .form-group{flex:1;}

/* Checklist */
.checklist{display:flex;flex-direction:column;gap:4px;}
.cl-item{display:flex;align-items:center;gap:6px;font-size:13px;}
.cl-item input[type=checkbox]{width:16px;height:16px;accent-color:var(--pri);}
.cl-item input[type=text]{flex:1;}
.cl-item .cl-rm{background:none;border:none;color:var(--crit);font-size:16px;padding:2px;cursor:pointer;}
.cl-add{font-size:12px;color:var(--pri);background:none;border:none;font-weight:600;margin-top:2px;cursor:pointer;}
.cl-add:hover{text-decoration:underline;}

/* Progress bar */
.progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;border-radius:3px;transition:width .3s;}
.pf-green{background:var(--success);}
.pf-orange{background:var(--pri);}
.pf-red{background:var(--crit);}

/* Dashboard */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:24px;}
.kpi-card{background:var(--card);border-radius:14px;padding:20px;border:1px solid var(--border);box-shadow:var(--shadow);border-top:3px solid var(--border);}
.kpi-card.kpi-pri{border-top-color:var(--pri);}
.kpi-card.kpi-red{border-top-color:var(--crit);}
.kpi-card.kpi-green{border-top-color:var(--success);}
.kpi-card.kpi-purple{border-top-color:var(--med);}
.kpi-num{font-size:32px;font-weight:900;line-height:1;color:var(--text);}
.kpi-card.kpi-pri .kpi-num{color:var(--pri);}
.kpi-card.kpi-red .kpi-num{color:var(--crit);}
.kpi-card.kpi-green .kpi-num{color:var(--success);}
.kpi-card.kpi-purple .kpi-num{color:var(--med);}
.kpi-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text2);margin-top:6px;}

/* Hero */
.hero{border-radius:16px;padding:28px;background:linear-gradient(135deg,#0d1117 0%,#1a0a00 50%,#431407 100%);color:#fff;margin-bottom:24px;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;inset:-10%;background:radial-gradient(ellipse at 80% 20%,rgba(249,115,22,.2) 0%,transparent 60%);pointer-events:none;}
.hero-content{position:relative;z-index:1;}
.hero-greeting{font-size:12px;font-weight:600;color:rgba(251,191,36,.85);letter-spacing:.8px;text-transform:uppercase;margin-bottom:4px;}
.hero-name{font-size:26px;font-weight:900;margin-bottom:6px;}
.hero-date{font-size:13px;color:rgba(203,213,225,.7);}

/* Calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border-radius:var(--radius);overflow:hidden;}
.cal-hdr{background:var(--pri-d);color:#fff;padding:8px;text-align:center;font-size:11px;font-weight:700;text-transform:uppercase;}
.cal-cell{background:var(--card);padding:6px;min-height:90px;cursor:pointer;transition:background .15s;}
.cal-cell:hover{background:var(--pri-l);}
.cal-cell.outside{opacity:.4;}
.cal-cell.today{box-shadow:inset 0 0 0 2px var(--pri);}
.cal-date{font-size:12px;font-weight:700;color:var(--text2);margin-bottom:4px;}
.cal-date .today-num{background:var(--pri);color:#fff;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;}
.cal-tasks{display:flex;flex-direction:column;gap:2px;}
.cal-task-pill{padding:2px 5px;border-radius:3px;font-size:10px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-left:3px solid var(--border);}
.cal-task-pill.pri-critical{border-left-color:var(--crit);background:var(--danger-light);color:#991b1b;}
.cal-task-pill.pri-high{border-left-color:var(--high);background:#fff7ed;color:#9a3412;}
.cal-task-pill.pri-medium{border-left-color:var(--med);background:#f5f3ff;color:#6d28d9;}
.cal-task-pill.pri-low{border-left-color:var(--low);background:var(--success-light);color:#15803d;}
[data-theme="dark"] .cal-task-pill.pri-critical{background:#450a0a;color:#fca5a5;}
[data-theme="dark"] .cal-task-pill.pri-high{background:#431407;color:#fdba74;}
[data-theme="dark"] .cal-task-pill.pri-medium{background:#2e1065;color:#c4b5fd;}
[data-theme="dark"] .cal-task-pill.pri-low{background:#052e16;color:#86efac;}
.cal-nav-bar{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.cal-nav-bar h3{font-size:18px;font-weight:700;min-width:200px;}
.cal-nav-btn{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;}
.cal-nav-btn:hover{background:var(--pri-l);border-color:var(--pri);}
.cal-today-btn{background:var(--pri);color:#fff;border:none;border-radius:6px;padding:5px 14px;font-size:12px;font-weight:600;cursor:pointer;}

/* Phase info bar */
.phase-bar{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px;display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;box-shadow:var(--shadow);}
.phase-field{display:flex;flex-direction:column;gap:4px;}
.phase-field-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);}
.phase-field-value{font-size:14px;font-weight:600;}

/* Section header */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap;}
.section-header h2{font-size:17px;font-weight:700;}

/* Delay badge */
.delay-badge{background:var(--danger-light);color:var(--crit);padding:1px 6px;border-radius:4px;font-size:10px;font-weight:600;cursor:pointer;}

/* Gantt */
.gantt-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.gantt-wrap svg{display:block;}

/* View toggle */
.view-toggle{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.view-toggle button{padding:5px 14px;font-size:12px;border:none;background:var(--card);color:var(--text2);cursor:pointer;}
.view-toggle button:hover{background:var(--pri-l);}
.view-toggle button.active{background:var(--pri);color:#fff;font-weight:600;}

/* Legal */
.lt-filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.lt-filters select{padding:6px 10px;font-size:12px;}
.lt-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;box-shadow:var(--shadow);border-left:4px solid var(--border);overflow:hidden;}
.lt-card.pri-Critical{border-left-color:var(--crit);}
.lt-card.pri-High{border-left-color:var(--high);}
.lt-card.pri-Medium{border-left-color:var(--med);}
.lt-card.pri-Low{border-left-color:var(--low);}
.lt-card-hdr{padding:12px 16px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:background .15s;}
.lt-card-hdr:hover{background:var(--pri-l);}
.lt-card-title{flex:1;font-weight:600;font-size:13px;}
.lt-card-body{padding:0 16px 14px;border-top:1px solid var(--border);font-size:13px;display:none;}
.lt-card-body.open{display:block;padding-top:12px;}

/* Summary panels */
.summary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
.summary-panel{background:var(--card);border-radius:var(--radius);padding:18px;border:1px solid var(--border);box-shadow:var(--shadow);}
.summary-panel h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border);}
.summary-stat{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid var(--border);}
.summary-stat:last-child{border-bottom:none;}

/* Empty state */
.empty-state{text-align:center;padding:48px 20px;color:var(--text2);}
.empty-state p{margin-bottom:12px;font-size:14px;}

/* Toast */
.toast{position:fixed;bottom:24px;right:24px;background:var(--card);border:1px solid var(--border);color:var(--text);padding:12px 20px;border-radius:var(--radius);box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:600;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;}
.toast.show{opacity:1;pointer-events:auto;}

/* Pending overlay */
.pending-overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9998;text-align:center;padding:20px;}
.pending-overlay.hidden{display:none;}
.pending-overlay h2{font-size:20px;margin-bottom:8px;}
.pending-overlay p{color:var(--text2);font-size:14px;}

/* Print */
@media print{
  .topbar,.sidebar,.modal-overlay,.toast{display:none!important;}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
// ════════════════════════════════════════════════════════════════════
// SUPABASE AUTH
// ════════════════════════════════════════════════════════════════════
const SUPABASE_URL = 'https://kxidfwesywhhdifekkqo.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Mpf3fQxq5253lluxVGdXxA_Se4rBp9z';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let currentUser = null;
let _unlockingApp = false;

function initSupabaseAuth() {
  _supabase.auth.onAuthStateChange((event, session) => {
    if (session && session.user) {
      currentUser = session.user;
      if (!document.getElementById('authOverlay').classList.contains('hidden') && !_unlockingApp) unlockApp();
    } else {
      currentUser = null;
      _unlockingApp = false;
      showLoginScreen();
    }
  });
  _supabase.auth.getSession().then(result => {
    if (result.data && result.data.session) {
      currentUser = result.data.session.user;
      if (!_unlockingApp && !document.getElementById('authOverlay').classList.contains('hidden')) unlockApp();
    } else {
      document.getElementById('authOverlay').classList.remove('hidden');
    }
  });
}

async function doLogin() {
  const email = (document.getElementById('loginEmail').value || '').trim();
  const pw = document.getElementById('loginPw').value;
  const err = document.getElementById('loginError');
  err.style.color = '#dc2626'; err.textContent = '';
  if (!email || !pw) { err.textContent = 'Enter email and password.'; return; }
  const btn = document.querySelector('#authFormSignIn .auth-btn');
  btn.textContent = 'Signing in...'; btn.disabled = true;
  const result = await _supabase.auth.signInWithPassword({ email, password: pw });
  if (result.error) { err.textContent = result.error.message; btn.textContent = 'Sign In'; btn.disabled = false; }
}

async function doSignUp() {
  const name = (document.getElementById('signupName').value || '').trim();
  const email = (document.getElementById('signupEmail').value || '').trim();
  const pw = document.getElementById('signupPw').value;
  const err = document.getElementById('loginError');
  err.style.color = '#dc2626'; err.textContent = '';
  if (!name || !email || !pw) { err.textContent = 'Fill in all fields.'; return; }
  if (pw.length < 6) { err.textContent = 'Password must be at least 6 characters.'; return; }
  const btn = document.querySelector('#authFormSignUp .auth-btn');
  btn.textContent = 'Creating account...'; btn.disabled = true;
  const result = await _supabase.auth.signUp({ email, password: pw, options: { data: { full_name: name } } });
  if (result.error) { err.textContent = result.error.message; }
  else { err.style.color = '#16a34a'; err.textContent = '✓ Check your email to confirm, then sign in.'; setTimeout(showSignIn, 3000); }
  btn.textContent = 'Create Account'; btn.disabled = false;
}

function showSignUp() { document.getElementById('authFormSignIn').style.display = 'none'; document.getElementById('authFormSignUp').style.display = 'block'; document.getElementById('authSub').textContent = 'Create a new account'; document.getElementById('loginError').textContent = ''; }
function showSignIn() { document.getElementById('authFormSignUp').style.display = 'none'; document.getElementById('authFormSignIn').style.display = 'block'; document.getElementById('authSub').textContent = 'Sign in to your account'; document.getElementById('loginError').textContent = ''; }
function showPendingApproval() { document.getElementById('authOverlay').classList.add('hidden'); document.getElementById('appContainer').classList.add('hidden'); document.getElementById('pendingOverlay').classList.remove('hidden'); }
function showLoginScreen() { window.location.href = '/'; }
function doLogout() { _supabase.auth.signOut().then(() => { window.location.href = '/'; }); }

async function unlockApp() {
  if (_unlockingApp) return;
  _unlockingApp = true;
  if (currentUser && currentUser.email !== 'landrystewart@live.com') {
    let { data: profile } = await _supabase.from('profiles').select('approved').eq('id', currentUser.id).single();
    if (!profile) {
      const uName = (currentUser.user_metadata && currentUser.user_metadata.full_name) || currentUser.email.split('@')[0];
      await _supabase.from('profiles').upsert({ id: currentUser.id, email: currentUser.email, full_name: uName, approved: false }, { onConflict: 'id' });
      _unlockingApp = false; showPendingApproval(); return;
    }
    if (!profile.approved) { _unlockingApp = false; showPendingApproval(); return; }
  }
  document.getElementById('authOverlay').classList.add('hidden');
  document.getElementById('pendingOverlay').classList.add('hidden');
  document.getElementById('appContainer').classList.remove('hidden');
  document.getElementById('appContainer').style.display = 'flex';
  loadState();
  if (currentUser) {
    const authName = (currentUser.user_metadata && currentUser.user_metadata.full_name) || currentUser.email.split('@')[0];
    if (authName) state.myName = authName;
  }
  await loadFromCloud();
  _cloudLoaded = true;
  if (currentUser) {
    const authName = (currentUser.user_metadata && currentUser.user_metadata.full_name) || currentUser.email.split('@')[0];
    if (authName && state.myName !== authName) { state.myName = authName; saveState(); }
  }
  document.getElementById('userName').textContent = state.myName;
  if (state.darkMode) document.documentElement.setAttribute('data-theme', 'dark');
  else document.documentElement.removeAttribute('data-theme');
  updateDarkIcon();
  navTo('dashboard');
  _unlockingApp = false;
}

// ════════════════════════════════════════════════════════════════════
// STATE & DATA MODEL
// ════════════════════════════════════════════════════════════════════
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => s ? String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;') : '';
const fmtDate = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
const todayStr = () => new Date().toISOString().split('T')[0];
const pct = n => Math.min(100, Math.max(0, Math.round(n)));

const PHASE_STAGES = ['Pre-Construction','Earthwork','Utilities','Crossings','Paving','Franchise Utilities','Post Pave Wet Utilities','Fine Grading/Flatwork','Final Walk','Substantial Completion','ON HOLD'];
const PRIORITIES = ['critical','high','medium','low'];
const STATUSES = ['not-started','in-progress','delayed','completed','on-hold'];
const DEPARTMENTS = ['acquisition','entitlement','development','legal'];
const DEPT_LABELS = { acquisition: 'Acquisition', entitlement: 'Entitlement', development: 'Development', legal: 'Legal' };
const DEFAULT_BUCKETS = ['To Do', 'In Progress', 'Under Review', 'Complete'];
const LT_COUNSEL_TYPES = ['Internal Counsel', 'External Counsel', 'DFW West'];
const LT_ACTION_TYPES = ['Drafting', 'Reviewing'];
const LT_STATUSES = ['Upcoming', 'In Progress', 'Holding Pattern', 'Complete'];

function getDefaultState() {
  return {
    projects: [],
    tasks: [],
    myName: '',
    darkMode: true,
    legalSettings: {
      counselTypes: [...LT_COUNSEL_TYPES],
      actionTypes: [...LT_ACTION_TYPES],
      statuses: [...LT_STATUSES]
    },
    _lastSaved: ''
  };
}

let state = getDefaultState();
let _cloudLoaded = false;
let syncTimer = null;
let currentView = 'dashboard';
let selectedProjectId = null;
let activeDeptTab = null;
let devPhaseFilter = null;
let devViewMode = 'table';
let calMonth = new Date().getMonth();
let calYear = new Date().getFullYear();

function saveState() {
  if (!_cloudLoaded) return;
  state._lastSaved = new Date().toISOString();
  localStorage.setItem('taskaura_state', JSON.stringify(state));
  debouncedCloudSave();
}

function loadState() {
  try {
    const raw = localStorage.getItem('taskaura_state');
    if (raw) state = JSON.parse(raw);
    else state = getDefaultState();
  } catch (e) { state = getDefaultState(); }
  if (!state.projects) state.projects = [];
  if (!state.tasks) state.tasks = [];
  if (!state.legalSettings) state.legalSettings = { counselTypes: [...LT_COUNSEL_TYPES], actionTypes: [...LT_ACTION_TYPES], statuses: [...LT_STATUSES] };
}

// ── Cloud Sync ──
async function syncToCloud() {
  if (!currentUser || !_cloudLoaded) return;
  try {
    await _supabase.from('workspace_blobs').upsert({
      user_id: currentUser.id,
      workspace_key: 'taskaura_v2',
      data: state,
      updated_at: new Date().toISOString()
    }, { onConflict: 'user_id,workspace_key' });
  } catch (e) { console.error('Sync error', e); }
}
function debouncedCloudSave() { if (syncTimer) clearTimeout(syncTimer); syncTimer = setTimeout(syncToCloud, 800); }

async function loadFromCloud() {
  if (!currentUser) return;
  try {
    const { data } = await _supabase.from('workspace_blobs').select('data').eq('user_id', currentUser.id).eq('workspace_key', 'taskaura_v2').single();
    if (data && data.data) {
      const cloud = data.data;
      // Use cloud if newer
      if (cloud._lastSaved && (!state._lastSaved || cloud._lastSaved > state._lastSaved)) {
        state = cloud;
        if (!state.projects) state.projects = [];
        if (!state.tasks) state.tasks = [];
        if (!state.legalSettings) state.legalSettings = { counselTypes: [...LT_COUNSEL_TYPES], actionTypes: [...LT_ACTION_TYPES], statuses: [...LT_STATUSES] };
        localStorage.setItem('taskaura_state', JSON.stringify(state));
      }
    }
  } catch (e) { /* first time, no cloud data */ }
}

function beaconSave() {
  if (!currentUser || !_cloudLoaded) return;
  try {
    const raw = localStorage.getItem('sb-kxidfwesywhhdifekkqo-auth-token');
    if (!raw) return;
    const parsed = JSON.parse(raw);
    let token = parsed.access_token || (parsed.session && parsed.session.access_token);
    if (!token) return;
    const body = JSON.stringify({ user_id: currentUser.id, workspace_key: 'taskaura_v2', data: state, updated_at: new Date().toISOString() });
    navigator.sendBeacon(SUPABASE_URL + '/rest/v1/workspace_blobs?on_conflict=user_id,workspace_key', new Blob([body], { type: 'application/json' }));
  } catch (e) {}
}
window.addEventListener('beforeunload', beaconSave);

// ════════════════════════════════════════════════════════════════════
// UTILITY FUNCTIONS
// ════════════════════════════════════════════════════════════════════
function addWorkingDays(dateStr, days) {
  if (!dateStr || !days) return dateStr;
  const d = new Date(dateStr + 'T12:00:00');
  let added = 0; const dir = days > 0 ? 1 : -1; const abs = Math.abs(days);
  while (added < abs) { d.setDate(d.getDate() + dir); if (d.getDay() !== 0 && d.getDay() !== 6) added++; }
  return d.toISOString().split('T')[0];
}

function workingDaysBetween(a, b) {
  if (!a || !b || a === b) return 0;
  const sign = b > a ? 1 : -1;
  const [from, to] = sign === 1 ? [a, b] : [b, a];
  const d = new Date(from + 'T12:00:00'), end = new Date(to + 'T12:00:00');
  let n = 0;
  while (d < end) { d.setDate(d.getDate() + 1); if (d.getDay() !== 0 && d.getDay() !== 6) n++; }
  return n * sign;
}

function statusBadge(status) {
  const map = { 'not-started': ['Not Started', 'gray'], 'in-progress': ['In Progress', 'blue'], 'delayed': ['Delayed', 'red'], 'completed': ['Completed', 'green'], 'on-hold': ['On Hold', 'yellow'], 'pending': ['Pending', 'gray'] };
  const [label, color] = map[status] || [status, 'gray'];
  return `<span class="badge badge-${color}">${esc(label)}</span>`;
}

function priorityBadge(pri) {
  const map = { critical: ['Critical', 'red'], high: ['High', 'orange'], medium: ['Medium', 'purple'], low: ['Low', 'green'] };
  const [label, color] = map[pri] || [pri, 'gray'];
  return `<span class="badge badge-${color}">${esc(label)}</span>`;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2000);
}

function openModal(title, bodyHtml, footerHtml) {
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-hdr"><h2>${title}</h2><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <div class="modal-body">${bodyHtml}</div>
    ${footerHtml ? `<div class="modal-footer">${footerHtml}</div>` : ''}`;
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('show'); }
document.getElementById('modalOverlay').addEventListener('click', e => { if (e.target.id === 'modalOverlay') closeModal(); });

function toggleDark() {
  state.darkMode = !state.darkMode;
  if (state.darkMode) document.documentElement.setAttribute('data-theme', 'dark');
  else document.documentElement.removeAttribute('data-theme');
  updateDarkIcon();
  saveState();
}
function updateDarkIcon() {
  document.getElementById('darkToggle').textContent = state.darkMode ? '☀️' : '🌙';
}

// Dates
function isThisWeek(dateStr) {
  if (!dateStr) return false;
  const d = new Date(dateStr + 'T00:00:00');
  const now = new Date(); const start = new Date(now); start.setDate(now.getDate() - now.getDay());
  const end = new Date(start); end.setDate(start.getDate() + 7);
  return d >= start && d < end;
}
function isOverdue(dateStr) {
  if (!dateStr) return false;
  return dateStr < todayStr();
}

// Tasks helpers
function getProjectTasks(projectId, dept) {
  return state.tasks.filter(t => t.projectId === projectId && (!dept || t.department === dept));
}
function getAllTasksForUser() {
  return state.tasks.filter(t => t.status !== 'completed');
}

// ════════════════════════════════════════════════════════════════════
// NAVIGATION & RENDERING
// ════════════════════════════════════════════════════════════════════
function navTo(view, opts = {}) {
  currentView = view;
  if (opts.projectId !== undefined) selectedProjectId = opts.projectId;
  if (opts.deptTab !== undefined) activeDeptTab = opts.deptTab;
  if (opts.phaseFilter !== undefined) devPhaseFilter = opts.phaseFilter;
  renderSidebar();
  renderMain();
}

function renderSidebar() {
  const list = document.getElementById('projectList');
  list.innerHTML = state.projects.map(p => `
    <div class="nav-item ${currentView === 'project' && selectedProjectId === p.id ? 'active' : ''}" onclick="navTo('project',{projectId:'${p.id}',deptTab:null})">
      <span class="nav-icon">📁</span> ${esc(p.name || 'Untitled')}
    </div>`).join('');
  const navDash = document.getElementById('navDashboard');
  navDash.className = 'nav-item' + (currentView === 'dashboard' ? ' active' : '');
}

function renderMain() {
  const mc = document.getElementById('mainContent');
  if (currentView === 'dashboard') { mc.innerHTML = renderPersonalDashboard(); }
  else if (currentView === 'project') { mc.innerHTML = renderProjectView(); }
  else { mc.innerHTML = '<div class="empty-state"><p>View not found.</p></div>'; }
}

// ════════════════════════════════════════════════════════════════════
// PERSONAL DASHBOARD
// ════════════════════════════════════════════════════════════════════
function renderPersonalDashboard() {
  const allTasks = state.tasks;
  const open = allTasks.filter(t => t.status !== 'completed');
  const dueWeek = allTasks.filter(t => isThisWeek(t.dueDate) && t.status !== 'completed');
  const overdue = allTasks.filter(t => isOverdue(t.dueDate) && t.status !== 'completed');
  const completed = allTasks.filter(t => t.status === 'completed');
  const now = new Date();
  const greeting = now.getHours() < 12 ? 'Good morning' : now.getHours() < 17 ? 'Good afternoon' : 'Good evening';
  const dateStr = now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

  return `
    <div class="hero">
      <div class="hero-content">
        <div class="hero-greeting">${greeting}</div>
        <div class="hero-name">${esc(state.myName || 'Welcome')}</div>
        <div class="hero-date">${dateStr}</div>
      </div>
    </div>

    <div class="dash-grid">
      <div class="kpi-card kpi-pri"><div class="kpi-num">${open.length}</div><div class="kpi-label">Open Tasks</div></div>
      <div class="kpi-card kpi-purple"><div class="kpi-num">${dueWeek.length}</div><div class="kpi-label">Due This Week</div></div>
      <div class="kpi-card kpi-red"><div class="kpi-num">${overdue.length}</div><div class="kpi-label">Overdue</div></div>
      <div class="kpi-card kpi-green"><div class="kpi-num">${completed.length}</div><div class="kpi-label">Completed</div></div>
    </div>

    <div class="section-header"><h2>Master Calendar</h2></div>
    ${renderMasterCalendar()}

    ${state.projects.length === 0 ? `
      <div class="empty-state" style="margin-top:32px">
        <p style="font-size:18px;margin-bottom:4px">No projects yet</p>
        <p>Create your first project to start tracking tasks across departments.</p>
        <button class="btn btn-primary" style="margin-top:12px" onclick="openProjectModal()">+ New Project</button>
      </div>` : ''}
  `;
}

// ════════════════════════════════════════════════════════════════════
// MASTER CALENDAR
// ════════════════════════════════════════════════════════════════════
function renderMasterCalendar() {
  const year = calYear, month = calMonth;
  const first = new Date(year, month, 1);
  const last = new Date(year, month + 1, 0);
  const startDay = first.getDay();
  const daysInMonth = last.getDate();
  const monthName = first.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  const today = todayStr();

  // Build task map by date
  const tasksByDate = {};
  state.tasks.forEach(t => {
    const d = t.dueDate || t.projectedFinish;
    if (d) { if (!tasksByDate[d]) tasksByDate[d] = []; tasksByDate[d].push(t); }
  });

  let cells = '';
  const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  dayNames.forEach(d => { cells += `<div class="cal-hdr">${d}</div>`; });

  // Previous month filler
  const prevLast = new Date(year, month, 0).getDate();
  for (let i = startDay - 1; i >= 0; i--) {
    cells += `<div class="cal-cell outside"><div class="cal-date">${prevLast - i}</div></div>`;
  }

  // Days
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const isToday = ds === today;
    const tasks = tasksByDate[ds] || [];
    const taskPills = tasks.slice(0, 3).map(t => {
      const pri = t.priority || 'medium';
      return `<div class="cal-task-pill pri-${pri}" title="${esc(t.taskName)}">${esc(t.taskName)}</div>`;
    }).join('');
    const more = tasks.length > 3 ? `<div style="font-size:10px;color:var(--pri);font-weight:600;cursor:pointer" onclick="showCalDay('${ds}')">+${tasks.length - 3} more</div>` : '';
    cells += `<div class="cal-cell ${isToday ? 'today' : ''}" onclick="showCalDay('${ds}')">
      <div class="cal-date">${isToday ? `<span class="today-num">${d}</span>` : d}</div>
      <div class="cal-tasks">${taskPills}${more}</div>
    </div>`;
  }

  // Next month filler
  const totalCells = startDay + daysInMonth;
  const remaining = (7 - (totalCells % 7)) % 7;
  for (let i = 1; i <= remaining; i++) {
    cells += `<div class="cal-cell outside"><div class="cal-date">${i}</div></div>`;
  }

  return `
    <div class="cal-nav-bar">
      <button class="cal-nav-btn" onclick="calPrev()">◀</button>
      <h3>${monthName}</h3>
      <button class="cal-nav-btn" onclick="calNext()">▶</button>
      <button class="cal-today-btn" onclick="calToday()">Today</button>
    </div>
    <div class="cal-grid">${cells}</div>`;
}

function calPrev() { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } renderMain(); }
function calNext() { calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } renderMain(); }
function calToday() { const n = new Date(); calMonth = n.getMonth(); calYear = n.getFullYear(); renderMain(); }

function showCalDay(ds) {
  const tasks = state.tasks.filter(t => (t.dueDate === ds || t.projectedFinish === ds));
  const dateLabel = fmtDate(ds);
  const rows = tasks.length ? tasks.map(t => `
    <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;border-left:4px solid ${t.priority === 'critical' ? 'var(--crit)' : t.priority === 'high' ? 'var(--high)' : t.priority === 'low' ? 'var(--low)' : 'var(--med)'};background:var(--bg);margin-bottom:6px;cursor:pointer" onclick="closeModal();editTask('${t.id}')">
      <div style="flex:1"><div style="font-weight:600;font-size:13px">${esc(t.taskName)}</div><div style="font-size:11px;color:var(--text2)">${DEPT_LABELS[t.department] || ''} · ${esc(getProjectName(t.projectId))}</div></div>
      ${priorityBadge(t.priority)}
    </div>`).join('')
    : '<div style="padding:20px;text-align:center;color:var(--text2);font-style:italic">No tasks on this day</div>';

  openModal(`Tasks — ${dateLabel}`, rows, `<button class="btn btn-primary" onclick="closeModal();openNewTaskModal(null,'${ds}')">+ Add Task</button>`);
}

// ════════════════════════════════════════════════════════════════════
// PROJECT VIEW
// ════════════════════════════════════════════════════════════════════
function getProject(id) { return state.projects.find(p => p.id === (id || selectedProjectId)); }
function getProjectName(id) { const p = getProject(id); return p ? p.name : '—'; }

function renderProjectView() {
  const p = getProject();
  if (!p) return '<div class="empty-state"><p>Project not found.</p></div>';

  const totalLots = (p.phases || []).reduce((s, ph) => s + (ph.lotCount || 0), 0);
  const loc = [p.city, p.county, p.state].filter(Boolean).join(', ');

  // Department tabs
  const tabs = [
    ['acquisition', 'Acquisition'],
    ['entitlement', 'Entitlement'],
    ['development', 'Development'],
    ['legal', 'Legal'],
    ['summary', 'Summary']
  ];

  const deptTab = activeDeptTab || null;

  const tabsHtml = tabs.map(([key, label]) => {
    const cls = key === 'summary' ? 'dept-tab summary-tab' : 'dept-tab';
    const active = deptTab === key ? ' active' : '';
    return `<div class="${cls}${active}" onclick="navTo('project',{deptTab:'${key}'})">${label}</div>`;
  }).join('');

  let content = '';
  if (deptTab === 'acquisition') content = renderBucketBoard(p, 'acquisition');
  else if (deptTab === 'entitlement') content = renderBucketBoard(p, 'entitlement');
  else if (deptTab === 'development') content = renderDevelopmentTab(p);
  else if (deptTab === 'legal') content = renderLegalTab(p);
  else if (deptTab === 'summary') content = renderSummaryTab(p);
  else content = renderProjectDashboard(p);

  return `
    <div class="project-bar">
      <div class="pb-item"><div class="pb-name">${esc(p.name)}</div><div class="pb-meta">${esc(loc) || '—'}</div></div>
      <div class="pb-item"><div class="pb-label">Project Manager</div><div class="pb-value">${esc(p.projectManager || '—')}</div></div>
      <div class="pb-item"><div class="pb-label">Total Lots</div><div class="pb-value">${totalLots || '—'}</div></div>
      <div class="pb-item"><div class="pb-label">Phases</div><div class="pb-value">${(p.phases || []).length}</div></div>
      <div style="margin-left:auto;display:flex;gap:8px">
        <button class="btn btn-sm" style="background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3)" onclick="openProjectModal(getProject())">Edit</button>
        <button class="btn btn-sm" style="background:rgba(255,255,255,.1);color:rgba(255,255,255,.7);border-color:rgba(255,255,255,.2)" onclick="deleteProject('${p.id}')">Delete</button>
      </div>
    </div>
    <div class="dept-tabs">${tabsHtml}</div>
    ${content}`;
}

// ── Project Dashboard (no dept tab selected) ──
function renderProjectDashboard(p) {
  const tasks = getProjectTasks(p.id);
  const devTasks = tasks.filter(t => t.department === 'development');
  const acqTasks = tasks.filter(t => t.department === 'acquisition');
  const entTasks = tasks.filter(t => t.department === 'entitlement');
  const legalTasks = tasks.filter(t => t.department === 'legal');

  const dueThisWeekAcq = acqTasks.filter(t => isThisWeek(t.dueDate) && t.status !== 'completed');
  const dueThisWeekEnt = entTasks.filter(t => isThisWeek(t.dueDate) && t.status !== 'completed');

  // Dev summary: phase table
  const phaseRows = (p.phases || []).filter(ph => !ph.archived).map(ph => {
    const v = phaseVariance(p, ph.id);
    const stage = ph.currentStage || 'Pre-Construction';
    return `<tr>
      <td style="font-weight:600">${esc(ph.name)}</td>
      <td>${ph.lotCount || '—'}</td>
      <td>${stageBadge(stage)}</td>
      <td style="${v.net > 0 ? 'color:var(--crit);font-weight:600' : ''}">${v.cur ? fmtDate(v.cur) : '—'}</td>
      <td>${daysVarianceHtml(v.net)}</td>
    </tr>`;
  }).join('') || '<tr><td colspan="5" style="color:var(--text2)">No active phases</td></tr>';

  function taskListHtml(tasks, label) {
    if (!tasks.length) return `<div style="color:var(--text2);font-size:13px;padding:8px 0">No ${label.toLowerCase()} due this week</div>`;
    return tasks.slice(0, 5).map(t => `
      <div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);cursor:pointer" onclick="editTask('${t.id}')">
        <div style="flex:1;font-size:13px;font-weight:500">${esc(t.taskName)}</div>
        ${priorityBadge(t.priority)}
        <span style="font-size:11px;color:var(--text2)">${fmtDate(t.dueDate)}</span>
      </div>`).join('');
  }

  return `
    <div class="summary-grid">
      <div class="summary-panel" style="grid-column:1/-1">
        <h3>📊 Development Summary</h3>
        <table><thead><tr><th>Phase</th><th>Lots</th><th>Current Stage</th><th>Current Sub. Compl.</th><th>Variance</th></tr></thead>
        <tbody>${phaseRows}</tbody></table>
      </div>
      <div class="summary-panel">
        <h3>🏗️ Acquisition — Due This Week</h3>
        ${taskListHtml(dueThisWeekAcq, 'acquisition tasks')}
      </div>
      <div class="summary-panel">
        <h3>📋 Entitlement — Due This Week</h3>
        ${taskListHtml(dueThisWeekEnt, 'entitlement tasks')}
      </div>
    </div>

    <div style="margin-top:24px">
      <div class="section-header"><h2>All Tasks — ${esc(p.name)}</h2></div>
      <div class="dash-grid">
        <div class="kpi-card kpi-pri"><div class="kpi-num">${tasks.filter(t=>t.status!=='completed').length}</div><div class="kpi-label">Open</div></div>
        <div class="kpi-card kpi-red"><div class="kpi-num">${tasks.filter(t=>isOverdue(t.dueDate)&&t.status!=='completed').length}</div><div class="kpi-label">Overdue</div></div>
        <div class="kpi-card kpi-green"><div class="kpi-num">${tasks.filter(t=>t.status==='completed').length}</div><div class="kpi-label">Completed</div></div>
        <div class="kpi-card kpi-purple"><div class="kpi-num">${tasks.filter(t=>t.priority==='critical'&&t.status!=='completed').length}</div><div class="kpi-label">Critical</div></div>
      </div>
    </div>`;
}

// BUCKET BOARD (Acquisition & Entitlement)
// ════════════════════════════════════════════════════════════════════
function renderBucketBoard(p, dept) {
  const tasks = getProjectTasks(p.id, dept);
  const buckets = [...DEFAULT_BUCKETS];

  const bucketsHtml = buckets.map(bucket => {
    const bucketTasks = tasks.filter(t => (t.bucket || 'To Do') === bucket);
    const cards = bucketTasks.map(t => {
      const pri = t.priority || 'medium';
      const overdue = isOverdue(t.dueDate) && t.status !== 'completed';
      return `<div class="task-card pri-${pri}" draggable="true" data-id="${t.id}"
        ondragstart="dragStart(event,'${t.id}')" ondragend="dragEnd(event)"
        onclick="editTask('${t.id}')">
        <div class="task-card-title">${esc(t.taskName)}</div>
        <div class="task-card-meta">
          ${priorityBadge(pri)}
          ${t.dueDate ? `<span style="${overdue ? 'color:var(--crit);font-weight:600' : ''}">${fmtDate(t.dueDate)}</span>` : ''}
          ${t.assignee ? `<span>👤 ${esc(t.assignee)}</span>` : ''}
          ${t.checklist && t.checklist.length ? `<span>☑ ${t.checklist.filter(c=>c.done).length}/${t.checklist.length}</span>` : ''}
        </div>
      </div>`;
    }).join('');

    return `<div class="bucket">
      <div class="bucket-hdr">
        <span class="bucket-title">${esc(bucket)}</span>
        <span class="bucket-count">${bucketTasks.length}</span>
      </div>
      <div class="bucket-cards" data-bucket="${esc(bucket)}" data-dept="${dept}" data-project="${p.id}"
        ondragover="event.preventDefault();this.classList.add('drag-over')"
        ondragleave="this.classList.remove('drag-over')"
        ondrop="bucketDrop(event,this)">
        ${cards || '<div style="padding:12px;text-align:center;color:var(--text2);font-size:12px">Drop tasks here</div>'}
      </div>
      <div class="bucket-quick-add">
        <input class="quick-add-input" placeholder="+ Add task..." data-bucket="${esc(bucket)}" data-dept="${dept}" data-project="${p.id}"
          onkeydown="if(event.key==='Enter')quickAddTask(this)">
      </div>
    </div>`;
  }).join('');

  return `
    <div class="section-header">
      <h2>${DEPT_LABELS[dept]} — ${esc(p.name)}</h2>
      <button class="btn btn-primary btn-sm" onclick="openNewTaskModal('${dept}')">+ Add Task</button>
    </div>
    <div class="bucket-board">${bucketsHtml}</div>`;
}

let draggedTaskId = null;
function dragStart(e, id) { draggedTaskId = id; e.dataTransfer.effectAllowed = 'move'; e.target.classList.add('dragging'); }
function dragEnd(e) { e.target.classList.remove('dragging'); draggedTaskId = null; document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over')); }

function bucketDrop(e, container) {
  e.preventDefault();
  container.classList.remove('drag-over');
  if (!draggedTaskId) return;
  const task = state.tasks.find(t => t.id === draggedTaskId);
  if (!task) return;
  const newBucket = container.dataset.bucket;
  task.bucket = newBucket;
  if (newBucket === 'Complete') { task.status = 'completed'; task.percentComplete = 100; }
  else if (newBucket === 'In Progress') { task.status = 'in-progress'; }
  else if (newBucket === 'Under Review') { task.status = 'in-progress'; }
  else { task.status = 'not-started'; }
  task.updatedAt = new Date().toISOString();
  saveState();
  renderMain();
}

function quickAddTask(input) {
  const name = input.value.trim();
  if (!name) return;
  const task = {
    id: uid(), department: input.dataset.dept, projectId: input.dataset.project,
    taskName: name, priority: 'medium', status: 'not-started',
    bucket: input.dataset.bucket, assignee: '', dueDate: '', percentComplete: 0,
    description: '', notes: '', checklist: [],
    createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
  };
  state.tasks.push(task);
  saveState();
  renderMain();
  showToast('Task added');
}

// DEVELOPMENT TAB
// ════════════════════════════════════════════════════════════════════
function phaseVariance(p, phaseId) {
  const ph = (p.phases || []).find(x => x.id === phaseId) || {};
  let net = 0;
  state.tasks.filter(t => t.department === 'development' && t.projectId === p.id && t.phaseId === phaseId && t.category === 'critical-path')
    .forEach(t => (t.delays || []).forEach(d => net += (d.workingDays || 0)));
  const orig = ph.originalSubComp || '';
  const cur = orig ? addWorkingDays(orig, net) : '';
  return { constructionStart: ph.constructionStart || '', orig, cur, net };
}

function stageBadge(stage) {
  let color = 'blue';
  if (stage === 'ON HOLD') color = 'red';
  else if (stage === 'Substantial Completion') color = 'green';
  else if (stage === 'Pre-Construction') color = 'gray';
  return `<span class="badge badge-${color}">${esc(stage)}</span>`;
}

function daysVarianceHtml(net) {
  if (net > 0) return `<span style="color:var(--crit);font-weight:700">${net}d behind</span>`;
  if (net < 0) return `<span style="color:var(--success);font-weight:700">${-net}d ahead</span>`;
  return `<span style="color:var(--text2)">On schedule</span>`;
}

function renderDevelopmentTab(p) {
  const phases = (p.phases || []).filter(ph => !ph.archived);
  if (!phases.length) return '<div class="empty-state"><p>No phases defined. Edit the project to add phases.</p></div>';

  if (!devPhaseFilter || !phases.find(ph => ph.id === devPhaseFilter)) devPhaseFilter = phases[0].id;
  const ph = phases.find(x => x.id === devPhaseFilter);

  const phaseTabsHtml = phases.map(x =>
    `<div class="phase-tab ${devPhaseFilter === x.id ? 'active' : ''}" onclick="devPhaseFilter='${x.id}';renderMain()">${esc(x.name)}</div>`
  ).join('');

  const items = state.tasks.filter(t => t.department === 'development' && t.projectId === p.id && t.phaseId === devPhaseFilter);
  const stage = ph.currentStage || 'Pre-Construction';
  const stageOpts = PHASE_STAGES.map(st => `<option value="${esc(st)}" ${stage === st ? 'selected' : ''}>${esc(st)}</option>`).join('');
  const v = phaseVariance(p, ph.id);

  // Phase bar
  const phaseBar = `<div class="phase-bar">
    <div class="phase-field"><div class="phase-field-label">Current Stage</div>
      <select onchange="setPhaseField('${p.id}','${ph.id}','currentStage',this.value)" style="font-weight:600;padding:4px 8px">${stageOpts}</select></div>
    <div class="phase-field"><div class="phase-field-label">Construction Start</div>
      <input type="date" value="${v.constructionStart}" onchange="setPhaseField('${p.id}','${ph.id}','constructionStart',this.value)" style="padding:4px 8px"></div>
    <div class="phase-field"><div class="phase-field-label">Original Sub. Compl.</div>
      <input type="date" value="${v.orig}" onchange="setPhaseField('${p.id}','${ph.id}','originalSubComp',this.value)" style="padding:4px 8px"></div>
    <div class="phase-field"><div class="phase-field-label">Current Sub. Compl.</div>
      <div class="phase-field-value" style="${v.net > 0 ? 'color:var(--crit)' : ''}">${v.cur ? fmtDate(v.cur) : '—'}</div></div>
    <div class="phase-field"><div class="phase-field-label">Variance</div>
      <div class="phase-field-value">${daysVarianceHtml(v.net)}</div></div>
    <div style="margin-left:auto;align-self:center">${stageBadge(stage)}</div>
  </div>`;

  // Schedule table
  const cpItems = items.filter(t => t.category === 'critical-path');
  const secItems = items.filter(t => t.category !== 'critical-path');

  function schedRow(t) {
    const slipped = t.originalFinish && t.projectedFinish && t.projectedFinish > t.originalFinish;
    const totalDelay = (t.delays || []).reduce((s, d) => s + (d.workingDays || 0), 0);
    return `<tr>
      <td style="cursor:pointer" onclick="editTask('${t.id}')">${esc(t.taskName)}</td>
      <td>${fmtDate(t.startDate)}</td>
      <td style="${slipped ? 'color:var(--crit);font-weight:600' : ''}">${fmtDate(t.projectedFinish)}${slipped ? ` <span style="font-size:10px;color:var(--text2)">(was ${fmtDate(t.originalFinish)})</span>` : ''}</td>
      <td>${statusBadge(t.status)}</td>
      <td><div class="progress-bar" style="width:60px;display:inline-block;vertical-align:middle"><div class="progress-fill pf-${(t.percentComplete||0)>=100?'green':(t.percentComplete||0)>=50?'orange':'red'}" style="width:${pct(t.percentComplete||0)}%"></div></div> <span style="font-size:11px">${pct(t.percentComplete||0)}%</span></td>
      <td>${totalDelay ? `<span class="delay-badge" onclick="event.stopPropagation();openDelayLog('${t.id}')">${totalDelay}d (${(t.delays||[]).length})</span>` : '—'}</td>
      <td><div class="table-actions">
        <button onclick="editTask('${t.id}')">Edit</button>
        <button onclick="openDelayModal('${t.id}')">± Adj</button>
        <button class="btn-del" onclick="deleteTask('${t.id}')">Del</button>
      </div></td>
    </tr>`;
  }

  let tbody = '';
  if (cpItems.length) tbody += `<tr><td colspan="7" style="background:var(--danger-light);font-weight:700;font-size:12px;padding:6px 12px">CRITICAL PATH</td></tr>` + cpItems.map(schedRow).join('');
  if (secItems.length) tbody += `<tr><td colspan="7" style="background:var(--info-light);font-weight:700;font-size:12px;padding:6px 12px">SECONDARY</td></tr>` + secItems.map(schedRow).join('');
  if (!tbody) tbody = '<tr><td colspan="7" style="text-align:center;color:var(--text2);padding:20px">No schedule items yet</td></tr>';

  const tableView = `<div class="card"><table><thead><tr><th>Task</th><th>Start</th><th>Proj. Finish</th><th>Status</th><th>Progress</th><th>Delays</th><th>Actions</th></tr></thead><tbody>${tbody}</tbody></table></div>`;

  const ganttView = devViewMode === 'gantt' ? renderGantt(p, ph, items) : '';
  const body = devViewMode === 'gantt' ? ganttView : tableView;

  return `
    <div class="phase-tabs">${phaseTabsHtml}</div>
    ${phaseBar}
    <div class="section-header">
      <h2>Schedule — ${esc(ph.name)}</h2>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <div class="view-toggle">
          <button class="${devViewMode === 'table' ? 'active' : ''}" onclick="devViewMode='table';renderMain()">Table</button>
          <button class="${devViewMode === 'gantt' ? 'active' : ''}" onclick="devViewMode='gantt';renderMain()">Gantt</button>
        </div>
        <button class="btn btn-primary btn-sm" onclick="openDevTaskModal('${p.id}','${ph.id}')">+ Add Item</button>
      </div>
    </div>
    ${body}`;
}

function setPhaseField(projId, phaseId, field, val) {
  const p = state.projects.find(x => x.id === projId);
  const ph = (p.phases || []).find(x => x.id === phaseId);
  if (!ph) return;
  ph[field] = val;
  saveState(); renderMain();
}

// ── Gantt Chart ──
function renderGantt(p, ph, items) {
  if (!items.length) return '<div class="empty-state"><p>No items to display in Gantt view.</p></div>';

  const allDates = [];
  items.forEach(t => { if (t.startDate) allDates.push(t.startDate); if (t.projectedFinish) allDates.push(t.projectedFinish); });
  if (!allDates.length) return '<div class="empty-state"><p>No dates set on schedule items.</p></div>';

  allDates.sort();
  let minDate = new Date(allDates[0] + 'T00:00:00');
  let maxDate = new Date(allDates[allDates.length - 1] + 'T00:00:00');
  minDate.setDate(minDate.getDate() - 3);
  maxDate.setDate(maxDate.getDate() + 7);

  const dayMs = 86400000;
  const totalDays = Math.ceil((maxDate - minDate) / dayMs);
  const dayW = 28, rowH = 32, headerH = 40, labelW = 200;
  const svgW = labelW + totalDays * dayW;
  const svgH = headerH + items.length * rowH;
  const today = todayStr();

  let svg = `<svg width="${svgW}" height="${svgH}" xmlns="http://www.w3.org/2000/svg" style="font-family:inherit;font-size:10px">`;

  // Header
  for (let i = 0; i < totalDays; i++) {
    const d = new Date(minDate.getTime() + i * dayMs);
    const ds = d.toISOString().split('T')[0];
    const isWe = d.getDay() === 0 || d.getDay() === 6;
    const x = labelW + i * dayW;
    if (isWe) svg += `<rect x="${x}" y="${headerH}" width="${dayW}" height="${svgH}" fill="rgba(0,0,0,.04)"/>`;
    if (d.getDate() === 1 || i === 0) svg += `<text x="${x + 2}" y="12" fill="var(--text2)" font-weight="700" font-size="9">${d.toLocaleDateString('en-US', { month: 'short' })}</text>`;
    svg += `<text x="${x + dayW / 2}" y="30" fill="var(--text2)" text-anchor="middle" font-size="9">${d.getDate()}</text>`;
    if (ds === today) svg += `<rect x="${x}" y="${headerH}" width="2" height="${svgH}" fill="var(--crit)"/>`;
  }

  // Rows
  items.forEach((t, idx) => {
    const y = headerH + idx * rowH;
    svg += `<rect x="0" y="${y}" width="${svgW}" height="${rowH}" fill="${idx % 2 ? 'rgba(0,0,0,.02)' : 'transparent'}"/>`;
    svg += `<line x1="0" y1="${y + rowH}" x2="${svgW}" y2="${y + rowH}" stroke="var(--border)" stroke-width="0.5"/>`;
    // Label
    const label = t.taskName.length > 24 ? t.taskName.slice(0, 22) + '…' : t.taskName;
    svg += `<text x="8" y="${y + rowH / 2 + 4}" fill="var(--text)" font-size="11" font-weight="500">${esc(label)}</text>`;
    // Bar
    if (t.startDate && t.projectedFinish) {
      const s = new Date(t.startDate + 'T00:00:00');
      const e = new Date(t.projectedFinish + 'T00:00:00');
      const x1 = labelW + Math.round((s - minDate) / dayMs) * dayW;
      const barW = Math.max(dayW, Math.round((e - s) / dayMs + 1) * dayW);
      const color = t.category === 'critical-path' ? '#16a34a' : '#0891b2';
      svg += `<rect x="${x1}" y="${y + 6}" width="${barW}" height="${rowH - 12}" rx="4" fill="${color}" opacity="0.7"/>`;
      // Progress fill
      const progW = Math.round(barW * (t.percentComplete || 0) / 100);
      if (progW > 0) svg += `<rect x="${x1}" y="${y + 6}" width="${progW}" height="${rowH - 12}" rx="4" fill="${color}" opacity="0.3"/>`;
    }
  });

  svg += '</svg>';
  return `<div class="gantt-wrap" style="margin-top:8px">${svg}</div>
    <div style="display:flex;gap:16px;margin-top:8px;font-size:11px;color:var(--text2)">
      <span><span style="display:inline-block;width:12px;height:8px;border-radius:2px;background:#16a34a;opacity:.7;margin-right:4px"></span>Critical Path</span>
      <span><span style="display:inline-block;width:12px;height:8px;border-radius:2px;background:#0891b2;opacity:.7;margin-right:4px"></span>Secondary</span>
      <span><span style="display:inline-block;width:12px;height:2px;background:var(--crit);margin-right:4px;vertical-align:middle"></span>Today</span>
    </div>`;
}

// ── Delay Modal ──
function openDelayModal(taskId) {
  const t = state.tasks.find(x => x.id === taskId);
  if (!t) return;
  const tags = ['Weather','Subcontractor','Material','Design Change','Owner','Other','Improvement'];
  const body = `
    <div style="font-size:12px;color:var(--text2);margin-bottom:12px">Task: <strong>${esc(t.taskName)}</strong><br>Current finish: <strong>${fmtDate(t.projectedFinish)}</strong></div>
    <div class="form-group"><label>Date</label><input type="date" id="df-date" value="${todayStr()}"></div>
    <div class="form-group"><label>Working Days (+ delay, − improvement)</label><input type="number" id="df-days" value="1"></div>
    <div class="form-group"><label>Tag</label><select id="df-tag">${tags.map(t => `<option>${t}</option>`).join('')}</select></div>
    <div class="form-group"><label>Reason</label><textarea id="df-reason"></textarea></div>`;
  openModal('Log Delay / Improvement', body,
    `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveDelay('${taskId}')">Save</button>`);
}

function saveDelay(taskId) {
  const t = state.tasks.find(x => x.id === taskId);
  if (!t) return;
  const days = parseInt(document.getElementById('df-days').value) || 0;
  if (!days) { closeModal(); return; }
  if (!t.delays) t.delays = [];
  t.delays.push({ id: uid(), date: document.getElementById('df-date').value, workingDays: days, tag: document.getElementById('df-tag').value, reason: document.getElementById('df-reason').value.trim() });
  // Update projected finish
  if (t.projectedFinish) t.projectedFinish = addWorkingDays(t.projectedFinish, days);
  t.updatedAt = new Date().toISOString();
  saveState(); closeModal(); renderMain();
  showToast(`${days > 0 ? 'Delay' : 'Improvement'} logged`);
}

function openDelayLog(taskId) {
  const t = state.tasks.find(x => x.id === taskId);
  if (!t || !t.delays || !t.delays.length) return;
  const rows = t.delays.map(d => `<tr>
    <td>${fmtDate(d.date)}</td>
    <td style="font-weight:600;color:${d.workingDays > 0 ? 'var(--crit)' : 'var(--success)'}">${d.workingDays > 0 ? '+' : ''}${d.workingDays}d</td>
    <td><span class="badge badge-gray">${esc(d.tag)}</span></td>
    <td>${esc(d.reason)}</td>
  </tr>`).join('');
  const total = t.delays.reduce((s, d) => s + (d.workingDays || 0), 0);
  openModal(`Delay Log — ${esc(t.taskName)}`,
    `<div style="margin-bottom:8px;font-size:12px;color:var(--text2)">Net: <strong style="color:${total > 0 ? 'var(--crit)' : 'var(--success)'}">${total > 0 ? '+' : ''}${total} working days</strong></div>
    <table><thead><tr><th>Date</th><th>Days</th><th>Tag</th><th>Reason</th></tr></thead><tbody>${rows}</tbody></table>`,
    `<button class="btn" onclick="closeModal()">Close</button>`);
}

function lt_calcPriority(due) {
  if (!due) return 'medium';
  const d = new Date(due + 'T00:00:00'), now = new Date();
  const diff = Math.ceil((d - now) / 86400000);
  if (diff <= 7) return 'critical';
  if (diff <= 14) return 'high';
  if (diff <= 30) return 'medium';
  return 'low';
}

function renderSummaryTab(p) {
  const tasks = getProjectTasks(p.id);
  const byDept = {};
  DEPARTMENTS.forEach(d => { byDept[d] = tasks.filter(t => t.department === d); });

  function deptSummary(dept) {
    const dt = byDept[dept] || [];
    const open = dt.filter(t => t.status !== 'completed').length;
    const completed = dt.filter(t => t.status === 'completed').length;
    const critical = dt.filter(t => t.priority === 'critical' && t.status !== 'completed').length;
    const overdue = dt.filter(t => isOverdue(t.dueDate) && t.status !== 'completed').length;
    return `<div class="summary-panel">
      <h3>${DEPT_LABELS[dept]}</h3>
      <div class="summary-stat"><span>Open Tasks</span><strong>${open}</strong></div>
      <div class="summary-stat"><span>Completed</span><strong>${completed}</strong></div>
      <div class="summary-stat"><span>Critical</span><strong style="color:${critical ? 'var(--crit)' : 'inherit'}">${critical}</strong></div>
      <div class="summary-stat"><span>Overdue</span><strong style="color:${overdue ? 'var(--crit)' : 'inherit'}">${overdue}</strong></div>
      <div class="summary-stat"><span>Total</span><strong>${dt.length}</strong></div>
    </div>`;
  }

  // Critical tasks across all departments
  const criticalTasks = tasks.filter(t => t.priority === 'critical' && t.status !== 'completed');
  const critRows = criticalTasks.length ? criticalTasks.map(t => `
    <tr onclick="editTask('${t.id}')" style="cursor:pointer">
      <td style="font-weight:600">${esc(t.taskName)}</td>
      <td>${DEPT_LABELS[t.department]}</td>
      <td>${statusBadge(t.status)}</td>
      <td>${fmtDate(t.dueDate || t.projectedFinish)}</td>
      <td>${esc(t.assignee || '—')}</td>
    </tr>`).join('')
    : '<tr><td colspan="5" style="text-align:center;color:var(--text2)">No critical tasks</td></tr>';

  return `
    <div class="section-header">
      <h2>Summary — ${esc(p.name)}</h2>
      <button class="btn btn-primary" onclick="generatePDF('${p.id}')">📄 Generate PDF Summary</button>
    </div>

    <div class="summary-grid">
      ${DEPARTMENTS.map(d => deptSummary(d)).join('')}
    </div>

    <div style="margin-top:24px">
      <div class="card">
        <div class="card-header"><h3>🔴 Critical Tasks</h3></div>
        <div class="card-body" style="padding:0">
          <table><thead><tr><th>Task</th><th>Department</th><th>Status</th><th>Due</th><th>Assignee</th></tr></thead>
          <tbody>${critRows}</tbody></table>
        </div>
      </div>
    </div>`;
}

function openPDFSummary() {
  if (selectedProjectId && currentView === 'project') {
    generatePDF(selectedProjectId);
  } else {
    // Show project picker
    if (!state.projects.length) { showToast('No projects to summarize'); return; }
    const opts = state.projects.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
    openModal('Generate PDF Summary',
      `<div class="form-group"><label>Select Project</label><select id="pdf-proj">${opts}</select></div>
       <div style="font-size:12px;color:var(--text2)">The PDF will include all department tasks sorted by priority.</div>`,
      `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="generatePDF(document.getElementById('pdf-proj').value);closeModal()">Generate</button>`);
  }
}

function generatePDF(projectId) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const p = getProject(projectId);
  if (!p) return;

  const tasks = getProjectTasks(projectId);
  const now = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

  // Cover
  doc.setFillColor(249, 115, 22);
  doc.rect(0, 0, 210, 40, 'F');
  doc.setTextColor(255);
  doc.setFontSize(24);
  doc.setFont(undefined, 'bold');
  doc.text('TaskAura', 20, 22);
  doc.setFontSize(12);
  doc.setFont(undefined, 'normal');
  doc.text('Project Summary Report', 20, 32);
  doc.setTextColor(0);
  doc.setFontSize(20);
  doc.setFont(undefined, 'bold');
  doc.text(p.name, 20, 60);
  doc.setFontSize(11);
  doc.setFont(undefined, 'normal');
  doc.setTextColor(100);
  doc.text(`Generated: ${now}`, 20, 70);
  doc.text(`PM: ${p.projectManager || '—'} | Location: ${[p.city, p.county, p.state].filter(Boolean).join(', ') || '—'}`, 20, 78);

  let yPos = 95;

  // Sort: by department, then priority order
  const priOrder = { critical: 0, high: 1, medium: 2, low: 3 };
  DEPARTMENTS.forEach(dept => {
    const deptTasks = tasks.filter(t => t.department === dept);
    if (!deptTasks.length) return;

    deptTasks.sort((a, b) => (priOrder[a.priority] || 2) - (priOrder[b.priority] || 2));

    if (yPos > 250) { doc.addPage(); yPos = 20; }

    // Department header
    doc.setFillColor(249, 115, 22);
    doc.rect(15, yPos - 5, 180, 8, 'F');
    doc.setTextColor(255);
    doc.setFontSize(11);
    doc.setFont(undefined, 'bold');
    doc.text(DEPT_LABELS[dept].toUpperCase(), 20, yPos + 1);
    doc.setTextColor(0);
    yPos += 12;

    // Table
    const tableData = deptTasks.map(t => [
      t.taskName,
      (t.priority || 'medium').charAt(0).toUpperCase() + (t.priority || 'medium').slice(1),
      (t.status || 'not-started').replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase()),
      t.dueDate ? fmtDate(t.dueDate) : (t.projectedFinish ? fmtDate(t.projectedFinish) : '—'),
      t.assignee || '—',
      `${pct(t.percentComplete || 0)}%`
    ]);

    doc.autoTable({
      startY: yPos,
      head: [['Task', 'Priority', 'Status', 'Due', 'Assignee', '%']],
      body: tableData,
      theme: 'grid',
      headStyles: { fillColor: [30, 30, 30], fontSize: 8, fontStyle: 'bold' },
      bodyStyles: { fontSize: 8 },
      columnStyles: { 0: { cellWidth: 55 }, 1: { cellWidth: 20 }, 2: { cellWidth: 25 }, 3: { cellWidth: 25 }, 4: { cellWidth: 25 }, 5: { cellWidth: 15 } },
      margin: { left: 15, right: 15 },
      didParseCell: (data) => {
        if (data.section === 'body' && data.column.index === 1) {
          const v = data.cell.raw.toLowerCase();
          if (v === 'critical') data.cell.styles.textColor = [220, 38, 38];
          else if (v === 'high') data.cell.styles.textColor = [249, 115, 22];
        }
      }
    });

    yPos = doc.lastAutoTable.finalY + 12;
  });

  // Footer on each page
  const pageCount = doc.internal.getNumberOfPages();
  for (let i = 1; i <= pageCount; i++) {
    doc.setPage(i);
    doc.setFontSize(8);
    doc.setTextColor(150);
    doc.text(`TaskAura — ${p.name} — Page ${i} of ${pageCount}`, 105, 290, { align: 'center' });
  }

  doc.save(`TaskAura_${p.name.replace(/\s+/g, '_')}_Summary.pdf`);
  showToast('PDF downloaded');
}

function addPhaseField() {
  const c = document.getElementById('pf-phases');
  const idx = c.children.length;
  const div = document.createElement('div');
  div.innerHTML = `<div class="form-row" data-phase-idx="${idx}" data-phase-id="" style="align-items:flex-end">
    <div class="form-group"><label>Phase ${idx + 1} Name</label><input class="ph-name" value="Phase ${idx + 1}"></div>
    <div class="form-group" style="flex:0 0 80px"><label>Lots</label><input type="number" class="ph-lots" value=""></div>
    <div class="form-group" style="flex:0 0 auto"><label>&nbsp;</label><button class="btn btn-sm btn-danger" onclick="this.closest('[data-phase-idx]').remove()">✕</button></div>
  </div>`;
  c.appendChild(div.firstElementChild);
}

function saveProject(editId) {
  const name = document.getElementById('pf-name').value.trim();
  if (!name) { alert('Project name required'); return; }

  const phaseRows = document.querySelectorAll('#pf-phases [data-phase-idx]');
  const phases = [];
  phaseRows.forEach(row => {
    const phName = row.querySelector('.ph-name').value.trim() || 'Phase';
    const lots = parseInt(row.querySelector('.ph-lots').value) || 0;
    const existingId = row.dataset.phaseId;
    phases.push({
      id: existingId || uid(),
      name: phName,
      lotCount: lots,
      currentStage: 'Pre-Construction',
      constructionStart: '',
      originalSubComp: '',
      archived: false
    });
  });

  if (!phases.length) { alert('At least one phase required'); return; }

  if (editId) {
    const p = state.projects.find(x => x.id === editId);
    if (p) {
      // Preserve existing phase data for phases that still exist
      const oldById = new Map((p.phases || []).map(ph => [ph.id, ph]));
      phases.forEach(ph => {
        const old = oldById.get(ph.id);
        if (old) {
          ph.currentStage = old.currentStage || 'Pre-Construction';
          ph.constructionStart = old.constructionStart || '';
          ph.originalSubComp = old.originalSubComp || '';
          ph.archived = old.archived || false;
        }
      });
      p.name = name;
      p.city = document.getElementById('pf-city').value.trim();
      p.county = document.getElementById('pf-county').value.trim();
      p.state = document.getElementById('pf-state').value.trim();
      p.projectManager = document.getElementById('pf-pm').value.trim();
      p.phases = phases;
    }
  } else {
    state.projects.push({
      id: uid(), name,
      city: document.getElementById('pf-city').value.trim(),
      county: document.getElementById('pf-county').value.trim(),
      state: document.getElementById('pf-state').value.trim(),
      projectManager: document.getElementById('pf-pm').value.trim(),
      phases
    });
  }

  saveState(); closeModal();
  if (!editId) {
    const newP = state.projects[state.projects.length - 1];
    navTo('project', { projectId: newP.id });
  } else {
    renderMain();
  }
  renderSidebar();
  showToast(editId ? 'Project updated' : 'Project created');
}

function deleteProject(projId) {
  if (!confirm('Delete this project and all its tasks?')) return;
  state.projects = state.projects.filter(p => p.id !== projId);
  state.tasks = state.tasks.filter(t => t.projectId !== projId);
  saveState();
  if (selectedProjectId === projId) selectedProjectId = null;
  navTo('dashboard');
  showToast('Project deleted');
}
