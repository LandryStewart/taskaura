// ==================== TASK DEPENDENCIES ====================
// A schedule item may list other items in the SAME phase as predecessors.
// When a task's projected finish moves (delay, improvement, or manual edit),
// every dependent task shifts by the same number of working days, recursively.
// Existing gaps/overlaps between tasks are preserved (delta-shift, not chaining).
function getPredNames(p, s) {
  return (s.predecessors||[]).map(id => (p.schedule||[]).find(x=>x.id===id)?.task).filter(Boolean);
}
// True if making `candidateId` a predecessor of `itemId` would create a loop
function wouldCreateCycle(p, itemId, candidateId) {
  const seen = new Set();
  const walk = id => {
    if(id===itemId) return true;
    if(seen.has(id)) return false;
    seen.add(id);
    const it = (p.schedule||[]).find(x=>x.id===id);
    return (it?.predecessors||[]).some(walk);
  };
  return walk(candidateId);
}
function shiftSuccessors(p, itemId, days, visited, moved) {
  (p.schedule||[]).filter(s => (s.predecessors||[]).includes(itemId)).forEach(s => {
    if(visited.has(s.id)) return;
    visited.add(s.id);
    if(s.status==='completed') return; // completed work doesn't move
    if(s.startDate) s.startDate = addWorkingDays(s.startDate, days);
    if(s.projectedFinish) {
      if(!s.originalFinish) s.originalFinish = s.projectedFinish;
      s.projectedFinish = addWorkingDays(s.projectedFinish, days);
    }
    moved.push(s.task);
    shiftSuccessors(p, s.id, days, visited, moved);
  });
}
// Entry point: shift everything downstream of `item` by `days` working days.
// Note: cascaded shifts do NOT add delay entries to successors, so phase
// variance (which sums logged delays) is never double-counted.
function cascadeShift(p, item, days) {
  if(!days) return;
  const moved = [];
  shiftSuccessors(p, item.id, days, new Set([item.id]), moved);
  if(moved.length) {
    const signed = (days>0?'+':'')+days;
    logChange(p.name,'Schedule',`Cascade from "${item.task}" (${signed}wd): shifted ${moved.length} dependent task${moved.length===1?'':'s'} — ${moved.join(', ')}`);
    showToast(`${moved.length} dependent task${moved.length===1?'':'s'} shifted ${signed}wd`);
  }
}

// ==================== GANTT VIEW ====================
function renderGantt(p, ph, items, forPrint) {
  const dated = items.filter(s=>s.startDate && s.projectedFinish);
  const undated = items.filter(s=>!s.startDate || !s.projectedFinish);
  if(!dated.length) return `<div class="card"><div class="empty-state"><p>No schedule items with both a start date and projected finish yet${undated.length?` (${undated.length} item${undated.length===1?'':'s'} missing dates)`:''}.</p></div></div>`;
  // Same order as the table: critical path first, then secondary
  const rows = [...dated.filter(s=>(s.category||'secondary')==='critical-path'), ...dated.filter(s=>(s.category||'secondary')!=='critical-path')];
  const v = phaseVariance(p, ph.id);
  const MS = 86400000;
  const dt = s => new Date(s+'T12:00:00');
  let min=null, max=null;
  rows.forEach(s => [s.startDate, s.projectedFinish, s.originalFinish].forEach(x => {
    if(x){ const d=dt(x); if(!min||d<min) min=new Date(d); if(!max||d>max) max=new Date(d); }
  }));
  const tToday = dt(todayStr());
  if(tToday<min) min=new Date(tToday);
  if(tToday>max) max=new Date(tToday);
  if(v.cur && dt(v.cur)>max) max=new Date(dt(v.cur));
  min = new Date(min.getTime() - 4*MS);
  max = new Date(max.getTime() + 7*MS);
  const span = (max-min)/MS;
  const LP=235, RP=55, TP=36, rowH=30, barH=15, W=1150;
  const H = TP + rows.length*rowH + 16;
  const x = ds => LP + ((dt(ds)-min)/MS)/span*(W-LP-RP);
  const yOf = i => TP + i*rowH + (rowH-barH)/2;
  const C_CP='#4d7831', C_SEC='#279d96', C_DONE='#38a169', C_SLIP='#e53e3e';
  const trunc = (s,n) => s.length>n ? s.slice(0,n-1)+'…' : s;
  let svg = '';
  // Row stripes
  rows.forEach((s,i)=>{ if(i%2===1) svg += `<rect x="0" y="${TP+i*rowH}" width="${W}" height="${rowH}" fill="#f5f7f4"/>`; });
  // Month gridlines + labels (plus weekly ticks on short ranges)
  const m0 = new Date(min.getFullYear(), min.getMonth(), 1);
  for(let d=new Date(m0); d<=max; d.setMonth(d.getMonth()+1)) {
    if(d<min) continue;
    const ds = d.toISOString().split('T')[0];
    svg += `<line x1="${x(ds)}" y1="${TP-16}" x2="${x(ds)}" y2="${H}" stroke="#dde5d9" stroke-width="1"/>`;
    svg += `<text x="${x(ds)+4}" y="${TP-20}" font-size="10" fill="#5f6d5a" font-weight="600">${d.toLocaleDateString('en-US',{month:'short',year:'2-digit'})}</text>`;
  }
  if(span <= 130) {
    const wd = new Date(min);
    while(wd.getDay()!==1) wd.setDate(wd.getDate()+1);
    for(; wd<=max; wd.setDate(wd.getDate()+7)) {
      const ds = wd.toISOString().split('T')[0];
      svg += `<line x1="${x(ds)}" y1="${TP}" x2="${x(ds)}" y2="${H}" stroke="#edf2eb" stroke-width="1"/>`;
    }
  }
  // Dependency connectors (drawn under bars)
  const idx = new Map(rows.map((s,i)=>[s.id,i]));
  rows.forEach((s,i) => (s.predecessors||[]).forEach(pid => {
    if(!idx.has(pid)) return;
    const pi = idx.get(pid), pr = rows[pi];
    const x1 = x(pr.projectedFinish), y1 = yOf(pi)+barH/2;
    const x2 = x(s.startDate), y2 = yOf(i)+barH/2;
    svg += `<path d="M ${x1} ${y1} L ${x1+5} ${y1} L ${x1+5} ${y2} L ${x2-3} ${y2}" fill="none" stroke="#8a9685" stroke-width="1.2"/>`;
    svg += `<path d="M ${x2-3} ${y2-3} L ${x2+1} ${y2} L ${x2-3} ${y2+3} Z" fill="#8a9685"/>`;
  }));
  // Bars
  rows.forEach((s,i) => {
    const y = yOf(i);
    const cp = (s.category||'secondary')==='critical-path';
    const base = s.status==='completed' ? C_DONE : (cp ? C_CP : C_SEC);
    const bx = x(s.startDate), bw = Math.max(4, x(s.projectedFinish)-bx);
    const slipped = s.originalFinish && s.projectedFinish > s.originalFinish;
    // Label
    svg += `<text x="8" y="${y+barH-4}" font-size="11" fill="#1a202c" font-weight="${cp?'600':'400'}">${esc(trunc(s.task,36))}</text>`;
    // Bar + progress fill
    svg += `<rect x="${bx}" y="${y}" width="${bw}" height="${barH}" rx="3" fill="${base}" opacity="${s.status==='completed'?'0.55':'0.85'}"/>`;
    const pc = pct(s.percentComplete||0);
    if(pc>0 && pc<100) svg += `<rect x="${bx}" y="${y}" width="${bw*pc/100}" height="${barH}" rx="3" fill="#2d412b" opacity="0.45"/>`;
    // Slip overlay: original finish → projected finish
    if(slipped) {
      const ox = x(s.originalFinish);
      svg += `<rect x="${ox}" y="${y}" width="${Math.max(2, x(s.projectedFinish)-ox)}" height="${barH}" rx="2" fill="${C_SLIP}" opacity="0.5"/>`;
      svg += `<line x1="${ox}" y1="${y-2}" x2="${ox}" y2="${y+barH+2}" stroke="${C_SLIP}" stroke-width="1.5"/>`;
    }
    // Net delay tag at right of bar
    const net = (s.delays||[]).reduce((sum,d)=>sum+(d.workingDays||0),0);
    if(net) svg += `<text x="${bx+bw+5}" y="${y+barH-4}" font-size="9.5" font-weight="700" fill="${net>0?C_SLIP:C_DONE}">${net>0?'+':''}${net}d</text>`;
  });
  // Today line
  svg += `<line x1="${x(todayStr())}" y1="${TP-12}" x2="${x(todayStr())}" y2="${H}" stroke="${C_SLIP}" stroke-width="1.3" stroke-dasharray="4,3"/>`;
  svg += `<text x="${x(todayStr())+4}" y="${TP-4}" font-size="9.5" fill="${C_SLIP}" font-weight="700">TODAY</text>`;
  // Current substantial completion marker
  if(v.cur && dt(v.cur)>=min && dt(v.cur)<=max) {
    svg += `<line x1="${x(v.cur)}" y1="${TP-12}" x2="${x(v.cur)}" y2="${H}" stroke="${C_CP}" stroke-width="1.3" stroke-dasharray="6,3"/>`;
    svg += `<text x="${x(v.cur)+4}" y="${TP+6}" font-size="9.5" fill="${C_CP}" font-weight="700">SUB. COMP.</text>`;
  }
  // Left column divider
  svg += `<line x1="${LP-8}" y1="${TP-16}" x2="${LP-8}" y2="${H}" stroke="#c2ccbd" stroke-width="1"/>`;
  const legend = `<div class="gantt-legend">
    <span><span class="gl-swatch" style="background:${C_CP}"></span>Critical Path</span>
    <span><span class="gl-swatch" style="background:${C_SEC}"></span>Secondary</span>
    <span><span class="gl-swatch" style="background:${C_DONE};opacity:.55"></span>Completed</span>
    <span><span class="gl-swatch" style="background:${C_SLIP};opacity:.5"></span>Slip vs. original finish</span>
    <span style="color:#8a9685">⇠ arrows = dependencies</span>
  </div>`;
  const note = undated.length ? `<div style="font-size:11px;color:var(--text-muted);padding:6px 4px 0">Not shown (missing dates): ${undated.map(s=>esc(s.task)).join(', ')}</div>` : '';
  return `<div class="card gantt-card"><svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;${forPrint?'':'min-width:900px;'}display:block">${svg}</svg>${legend}${note}</div>`;
}

// ==================== DELAY / IMPROVEMENT LOG ====================
// Each delay entry can carry one tag so the log can be filtered and analyzed by cause.
const DELAY_TAGS = ['Weather','Contractor','City/Municipality','Franchise Utility','Design/Engineering','Materials','Inspection','Labor','Owner Decision','Other'];
const DELAY_TAG_COLORS = {'Weather':'badge-blue','Contractor':'badge-yellow','City/Municipality':'badge-red','Franchise Utility':'badge-blue','Design/Engineering':'badge-yellow','Materials':'badge-gray','Inspection':'badge-red','Labor':'badge-yellow','Owner Decision':'badge-green','Other':'badge-gray'};
function delayTagBadge(tag) {
  if(!tag) return `<span class="badge badge-gray" style="opacity:.6">Untagged</span>`;
  return `<span class="badge ${DELAY_TAG_COLORS[tag]||'badge-gray'}">${esc(tag)}</span>`;
}
let delayTagFilter = 'all';
let delaySort = 'date-desc';

// Flattens every delay entry across a phase's schedule items into one list.
function getDelayLog(p, phaseId) {
  const out = [];
  (p.schedule||[]).filter(s=>!phaseId || s.phaseId===phaseId).forEach(s =>
    (s.delays||[]).forEach(d => out.push({
      date:d.date||'', task:s.task, itemId:s.id, delayId:d.id,
      category:(s.category||'secondary')==='critical-path'?'Critical Path':'Secondary',
      days:d.workingDays||0, reason:d.reason||'', tag:d.tag||''
    })));
  return out.sort((a,b)=>b.date.localeCompare(a.date));
}
const DELAY_SORTS = {
  'date-desc': {label:'Newest first', fn:(a,b)=>b.date.localeCompare(a.date)},
  'date-asc':  {label:'Oldest first', fn:(a,b)=>a.date.localeCompare(b.date)},
  'days-desc': {label:'Biggest delay', fn:(a,b)=>b.days-a.days},
  'days-asc':  {label:'Biggest improvement', fn:(a,b)=>a.days-b.days},
  'task':      {label:'Task A–Z', fn:(a,b)=>a.task.localeCompare(b.task)},
  'tag':       {label:'Tag', fn:(a,b)=>(a.tag||'zz').localeCompare(b.tag||'zz')}
};

function renderDelayLog(p, ph) {
  const all = getDelayLog(p, ph.id);
  if(!all.length) return `<div class="card"><div class="empty-state"><p>No delays or improvements logged for ${esc(ph.name)} yet.</p><p style="font-size:12px">Use the <strong>± Adj</strong> button on a schedule item to log one.</p></div></div>`;

  // Tag filter chips (only tags actually present, plus Untagged when applicable)
  const present = [...new Set(all.map(e=>e.tag||''))];
  const chipDefs = [['all','All'], ...DELAY_TAGS.filter(t=>present.includes(t)).map(t=>[t,t]), ...(present.includes('')?[['untagged','Untagged']]:[])];
  if(!chipDefs.some(([k])=>k===delayTagFilter)) delayTagFilter='all';
  const chips = chipDefs.map(([k,l])=>{
    const n = k==='all' ? all.length : all.filter(e=>(k==='untagged'?!e.tag:e.tag===k)).length;
    return `<div class="phase-tab ${delayTagFilter===k?'active':''}" onclick="delayTagFilter='${k}';renderMain()">${esc(l)} (${n})</div>`;
  }).join('');

  const log = (delayTagFilter==='all' ? [...all] : all.filter(e=>delayTagFilter==='untagged'?!e.tag:e.tag===delayTagFilter))
    .sort((DELAY_SORTS[delaySort]||DELAY_SORTS['date-desc']).fn);
  const sortOpts = Object.entries(DELAY_SORTS).map(([k,v])=>`<option value="${k}" ${delaySort===k?'selected':''}>${v.label}</option>`).join('');

  const delays = log.filter(e=>e.days>0).reduce((s,e)=>s+e.days,0);
  const gains = log.filter(e=>e.days<0).reduce((s,e)=>s+e.days,0);
  const net = delays + gains;
  // Net working days by tag (always across all entries, so the breakdown stays stable while filtering)
  const byTag = {};
  all.forEach(e => { const k = e.tag||'Untagged'; byTag[k] = (byTag[k]||0) + e.days; });
  const tagBreakdown = Object.entries(byTag).sort((a,b)=>b[1]-a[1]).map(([k,v]) =>
    `<span style="white-space:nowrap">${delayTagBadge(k==='Untagged'?'':k)} <strong style="color:${v>0?'var(--danger)':v<0?'var(--success)':'var(--text-muted)'}">${v>0?'+':''}${v}</strong></span>`).join(' ');

  const stat = (label, val, color) => `<div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted)">${label}</span><span style="font-size:16px;font-weight:700;${color?'color:'+color:''}">${val}</span></div>`;
  const summary = `<div class="card" style="margin-bottom:12px;padding:14px 18px;display:flex;gap:34px;flex-wrap:wrap;align-items:flex-start">
    ${stat('Entries', log.length + (delayTagFilter!=='all'?' / '+all.length:''))}
    ${stat('Delays', '+'+delays+' wd', 'var(--danger)')}
    ${stat('Improvements', gains+' wd', 'var(--success)')}
    ${stat('Net Impact', (net>0?'+':'')+net+' wd', net>0?'var(--danger)':net<0?'var(--success)':'var(--text-muted)')}
    <div style="display:flex;flex-direction:column;gap:4px;flex:1;min-width:220px"><span style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted)">Net by Tag (all entries, wd)</span><div style="display:flex;gap:10px;flex-wrap:wrap;font-size:12px">${tagBreakdown}</div></div>
  </div>`;

  const rows = log.map(e => `<tr>
    <td style="white-space:nowrap">${fmtDate(e.date)}</td>
    <td style="font-weight:600">${esc(e.task)}</td>
    <td>${delayTagBadge(e.tag)}</td>
    <td><span class="badge ${e.category==='Critical Path'?'badge-red':'badge-blue'}">${e.category}</span></td>
    <td style="white-space:nowrap;font-weight:700;color:${e.days>0?'var(--danger)':'var(--success)'}">${e.days>0?'+':''}${e.days} wd</td>
    <td>${esc(e.reason)||'—'}</td>
    <td><div class="table-actions"><button class="btn-del" onclick="deleteDelay('${p.id}','${e.itemId}','${e.delayId}')">Del</button></div></td>
  </tr>`).join('') || `<tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:20px">No entries match this filter</td></tr>`;

  return `${summary}
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap">
      <div class="phase-tabs" style="margin-bottom:0">${chips}</div>
      <div style="margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted)">Sort: <select onchange="delaySort=this.value;renderMain()" style="font-size:12px;padding:4px 8px">${sortOpts}</select></div>
    </div>
    <div class="card"><table><thead><tr><th>Date</th><th>Task</th><th>Tag</th><th>Category</th><th>± Working Days</th><th>Reason</th><th>Actions</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

// ==================== SCHEDULE EXPORT (CSV / PDF) ====================
function csvCell(v){ v = (v===undefined||v===null)?'':String(v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function exportScheduleCSV(projId) {
  const p = data.projects.find(x=>x.id===projId); if(!p) return;
  const head = ['Project','Phase','Category','Task','Start Date','Original Finish','Projected Finish','Status','% Complete','Net Delay (wd)','Delay Entries','Predecessors','Notes'];
  const lines = [head.join(',')];
  (p.phases||[]).forEach(ph => {
    const items = (p.schedule||[]).filter(s=>s.phaseId===ph.id);
    [...items.filter(s=>(s.category||'secondary')==='critical-path'), ...items.filter(s=>(s.category||'secondary')!=='critical-path')].forEach(s => {
      const net = (s.delays||[]).reduce((sum,d)=>sum+(d.workingDays||0),0);
      lines.push([p.name, ph.name, (s.category||'secondary')==='critical-path'?'Critical Path':'Secondary', s.task,
        s.startDate||'', s.originalFinish||'', s.projectedFinish||'', s.status||'', pct(s.percentComplete||0),
        net, (s.delays||[]).length, getPredNames(p,s).join('; '), s.notes||''].map(csvCell).join(','));
    });
  });
  // ---- Delay / Improvement Log section ----
  const allLog = [];
  (p.phases||[]).forEach(ph => getDelayLog(p, ph.id).forEach(e => allLog.push({ph:ph.name, ...e})));
  if(allLog.length) {
    const net = allLog.reduce((s,e)=>s+e.days,0);
    lines.push('');
    lines.push(csvCell(`DELAY / IMPROVEMENT LOG — Net: ${net>0?'+':''}${net} working days`));
    lines.push(['Project','Phase','Task','Tag','Category','Date','Working Days (+delay / -improvement)','Reason'].join(','));
    allLog.sort((a,b)=>b.date.localeCompare(a.date)).forEach(e =>
      lines.push([p.name, e.ph, e.task, e.tag||'Untagged', e.category, e.date, e.days, e.reason].map(csvCell).join(',')));
  }
  const blob = new Blob(['﻿'+lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${(p.name||'project').replace(/[^\w-]+/g,'_')}-schedule-${todayStr()}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
  showToast('Schedule CSV exported');
}

function printSchedule(projId) {
  const p = data.projects.find(x=>x.id===projId); if(!p) return;
  const app = document.getElementById('app');
  const saved = app.innerHTML;
  let html = `<div class="print-report">
    <div class="pr-project-header" style="margin-top:8px">
      <h2 class="pr-section-title">Development Schedule — ${esc(p.name)}</h2>
      <div class="pr-project-meta">${esc([p.city,p.county,p.state].filter(Boolean).join(', '))} &nbsp;|&nbsp; PM: ${esc(p.projectManager||'—')} &nbsp;|&nbsp; ${new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}</div>
    </div>`;
  activePhases(p).forEach((ph,i) => {
    const items = (p.schedule||[]).filter(s=>s.phaseId===ph.id);
    const v = phaseVariance(p, ph.id);
    const stage = ph.currentStage||'Pre-Construction';
    const variance = v.net>0 ? `<span style="color:#e53e3e;font-weight:700">${v.net} day${v.net===1?'':'s'} behind</span>` : v.net<0 ? `<span style="color:#38a169;font-weight:700">${-v.net} day${v.net===-1?'':'s'} ahead</span>` : 'On schedule';
    html += `${i>0?'<div class="pr-page-break"></div>':''}<div class="pr-phase-block"><h3 class="pr-phase-header">${esc(ph.name)}</h3>
      <div class="pr-phase-meta">${ph.lotCount?ph.lotCount+' lots &nbsp;|&nbsp; ':''}Stage: <strong>${esc(stage)}</strong> &nbsp;|&nbsp; Construction Start: ${v.constructionStart?fmtDate(v.constructionStart):'—'} &nbsp;|&nbsp; Original Sub. Comp.: ${v.orig?fmtDate(v.orig):'—'} &nbsp;|&nbsp; Current Sub. Comp.: ${v.cur?fmtDate(v.cur):'—'} &nbsp;|&nbsp; ${variance}</div>`;
    if(!items.length){ html += `<p class="pr-empty">No schedule items.</p></div>`; return; }
    function row(s){
      const net=(s.delays||[]).reduce((sum,d)=>sum+(d.workingDays||0),0);
      const slipped = s.originalFinish && s.projectedFinish && s.projectedFinish > s.originalFinish;
      const preds = getPredNames(p,s).join(', ');
      return `<tr><td style="font-weight:600">${esc(s.task)}${s.notes?`<div style="font-weight:400;font-size:10px;color:#5f6d5a;font-style:italic">${esc(s.notes)}</div>`:''}</td><td>${fmtDate(s.startDate)}</td><td${slipped?' style="color:#e53e3e;font-weight:600"':''}>${fmtDate(s.projectedFinish)}${slipped?` <span style="font-size:9px;color:#999">(was ${fmtDate(s.originalFinish)})</span>`:''}</td><td>${statusBadge(s.status)}</td><td>${pct(s.percentComplete||0)}%</td><td>${net?net+'d':'—'}</td><td style="font-size:10px">${esc(preds)||'—'}</td></tr>`;
    }
    const cp=items.filter(s=>(s.category||'secondary')==='critical-path'), sec=items.filter(s=>(s.category||'secondary')!=='critical-path');
    html += `<table class="pr-table"><thead><tr><th>Task</th><th>Start</th><th>Proj. Finish</th><th>Status</th><th>%</th><th>Delays</th><th>After (Predecessors)</th></tr></thead><tbody>`;
    if(cp.length) html += `<tr><td colspan="7" class="pr-cat-header pr-cat-cp">CRITICAL PATH</td></tr>`+cp.map(row).join('');
    if(sec.length) html += `<tr><td colspan="7" class="pr-cat-header pr-cat-sec">SECONDARY</td></tr>`+sec.map(row).join('');
    html += `</tbody></table>`;
    html += renderGantt(p, ph, items, true);
    const log = getDelayLog(p, ph.id);
    if(log.length) {
      const net = log.reduce((s,e)=>s+e.days,0);
      const byTag = {};
      log.forEach(e => { const k = e.tag||'Untagged'; byTag[k] = (byTag[k]||0) + e.days; });
      const tagLine = Object.entries(byTag).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${esc(k)}: <strong style="color:${v>0?'#e53e3e':v<0?'#38a169':'#5f6d5a'}">${v>0?'+':''}${v}</strong>`).join(' &nbsp;·&nbsp; ');
      html += `<h4 class="pr-subsection">Delay / Improvement Log <span style="font-weight:400;color:#5f6d5a">— Net impact: <strong style="color:${net>0?'#e53e3e':net<0?'#38a169':'#5f6d5a'}">${net>0?'+':''}${net} working days</strong></span></h4>
        <div style="font-size:10px;color:#5f6d5a;margin:0 0 6px">By tag (wd): ${tagLine}</div>
        <table class="pr-table"><thead><tr><th>Date</th><th>Task</th><th>Tag</th><th>Category</th><th>± Working Days</th><th>Reason</th></tr></thead><tbody>`;
      log.forEach(e => html += `<tr><td>${fmtDate(e.date)}</td><td style="font-weight:600">${esc(e.task)}</td><td>${esc(e.tag)||'—'}</td><td>${e.category}</td><td style="font-weight:700;color:${e.days>0?'#e53e3e':'#38a169'}">${e.days>0?'+':''}${e.days}</td><td>${esc(e.reason)||'—'}</td></tr>`);
      html += `</tbody></table>`;
    }
    html += `</div>`;
  });
  html += `</div>`;
  app.innerHTML = html;
  setTimeout(() => { window.print(); setTimeout(() => { app.innerHTML = saved; bindSidebarEvents(); }, 500); }, 200);
}

let biddingPhaseFilter = 'all';

// ════════════════════════════════════════════════════════════════════
// BIDDING / CONTRACTS
// ════════════════════════════════════════════════════════════════════
function renderBidding(p) {
  if(!p.bidding) p.bidding=[];
  const allIds = new Set((p.phases||[]).map(ph=>ph.id));
  const visIds = new Set(visiblePhases(p).map(ph=>ph.id));
  if(biddingPhaseFilter!=='all' && !visIds.has(biddingPhaseFilter)) biddingPhaseFilter='all';
  const phases = [{id:'all',name:'All Phases'},...visiblePhases(p)];
  const phaseTabsHtml = phases.map(ph=>`<div class="phase-tab ${biddingPhaseFilter===ph.id?'active':''}" style="${ph.archived?'border-style:dashed;opacity:.7':''}" onclick="biddingPhaseFilter='${ph.id}';renderMain()">${esc(ph.name)}${ph.archived?' <span style="font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted)">arch</span>':''}</div>`).join('') + archivedToggleChip(p);
  const visItem = it => showArchivedPhases || visIds.has(it.phaseId) || !allIds.has(it.phaseId);
  const items = biddingPhaseFilter==='all' ? p.bidding.filter(visItem) : p.bidding.filter(b=>b.phaseId===biddingPhaseFilter);
  const rows = items.map(b => {
    const phaseName = (p.phases||[]).find(ph=>ph.id===b.phaseId)?.name || '—';
    return `<tr>
    <td>${esc(phaseName)}</td><td>${esc(b.contractor)}</td><td>${esc(b.specialty)}</td>
    <td>${statusBadge(b.contractStatus)}</td><td>${statusBadge(b.ntp||'no')}</td>
    <td>${fmtCurrency(b.amount)}</td><td>${esc(b.notes||'')}</td>
    <td><div class="table-actions"><button onclick="openBiddingModal('${p.id}','${b.id}')">Edit</button><button class="btn-del" onclick="deleteBidding('${p.id}','${b.id}')">Del</button></div></td>
  </tr>`;
  }).join('');
  return `<div class="phase-tabs">${phaseTabsHtml}</div>
    <div class="section-header"><h2>Bidding / Contracting Status</h2><button class="btn btn-primary btn-sm" onclick="openBiddingModal('${p.id}')">+ Add Contractor</button></div>
    <div class="card"><table><thead><tr><th>Phase</th><th>Contractor</th><th>Specialty</th><th>Contract Status</th><th>NTP</th><th>Amount</th><th>Notes</th><th>Actions</th></tr></thead><tbody>${rows||'<tr><td colspan="8" style="text-align:center;color:var(--text-muted);padding:20px">No contractors yet</td></tr>'}</tbody></table></div>`;
}

function openBiddingModal(projId, itemId) {
  const p = data.projects.find(x=>x.id===projId);
  const item = itemId ? p.bidding.find(b=>b.id===itemId) : null;
  const b = item || {phaseId:(p.phases[0]?.id||''), contractor:'',specialty:'',contractStatus:'pending',ntp:'no',amount:'',notes:''};
  const phaseOpts = (p.phases||[]).map(ph=>`<option value="${ph.id}" ${b.phaseId===ph.id?'selected':''}>${esc(ph.name)}</option>`).join('');
  const csOpts = ['pending','bidding','awarded','executed'].map(s=>`<option value="${s}" ${b.contractStatus===s?'selected':''}>${s.charAt(0).toUpperCase()+s.slice(1)}</option>`).join('');
  const ntpOpts = [['no','No'],['yes','Yes'],['on-hold','On Hold']].map(([v,l])=>`<option value="${v}" ${(b.ntp||'no')===v?'selected':''}>${l}</option>`).join('');
  // Show raw number in edit field
  const rawAmount = b.amount ? String(b.amount).replace(/[^0-9.-]/g,'') : '';
  const body = `
    <div class="form-row"><div class="form-group"><label>Phase</label><select id="bf-phase">${phaseOpts}</select></div></div>
    <div class="form-row"><div class="form-group"><label>Contractor</label><input id="bf-contractor" value="${esc(b.contractor)}"></div><div class="form-group"><label>Specialty</label><input id="bf-specialty" value="${esc(b.specialty)}"></div></div>
    <div class="form-row"><div class="form-group"><label>Contract Status</label><select id="bf-cs">${csOpts}</select></div><div class="form-group"><label>NTP</label><select id="bf-ntp">${ntpOpts}</select></div></div>
    <div class="form-group"><label>Amount ($)</label><input id="bf-amount" value="${esc(rawAmount)}" placeholder="0.00"></div>
    <div class="form-group"><label>Notes</label><textarea id="bf-notes">${esc(b.notes||'')}</textarea></div>`;
  openModalDev(item?'Edit Contractor':'Add Contractor', body, () => {
    const vals = {phaseId:document.getElementById('bf-phase').value, contractor:document.getElementById('bf-contractor').value.trim(), specialty:document.getElementById('bf-specialty').value.trim(), contractStatus:document.getElementById('bf-cs').value, ntp:document.getElementById('bf-ntp').value, amount:document.getElementById('bf-amount').value.trim(), notes:document.getElementById('bf-notes').value.trim()};
    if(!vals.contractor) return alert('Contractor required');
    if(item) {
      if(item.contractStatus!==vals.contractStatus) logChange(p.name,'Bidding',`"${vals.contractor}" contract status → ${vals.contractStatus}`);
      if(item.ntp!==vals.ntp) logChange(p.name,'Bidding',`"${vals.contractor}" NTP → ${vals.ntp}`);
      Object.assign(item, vals);
    } else {
      p.bidding.push({id:uid(), ...vals});
      logChange(p.name,'Bidding',`Added "${vals.contractor}"`);
    }
    saveState(); showToast('Saved'); renderMain();
  });
}

function deleteBidding(projId, itemId) {
  if(!confirm('Delete?')) return;
  const p = data.projects.find(x=>x.id===projId);
  const item = p.bidding.find(b=>b.id===itemId);
  logChange(p.name,'Bidding',`Deleted "${item?.contractor}"`);
  p.bidding = p.bidding.filter(b=>b.id!==itemId);
  saveState(); showToast('Saved'); renderMain();
}

// ==================== FRANCHISE UTILITIES ====================
// ---- Utility Stage Definitions ----

// ════════════════════════════════════════════════════════════════════
// FRANCHISE UTILITIES (9-stage pipeline)
// ════════════════════════════════════════════════════════════════════
const UTILITY_STAGE_DEFS = [
  {key:'initiate',name:'Initiate',group:'pre-con'},
  {key:'prelimDesign',name:'Prelim Design',group:'pre-con'},
  {key:'finalDesign',name:'Final Design',group:'pre-con'},
  {key:'approved',name:'Approved',group:'pre-con'},
  {key:'easement',name:'Easement',group:'pre-con'},
  {key:'matRelease',name:'Mat. Release',group:'pre-con'},
  {key:'install',name:'Install',group:'con'},
  {key:'wirePull',name:'Wire Pull',group:'post-con'},
  {key:'energization',name:'Energization',group:'post-con'}
];
const UTIL_GROUPS = [
  {key:'pre-con',name:'Pre-Construction',bg:'var(--info-light)',border:'var(--info)'},
  {key:'con',name:'Construction',bg:'var(--warning-light)',border:'var(--warning)'},
  {key:'post-con',name:'Post-Construction',bg:'var(--success-light)',border:'var(--success)'}
];
function defaultUtilStages() {
  const s = {};
  UTILITY_STAGE_DEFS.forEach(d => s[d.key] = {status:'not-started',startDate:'',finishDate:''});
  return s;
}
function migrateUtility(u) {
  if(!u.stages || Array.isArray(u.stages) || !u.stages.initiate) u.stages = defaultUtilStages();
  return u;
}
function calcGroupDays(stages, group) {
  const keys = UTILITY_STAGE_DEFS.filter(d=>d.group===group).map(d=>d.key);
  let mn=null, mx=null;
  keys.forEach(k => {
    const st = stages[k];
    if(st?.startDate){ const d=new Date(st.startDate+'T12:00:00'); if(!mn||d<mn) mn=d; }
    if(st?.finishDate){ const d=new Date(st.finishDate+'T12:00:00'); if(!mx||d>mx) mx=d; }
  });
  return (mn && mx) ? Math.round((mx-mn)/86400000) : null;
}
function statusDot(status) {
  if(status==='complete') return '<span title="Complete" style="color:var(--success);font-size:16px;cursor:default">●</span>';
  if(status==='in-progress') return '<span title="In Progress" style="color:var(--warning);font-size:16px;cursor:default">●</span>';
  if(status==='not-applicable') return '<span title="Not Applicable" style="color:var(--text-light);font-size:10px;font-weight:700;cursor:default">N/A</span>';
  return '<span title="Not Started" style="color:var(--border-dark);font-size:16px;cursor:default">○</span>';
}
function fmtShort(d) { return d ? new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'numeric',day:'numeric',year:'2-digit'}) : ''; }

let utilityPhaseFilter = 'all';
function renderUtilities(p) {
  if(!p.utilities) p.utilities=[];
  p.utilities.forEach(migrateUtility);
  const allIds = new Set((p.phases||[]).map(ph=>ph.id));
  const visIds = new Set(visiblePhases(p).map(ph=>ph.id));
  if(utilityPhaseFilter!=='all' && !visIds.has(utilityPhaseFilter)) utilityPhaseFilter='all';
  const phases = [{id:'all',name:'All Phases'},...visiblePhases(p)];
  const phaseTabsHtml = phases.map(ph=>`<div class="phase-tab ${utilityPhaseFilter===ph.id?'active':''}" style="${ph.archived?'border-style:dashed;opacity:.7':''}" onclick="utilityPhaseFilter='${ph.id}';renderMain()">${esc(ph.name)}${ph.archived?' <span style="font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted)">arch</span>':''}</div>`).join('') + archivedToggleChip(p);
  const visItem = it => showArchivedPhases || visIds.has(it.phaseId) || !allIds.has(it.phaseId);
  const filtered = utilityPhaseFilter==='all' ? p.utilities.filter(visItem) : p.utilities.filter(u=>u.phaseId===utilityPhaseFilter);

  const cards = filtered.map(u => {
    const phaseName = (p.phases||[]).find(ph=>ph.id===u.phaseId)?.name || '—';
    const preD = calcGroupDays(u.stages,'pre-con');
    const conD = calcGroupDays(u.stages,'con');
    const postD = calcGroupDays(u.stages,'post-con');

    // Build stage grid
    let hdr1 = '<tr><th rowspan="2" style="width:55px;border-right:2px solid var(--border)"></th>';
    let hdr2 = '<tr>';
    UTIL_GROUPS.forEach(g => {
      const gStages = UTILITY_STAGE_DEFS.filter(d=>d.group===g.key);
      const days = calcGroupDays(u.stages, g.key);
      const dStr = days!==null ? ` (${days}d)` : '';
      hdr1 += `<th colspan="${gStages.length}" style="text-align:center;background:${g.bg};font-size:11px;border-right:2px solid var(--border)">${g.name}${dStr}</th>`;
      gStages.forEach((sd,i) => {
        const rightBorder = i===gStages.length-1 ? 'border-right:2px solid var(--border);' : '';
        hdr2 += `<th style="font-size:10px;text-align:center;white-space:nowrap;padding:4px 6px;${rightBorder}">${sd.name}</th>`;
      });
    });
    hdr1 += '</tr>'; hdr2 += '</tr>';

    function stageRow(label, field) {
      let r = `<tr><td style="font-weight:600;font-size:11px;white-space:nowrap;border-right:2px solid var(--border)">${label}</td>`;
      UTILITY_STAGE_DEFS.forEach((sd,i) => {
        const st = u.stages[sd.key]||{};
        const isGroupEnd = (i===5||i===6||i===8);
        const rb = isGroupEnd ? 'border-right:2px solid var(--border);' : '';
        if(field==='status') r += `<td style="text-align:center;padding:3px;${rb}">${statusDot(st.status)}</td>`;
        else r += `<td style="text-align:center;font-size:11px;padding:3px;${rb}">${st[field]?fmtShort(st[field]):'—'}</td>`;
      });
      return r + '</tr>';
    }

    return `<div class="card" style="margin-bottom:16px">
      <div class="card-header">
        <div><h2 style="display:inline">${esc(u.utilityType)}</h2> <span style="color:var(--text-muted);font-size:13px">— ${esc(u.provider||'No Provider')} (${esc(phaseName)})</span></div>
        <div style="display:flex;align-items:center;gap:12px">
          <div style="display:flex;gap:12px;font-size:12px;color:var(--text-muted)">
            <span>Pre-Con: <strong style="color:var(--info)">${preD!==null?preD+'d':'—'}</strong></span>
            <span>Con: <strong style="color:var(--warning)">${conD!==null?conD+'d':'—'}</strong></span>
            <span>Post-Con: <strong style="color:var(--success)">${postD!==null?postD+'d':'—'}</strong></span>
          </div>
          <div class="table-actions"><button onclick="openUtilityModal('${p.id}','${u.id}')">Edit</button><button class="btn-del" onclick="deleteUtility('${p.id}','${u.id}')">Del</button></div>
        </div>
      </div>
      <div class="card-body" style="padding:10px;overflow-x:auto">
        <table style="font-size:12px;border-collapse:collapse"><thead>${hdr1}${hdr2}</thead><tbody>${stageRow('Status','status')}${stageRow('Start','startDate')}${stageRow('Finish','finishDate')}</tbody></table>
      </div></div>`;
  }).join('');

  return `<div class="phase-tabs">${phaseTabsHtml}</div>
    <div class="section-header"><h2>Franchise Utility Tracking</h2><button class="btn btn-primary btn-sm" onclick="openUtilityModal('${p.id}')">+ Add Utility</button></div>
    ${cards||'<div class="empty-state"><p>No utilities yet</p></div>'}`;
}

function openUtilityModal(projId, itemId) {
  const p = data.projects.find(x=>x.id===projId);
  const item = itemId ? (migrateUtility(p.utilities.find(u=>u.id===itemId))) : null;
  const u = item || {phaseId:(p.phases[0]?.id||''), utilityType:'Electric', provider:'', stages:defaultUtilStages()};
  const phaseOpts = (p.phases||[]).map(ph=>`<option value="${ph.id}" ${u.phaseId===ph.id?'selected':''}>${esc(ph.name)}</option>`).join('');
  const typeOpts = ['Electric','Gas','Water','Sewer','Telecom','Cable','Fiber','Other'].map(t=>`<option value="${t}" ${u.utilityType===t?'selected':''}>${t}</option>`).join('');

  let stagesHtml = '';
  UTIL_GROUPS.forEach(g => {
    const gStages = UTILITY_STAGE_DEFS.filter(d=>d.group===g.key);
    stagesHtml += `<div style="margin-top:14px;padding:12px;background:${g.bg};border-radius:6px;border-left:3px solid ${g.border}"><strong style="font-size:12px">${g.name}</strong>`;
    gStages.forEach(sd => {
      const st = u.stages[sd.key]||{};
      const sLabels = {'not-started':'Not Started','in-progress':'In Progress','complete':'Complete','not-applicable':'Not Applicable'};
      const sOpts = ['not-started','in-progress','complete','not-applicable'].map(s=>`<option value="${s}" ${(st.status||'not-started')===s?'selected':''}>${sLabels[s]}</option>`).join('');
      stagesHtml += `<div class="form-row" style="margin-top:6px;align-items:end">
        <div class="form-group" style="flex:0 0 120px"><label>${sd.name}</label><select name="us-${sd.key}-status">${sOpts}</select></div>
        <div class="form-group"><label>Start</label><input type="date" name="us-${sd.key}-start" value="${st.startDate||''}"></div>
        <div class="form-group"><label>Finish</label><input type="date" name="us-${sd.key}-finish" value="${st.finishDate||''}"></div>
      </div>`;
    });
    stagesHtml += '</div>';
  });

  const body = `
    <div class="form-row"><div class="form-group"><label>Phase</label><select id="uf-phase">${phaseOpts}</select></div><div class="form-group"><label>Utility Type</label><select id="uf-type">${typeOpts}</select></div><div class="form-group"><label>Provider</label><input id="uf-provider" value="${esc(u.provider)}"></div></div>
    ${stagesHtml}`;

  openModalDev(item?'Edit Utility':'Add Utility', body, () => {
    const stages = {};
    UTILITY_STAGE_DEFS.forEach(sd => {
      stages[sd.key] = {
        status: document.querySelector(`[name="us-${sd.key}-status"]`).value,
        startDate: document.querySelector(`[name="us-${sd.key}-start"]`).value,
        finishDate: document.querySelector(`[name="us-${sd.key}-finish"]`).value
      };
    });
    const vals = {phaseId:document.getElementById('uf-phase').value, utilityType:document.getElementById('uf-type').value, provider:document.getElementById('uf-provider').value.trim(), stages};
    if(item) { Object.assign(item, vals); logChange(p.name,'Utilities',`Updated ${vals.utilityType} — ${vals.provider}`); }
    else { p.utilities.push({id:uid(),...vals}); logChange(p.name,'Utilities',`Added ${vals.utilityType} — ${vals.provider}`); }
    saveState(); showToast('Saved'); renderMain();
  });
  // Widen modal for stage grid
  setTimeout(()=>{ const m=document.querySelector('.modal'); if(m) m.style.maxWidth='820px'; },30);
}

function deleteUtility(projId, itemId) {
  if(!confirm('Delete?')) return;
  const p = data.projects.find(x=>x.id===projId);
  p.utilities = p.utilities.filter(u=>u.id!==itemId);
  saveState(); showToast('Saved'); renderMain();
}

// ════════════════════════════════════════════════════════════════════
// TILE HELPERS + PROJECT NOTES + RESOURCES + AMENITIES
// ════════════════════════════════════════════════════════════════════
function tilePctColor(p) { return p>=75?'pf-green':p>=40?'pf-yellow':'pf-red'; }

// ---- Note log: each card keeps a date-stamped history of notes. ----
// The card shows only the newest entry; the full log lives in a modal.
// n.noteText is kept in sync with the newest entry for backward compatibility
// (meeting report, older backups).
function migrateNoteLog(n) {
  if(!n.noteLog) n.noteLog = n.noteText ? [{id:uid(), date:n.date||'', text:n.noteText}] : [];
  return n;
}
function addNoteEntry(n, text, date) {
  migrateNoteLog(n);
  n.noteLog.unshift({id:uid(), date:date||todayStr(), text});
  n.noteText = n.noteLog[0].text;
}
// kind 'p' = project note, 'np' = non-project item
function findNoteCtx(kind, a, b) {
  if(kind==='p') {
    const p = data.projects.find(x=>x.id===a);
    return {n:(p?.notes||[]).find(x=>x.id===b), logName:p?.name||'—', section:'Notes'};
  }
  return {n:(data.nonProject[a]||[]).find(x=>x.id===b), logName:'—', section:sectionLabel(a)};
}
function findSubtaskCtx(kind, a, b, stId) {
  const ctx = findNoteCtx(kind, a, b);
  return {...ctx, st:(ctx.n?.subtasks||[]).find(x=>x.id===stId)};
}
// Shared note-log modal used by both cards and subtasks.
// obj = the thing carrying noteLog; title/label describe it; delClick builds a per-entry delete onclick.
function showNoteLog(obj, title, label, delClick, logName, section) {
  migrateNoteLog(obj);
  const entries = obj.noteLog.map(e => `
    <div class="changelog-item" style="display:flex;gap:10px;align-items:flex-start">
      <div style="flex:1"><div class="changelog-time">${e.date?fmtDate(e.date):'(undated)'}</div><div style="margin-top:2px;white-space:pre-wrap">${esc(e.text)}</div></div>
      <button class="btn btn-sm btn-del" style="flex-shrink:0" onclick="${delClick(e.id)}">Del</button>
    </div>`).join('') || '<div class="empty-state" style="padding:20px"><p>No notes yet</p></div>';
  const body = `
    <div class="form-group"><label>Add Note</label><textarea id="nl-text" placeholder="What changed or happened?"></textarea><div style="font-size:11px;color:var(--text-muted);margin-top:4px">Auto-stamped ${fmtDate(todayStr())} when saved — note datestamps can't be edited.</div></div>
    <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);border-bottom:1px solid var(--border);padding-bottom:4px;margin-bottom:4px">Note History (${obj.noteLog.length})</div>
    ${entries}`;
  openModalDev(title, body, () => {
    const text = document.getElementById('nl-text').value.trim();
    if(text) {
      addNoteEntry(obj, text);
      logChange(logName, section, `Note added to ${label}: ${text.length>80?text.slice(0,80)+'…':text}`);
      saveState(); showToast('Saved');
    }
    renderMain();
  });
}
function openNoteLogModal(kind, a, b) {
  const {n, logName, section} = findNoteCtx(kind, a, b);
  if(!n) return;
  showNoteLog(n, `Note Log — ${n.task}`, `"${n.task}"`, id=>`deleteNoteEntry('${kind}','${a}','${b}','${id}')`, logName, section);
}
function deleteNoteEntry(kind, a, b, entryId) {
  const {n, logName, section} = findNoteCtx(kind, a, b);
  if(!n || !confirm('Delete this note entry?')) return;
  n.noteLog = (n.noteLog||[]).filter(e=>e.id!==entryId);
  n.noteText = n.noteLog[0]?.text || '';
  logChange(logName, section, `Note entry removed from "${n.task}"`);
  saveState(); showToast('Saved'); closeModal(); renderMain(); openNoteLogModal(kind, a, b);
}
function openSubtaskLogModal(kind, a, b, stId) {
  const {n, st, logName, section} = findSubtaskCtx(kind, a, b, stId);
  if(!st) return;
  showNoteLog(st, `Note Log — ${st.text}`, `subtask "${st.text}" of "${n.task}"`, id=>`deleteSubtaskNoteEntry('${kind}','${a}','${b}','${stId}','${id}')`, logName, section);
}
function deleteSubtaskNoteEntry(kind, a, b, stId, entryId) {
  const {st, logName, section} = findSubtaskCtx(kind, a, b, stId);
  if(!st || !confirm('Delete this note entry?')) return;
  st.noteLog = (st.noteLog||[]).filter(e=>e.id!==entryId);
  st.noteText = st.noteLog[0]?.text || '';
  logChange(logName, section, `Note entry removed from subtask "${st.text}"`);
  saveState(); showToast('Saved'); closeModal(); renderMain(); openSubtaskLogModal(kind, a, b, stId);
}

function buildTile(n, opts) {
  migrateNoteLog(n);
  const latest = n.noteLog[0];
  const pri = n.priority||'medium';
  const stDone = (n.subtasks||[]).filter(s=>s.completed).length;
  const stTotal = (n.subtasks||[]).length;
  const pc = n.percentComplete||0;
  const overdue = !n.completed && isOverdue(n.dueDate);

  let tags = '';
  if(opts.phaseName) tags += `<span class="tile-tag tag-phase">${esc(opts.phaseName)}</span>`;
  tags += `<span class="tile-tag tag-${pri}">${pri.charAt(0).toUpperCase()+pri.slice(1)}</span>`;

  const subs = (n.subtasks||[]).slice(0,6).map(st => {
    migrateNoteLog(st);
    const sl = st.noteLog[0];
    const stOverdue = !st.completed && isOverdue(st.dueDate);
    const dueChip = st.dueDate ? `<span class="st-due ${stOverdue?'overdue':''}" title="Subtask due date">${stOverdue?'⚠ ':''}${fmtShort(st.dueDate)}</span>` : '';
    return `<div class="tile-st ${st.completed?'st-done':''}"><input type="checkbox" ${st.completed?'checked':''} onchange="${opts.toggleSub(st.id)}"><span style="flex:1">${esc(st.text)}</span>${dueChip}<span class="st-log" onclick="${opts.subLog(st.id)}" title="Subtask note log">📝${st.noteLog.length||''}</span></div>`
      + (sl?`<div class="tile-st-note">${sl.date?fmtDate(sl.date)+' — ':''}${esc(sl.text.length>90?sl.text.slice(0,90)+'…':sl.text)}</div>`:'');
  }).join('') + (stTotal>6?`<div style="font-size:11px;color:var(--text-muted);padding:2px 0">+${stTotal-6} more...</div>`:'');

  return `<div class="tile pri-${pri} ${n.completed?'tile-done':''}">
    <div class="tile-top">
      <input type="checkbox" ${n.completed?'checked':''} onchange="${opts.toggle}">
      <div class="tile-title">${esc(n.task)}</div>
    </div>
    ${tags?`<div class="tile-tags">${tags}</div>`:''}
    ${latest?`<div class="tile-notes">${latest.date?`<span style="font-weight:700;font-size:10px;color:var(--text-light)">${fmtDate(latest.date)}</span> — `:''}${esc(latest.text)}${n.noteLog.length>1?` <span style="font-size:10px;color:var(--primary-light);font-weight:600;cursor:pointer" onclick="${opts.log}">(+${n.noteLog.length-1} earlier)</span>`:''}</div>`:''}
    ${subs?`<div class="tile-subtasks">${subs}</div>`:''}
    <div class="tile-progress">
      <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text-muted);margin-bottom:2px">
        <span>${stTotal?`${stDone}/${stTotal} subtasks`:''}</span><span>${pc}%</span>
      </div>
      <div class="tile-pbar"><div class="tile-pfill ${tilePctColor(pc)}" style="width:${pc}%"></div></div>
    </div>
    <div class="tile-foot">
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        ${n.date?`<span>${fmtDate(n.date)}</span>`:''}
        ${n.dueDate?`<span class="${overdue?'overdue':''}">${overdue?'OVERDUE':'Due'}: ${fmtDate(n.dueDate)}</span>`:''}
        ${n.assignee?`<span class="assignee"><strong>${esc(n.assignee)}</strong></span>`:''}
      </div>
      <div class="tile-actions">
        <button onclick="${opts.log}">Log${n.noteLog.length?` (${n.noteLog.length})`:''}</button>
        <button onclick="${opts.edit}">Edit</button>
        <button class="btn-del" onclick="${opts.del}">Del</button>
      </div>
    </div>
  </div>`;
}

// ==================== PROJECT NOTES ====================
function renderNotes(p) {
  if(!p.notes) p.notes=[];
  const allIds = new Set((p.phases||[]).map(ph=>ph.id));
  const visIds = new Set(visiblePhases(p).map(ph=>ph.id));
  if(notesPhaseFilter!=='all' && !visIds.has(notesPhaseFilter)) notesPhaseFilter='all';
  const phases = [{id:'all',name:'All Phases'},...visiblePhases(p)];
  const phaseTabsHtml = phases.map(ph=>`<div class="phase-tab ${notesPhaseFilter===ph.id?'active':''}" style="${ph.archived?'border-style:dashed;opacity:.7':''}" onclick="notesPhaseFilter='${ph.id}';renderMain()">${esc(ph.name)}${ph.archived?' <span style="font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted)">arch</span>':''}</div>`).join('') + archivedToggleChip(p);
  const visItem = it => showArchivedPhases || visIds.has(it.phaseId) || !allIds.has(it.phaseId);
  const items = notesPhaseFilter==='all' ? p.notes.filter(visItem) : p.notes.filter(n=>n.phaseId===notesPhaseFilter);
  const active = items.filter(n=>!n.completed);
  const done = items.filter(n=>n.completed);

  function noteTile(n) {
    const phaseName = (p.phases||[]).find(ph=>ph.id===n.phaseId)?.name||'';
    return buildTile(n, {
      phaseName,
      toggle: `toggleNote('${p.id}','${n.id}')`,
      toggleSub: stId => `toggleSubtask('${p.id}','${n.id}','${stId}')`,
      edit: `openNoteModal('${p.id}','${n.id}')`,
      del: `deleteNote('${p.id}','${n.id}')`,
      log: `openNoteLogModal('p','${p.id}','${n.id}')`,
      subLog: stId => `openSubtaskLogModal('p','${p.id}','${n.id}','${stId}')`
    });
  }

  const activeHtml = active.length ? `<div class="tile-grid">${active.map(noteTile).join('')}</div>` : '<div class="empty-state"><p>No active notes</p></div>';
  const doneHtml = done.length ? `<details class="completed-section"><summary>Completed (${done.length})</summary><div class="tile-grid">${done.map(noteTile).join('')}</div></details>` : '';

  return `<div class="phase-tabs">${phaseTabsHtml}</div>
    <div class="section-header"><h2>Project Notes</h2><button class="btn btn-primary btn-sm" onclick="openNoteModal('${p.id}')">+ Add Note</button></div>
    ${activeHtml}${doneHtml}`;
}

function openNoteModal(projId, noteId) {
  const p = data.projects.find(x=>x.id===projId);
  const item = noteId ? p.notes.find(n=>n.id===noteId) : null;
  const n = item || {phaseId:(p.phases[0]?.id||''),priority:'medium',assignee:'',task:'',date:todayStr(),dueDate:'',subtasks:[],percentComplete:0,completed:false,noteText:''};
  const phaseOpts = (p.phases||[]).map(ph=>`<option value="${ph.id}" ${n.phaseId===ph.id?'selected':''}>${esc(ph.name)}</option>`).join('');
  const priOpts = [['urgent','Urgent'],['high','High'],['medium','Medium'],['low','Low']].map(([v,l])=>`<option value="${v}" ${(n.priority||'medium')===v?'selected':''}>${l}</option>`).join('');
  const subtasksHtml = (n.subtasks||[]).map((st,i)=>{
    const sl = (st.noteLog||[])[0] || (st.noteText?{date:st.date||'',text:st.noteText}:null);
    const noteLine = sl ? `<div style="flex-basis:100%;font-size:11px;color:var(--text-muted);font-style:italic;margin-left:22px;line-height:1.3">${sl.date?fmtDate(sl.date)+' — ':''}${esc(sl.text.length>120?sl.text.slice(0,120)+'…':sl.text)}</div>` : '';
    return `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;align-items:center"><input type="hidden" name="st-id-${i}" value="${esc(st.id||'')}"><input type="checkbox" name="st-done-${i}" ${st.completed?'checked':''} style="flex-shrink:0"><input name="st-text-${i}" value="${esc(st.text)}" style="flex:1;min-width:120px" placeholder="Subtask..."><span style="font-size:10px;color:var(--text-muted)">Due</span><input type="date" name="st-due-${i}" value="${st.dueDate||''}" style="flex:0 0 140px" title="Subtask due date">${item&&st.id?`<button class="btn btn-sm" style="flex-shrink:0" onclick="closeModal();openSubtaskLogModal('p','${p.id}','${item.id}','${st.id}')">Log${(st.noteLog||[]).length?` (${st.noteLog.length})`:''}</button>`:''}${noteLine}</div>`;
  }).join('');
  const body = `
    <div class="form-row"><div class="form-group"><label>Phase</label><select id="nf-phase">${phaseOpts}</select></div><div class="form-group"><label>Priority</label><select id="nf-pri">${priOpts}</select></div><div class="form-group"><label>Assignee</label><input id="nf-assignee" value="${esc(n.assignee||'')}"></div></div>
    <div class="form-group"><label>Task</label><input id="nf-task" value="${esc(n.task)}"></div>
    <div class="form-row"><div class="form-group"><label>Date Created</label><input type="date" id="nf-date" value="${n.date}"></div><div class="form-group"><label>Due Date</label><input type="date" id="nf-due" value="${n.dueDate||''}"></div><div class="form-group"><label>% Complete</label><input type="number" id="nf-pct" min="0" max="100" value="${n.percentComplete||0}"></div></div>
    <div class="form-group"><div style="display:flex;align-items:flex-end;justify-content:space-between;gap:8px"><label>Add Note <span style="font-weight:400;text-transform:none">(date-stamped — appended to the note log)</span></label>${item?`<button class="btn btn-sm" style="margin-bottom:4px" onclick="closeModal();openNoteLogModal('p','${p.id}','${item.id}')">View Full Log (${migrateNoteLog(item).noteLog.length})</button>`:''}</div>${item&&migrateNoteLog(item).noteLog[0]?`<div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">Latest (${item.noteLog[0].date?fmtDate(item.noteLog[0].date):'undated'}): ${esc(item.noteLog[0].text.length>100?item.noteLog[0].text.slice(0,100)+'…':item.noteLog[0].text)}</div>`:''}<textarea id="nf-notes" placeholder="${item?'New note entry…':'Initial note…'}"></textarea></div>
    <div class="form-group"><label>Subtasks</label><div id="nf-subtasks">${subtasksHtml}</div><button class="btn btn-sm" style="margin-top:4px" onclick="addSubtaskField()">+ Subtask</button></div>`;
  openModalDev(item?'Edit Note':'Add Note', body, () => {
    const subtasks = [];
    document.querySelectorAll('#nf-subtasks > div').forEach((_,i) => {
      const text = document.querySelector(`[name="st-text-${i}"]`)?.value.trim();
      if(!text) return;
      // Preserve subtask IDs so their note logs survive edits
      const stId = document.querySelector(`[name="st-id-${i}"]`)?.value || uid();
      const old = item ? (item.subtasks||[]).find(x=>x.id===stId) : null;
      subtasks.push({id:stId, text, completed:!!document.querySelector(`[name="st-done-${i}"]`)?.checked, dueDate:document.querySelector(`[name="st-due-${i}"]`)?.value||'', noteLog:old?.noteLog||[], noteText:old?.noteText||''});
    });
    const vals = {phaseId:document.getElementById('nf-phase').value, priority:document.getElementById('nf-pri').value, assignee:document.getElementById('nf-assignee').value.trim(), task:document.getElementById('nf-task').value.trim(), date:document.getElementById('nf-date').value, dueDate:document.getElementById('nf-due').value, percentComplete:parseInt(document.getElementById('nf-pct').value)||0, subtasks};
    if(!vals.task) return alert('Task required');
    const newNote = document.getElementById('nf-notes').value.trim();
    if(item) {
      Object.assign(item, vals);
      if(newNote) addNoteEntry(item, newNote);
      logChange(p.name,'Notes',`Updated "${vals.task}"${newNote?' (note added)':''}`);
    } else {
      const created = {id:uid(),...vals,completed:false,completedDate:'',noteLog:[],noteText:''};
      if(newNote) addNoteEntry(created, newNote);
      p.notes.push(created);
      logChange(p.name,'Notes',`Added "${vals.task}"`);
    }
    saveState(); showToast('Saved'); renderMain();
  });
}

function addSubtaskField() {
  const c = document.getElementById('nf-subtasks');
  const i = c.children.length;
  const d = document.createElement('div');
  d.style.cssText='display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;align-items:center';
  d.innerHTML=`<input type="hidden" name="st-id-${i}" value=""><input type="checkbox" name="st-done-${i}" style="flex-shrink:0"><input name="st-text-${i}" placeholder="Subtask..." style="flex:1;min-width:120px"><span style="font-size:10px;color:var(--text-muted)">Due</span><input type="date" name="st-due-${i}" style="flex:0 0 140px" title="Subtask due date">`;
  c.appendChild(d);
}

function toggleNote(projId, noteId) {
  const p = data.projects.find(x=>x.id===projId);
  const n = p.notes.find(x=>x.id===noteId);
  n.completed = !n.completed;
  n.completedDate = n.completed ? todayStr() : '';
  if(n.completed) { n.percentComplete = 100; (n.subtasks||[]).forEach(s=>s.completed=true); }
  logChange(p.name,'Notes',`"${n.task}" ${n.completed?'completed':'reopened'}`);
  saveState(); showToast('Saved'); renderMain();
}

function toggleSubtask(projId, noteId, stId) {
  const p = data.projects.find(x=>x.id===projId);
  const n = p.notes.find(x=>x.id===noteId);
  const st = n.subtasks.find(x=>x.id===stId);
  st.completed = !st.completed;
  const done = n.subtasks.filter(s=>s.completed).length;
  n.percentComplete = n.subtasks.length ? pct(done/n.subtasks.length*100) : 0;
  saveState(); showToast('Saved'); renderMain();
}

function deleteNote(projId, noteId) {
  if(!confirm('Delete?')) return;
  const p = data.projects.find(x=>x.id===projId);
  p.notes = p.notes.filter(n=>n.id!==noteId);
  saveState(); showToast('Saved'); renderMain();
}

function renderAmenities(p) {

  function renderAmenitySection(title, items, type) {
    const cards = items.map(a => {

      return `<div class="card" style="margin-bottom:12px">
        <div class="card-header"><h2>${esc(a.name)}</h2><div class="table-actions"><button onclick="openAmenityDetailModal('${p.id}','${type}','${a.id}')">Manage</button><button onclick="openAmenityModal('${p.id}','${type}','${a.id}')">Edit</button><button class="btn-del" onclick="deleteAmenity('${p.id}','${type}','${a.id}')">Del</button></div></div>
        <div class="card-body"><div class="pc-stats"><div class="pc-stat"><span class="pc-stat-label">Schedule Items</span>${schedCount}</div><div class="pc-stat"><span class="pc-stat-label">Completed</span>${schedDone}</div><div class="pc-stat"><span class="pc-stat-label">Bidding Items</span>${(a.bidding||[]).length}</div></div></div></div>`;
    }).join('');
    return `<div class="section-header"><h2>${title}</h2><button class="btn btn-primary btn-sm" onclick="openAmenityModal('${p.id}','${type}')">+ Add</button></div>${cards||`<div class="empty-state" style="padding:16px"><p>None yet</p></div>`}`;
  }
  return renderAmenitySection('Amenity Centers', p.amenityCenters, 'amenityCenters') + '<div style="margin-top:24px"></div>' + renderAmenitySection('Parks', p.parks, 'parks');
}

function openAmenityModal(projId, type, itemId) {
  const p = data.projects.find(x=>x.id===projId);
  const list = p[type];
  const item = itemId ? list.find(a=>a.id===itemId) : null;
  const body = `<div class="form-group"><label>Name</label><input id="af-name" value="${esc(item?.name||'')}"></div>`;
  openModalDev(item?'Edit':'Add ' + (type==='amenityCenters'?'Amenity Center':'Park'), body, () => {
    const name = document.getElementById('af-name').value.trim();
    if(!name) return alert('Name required');
    if(item) { item.name=name; }
    else { list.push({id:uid(),name,schedule:[],bidding:[],notes:[]}); }
    logChange(p.name, type==='amenityCenters'?'Amenity Centers':'Parks', item?`Renamed to "${name}"`:`Added "${name}"`);
    saveState(); showToast('Saved'); renderMain();
  });
}

function deleteAmenity(projId, type, itemId) {
  if(!confirm('Delete?')) return;
  const p = data.projects.find(x=>x.id===projId);
  p[type] = p[type].filter(a=>a.id!==itemId);
  saveState(); showToast('Saved'); renderMain();
}

function openAmenityDetailModal(projId, type, itemId) {
  const p = data.projects.find(x=>x.id===projId);

  const bidRows = (item.bidding||[]).map(b => `<tr><td>${esc(b.contractor)}</td><td>${esc(b.specialty)}</td><td>${statusBadge(b.contractStatus)}</td></tr>`).join('') || '<tr><td colspan="3" style="text-align:center;color:var(--text-muted)">No items</td></tr>';

    <h4 style="margin-bottom:8px">Schedule</h4>
    <button class="btn btn-sm" style="margin-bottom:8px" onclick="addAmenitySchedule('${projId}','${type}','${itemId}')">+ Schedule Item</button>

function addAmenitySchedule(projId, type, itemId) {

function addAmenityBidding(projId, type, itemId) {

}

// NON-PROJECT SECTIONS
// ════════════════════════════════════════════════════════════════════
const NP_LABELS = {newBusiness:'New Business', swppp:'SWPPP', developmentSpends:'Development Spends', brws:'BRWs', hoa:'HOA', specialProjects:'Special Projects'};

// ---- User-managed sidebar Sections (add / archive / reinstate) ----
// data.sections[] = [{key,label,shortLabel,icon,archived,archivedDate}]. Items still live in
// data.nonProject[key]. The legacy fixed six migrate in automatically on first run.
const DEFAULT_SECTIONS = [
  {key:'newBusiness',label:'New Business',shortLabel:'New Business',icon:'briefcase'},
  {key:'swppp',label:'SWPPP',shortLabel:'SWPPP',icon:'water'},
  {key:'developmentSpends',label:'Development Spends',shortLabel:'Dev Spends',icon:'cash'},
  {key:'brws',label:'BRWs',shortLabel:'BRWs',icon:'clipboard'},
  {key:'hoa',label:'HOA',shortLabel:'HOA',icon:'community'},
  {key:'specialProjects',label:'Special Projects',shortLabel:'Special Projects',icon:'star'}
];
function ensureSections() {
  if(!data.nonProject) data.nonProject = {};
  if(!Array.isArray(data.sections)) data.sections = DEFAULT_SECTIONS.map(x => ({...x, archived:false, archivedDate:''}));
  data.sections.forEach(sx => { if(!data.nonProject[sx.key]) data.nonProject[sx.key] = []; });
}
function activeSections(){ return (data.sections||[]).filter(sx=>!sx.archived); }
function visibleSections(){ return showArchivedSections ? (data.sections||[]) : activeSections(); }
function archivedSectionCount(){ return (data.sections||[]).filter(sx=>sx.archived).length; }
function sectionLabel(key){ const sx=(data.sections||[]).find(x=>x.key===key); return sx ? sx.label : (NP_LABELS[key]||key); }
function openSectionModal(){
  const body = `<div class="form-group"><label>Section Name</label><input id="sec-name" placeholder="e.g. Permitting, Engineering, Acquisitions"></div>`;
  openModalDev('Add Section', body, () => {
    const name = document.getElementById('sec-name').value.trim();
    if(!name) return alert('Name required');
    ensureSections();
    const key = 'sec-' + uid();
    data.sections.push({key, label:name, shortLabel:name, icon:'folder', archived:false, archivedDate:''});
    data.nonProject[key] = [];
    logChange('—','Sections',`Added section "${name}"`);
    view='nonproject'; currentNonProject = key;
    saveState(); showToast('Saved'); renderMain();
  });
}
function setSectionArchived(key, val){
  ensureSections();
  const sx = (data.sections||[]).find(x=>x.key===key); if(!sx) return;
  sx.archived = val; sx.archivedDate = val ? todayStr() : '';
  logChange('—','Sections',`Section "${sx.label}" ${val?'archived':'reinstated'}`);
  saveState(); showToast('Saved'); renderMain();
}

function renderNonProject() {
  ensureSections();
  const key = currentNonProject;
  const sec = (data.sections||[]).find(sx=>sx.key===key);
  const label = sec ? sec.label : (NP_LABELS[key] || key);
  if(!data.nonProject[key]) data.nonProject[key]=[];
  const items = data.nonProject[key];
  const active = items.filter(n=>!n.completed);
  const done = items.filter(n=>n.completed);

  function npTile(n) {
    return buildTile(n, {
      phaseName: null,
      toggle: `toggleNPItem('${key}','${n.id}')`,
      toggleSub: stId => `toggleNPSubtask('${key}','${n.id}','${stId}')`,
      edit: `openNPModal('${key}','${n.id}')`,
      del: `deleteNPItem('${key}','${n.id}')`,
      log: `openNoteLogModal('np','${key}','${n.id}')`,
      subLog: stId => `openSubtaskLogModal('np','${key}','${n.id}','${stId}')`
    });
  }

  const activeHtml = active.length ? `<div class="tile-grid">${active.map(npTile).join('')}</div>` : '<div class="empty-state"><p>No active items</p></div>';
  const doneHtml = done.length ? `<details class="completed-section"><summary>Completed (${done.length})</summary><div class="tile-grid">${done.map(npTile).join('')}</div></details>` : '';

  const archBtn = sec ? (sec.archived
    ? `<span class="badge badge-gray">Archived</span> <button class="btn btn-sm" onclick="setSectionArchived('${key}',false)">Reinstate</button>`
    : `<button class="btn btn-sm" onclick="setSectionArchived('${key}',true)">Archive</button>`) : '';
  return `<div class="section-header"><h2>${esc(label)}${sec&&sec.archived?' <span style="font-weight:400;font-size:12px;color:var(--text-muted)">(archived)</span>':''}</h2><div style="display:flex;gap:8px;align-items:center">${archBtn}<button class="btn btn-primary btn-sm" onclick="openNPModal('${key}')">+ Add Item</button></div></div>
    ${activeHtml}${doneHtml}`;
}

function openNPModal(key, itemId) {
  const items = data.nonProject[key];
  const item = itemId ? items.find(n=>n.id===itemId) : null;
  const n = item || {task:'',priority:'medium',date:todayStr(),dueDate:'',assignee:'',subtasks:[],percentComplete:0,completed:false,noteText:''};
  const priOpts = [['urgent','Urgent'],['high','High'],['medium','Medium'],['low','Low']].map(([v,l])=>`<option value="${v}" ${(n.priority||'medium')===v?'selected':''}>${l}</option>`).join('');
  const subtasksHtml = (n.subtasks||[]).map((st,i)=>{
    const sl = (st.noteLog||[])[0] || (st.noteText?{date:st.date||'',text:st.noteText}:null);
    const noteLine = sl ? `<div style="flex-basis:100%;font-size:11px;color:var(--text-muted);font-style:italic;margin-left:22px;line-height:1.3">${sl.date?fmtDate(sl.date)+' — ':''}${esc(sl.text.length>120?sl.text.slice(0,120)+'…':sl.text)}</div>` : '';
    return `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;align-items:center"><input type="hidden" name="npst-id-${i}" value="${esc(st.id||'')}"><input type="checkbox" name="npst-done-${i}" ${st.completed?'checked':''} style="flex-shrink:0"><input name="npst-text-${i}" value="${esc(st.text)}" style="flex:1;min-width:120px" placeholder="Subtask..."><span style="font-size:10px;color:var(--text-muted)">Due</span><input type="date" name="npst-due-${i}" value="${st.dueDate||''}" style="flex:0 0 140px" title="Subtask due date">${item&&st.id?`<button class="btn btn-sm" style="flex-shrink:0" onclick="closeModal();openSubtaskLogModal('np','${key}','${item.id}','${st.id}')">Log${(st.noteLog||[]).length?` (${st.noteLog.length})`:''}</button>`:''}${noteLine}</div>`;
  }).join('');
  const body = `
    <div class="form-group"><label>Task</label><input id="npf-task" value="${esc(n.task)}"></div>
    <div class="form-row"><div class="form-group"><label>Priority</label><select id="npf-pri">${priOpts}</select></div><div class="form-group"><label>Assignee</label><input id="npf-assignee" value="${esc(n.assignee||'')}"></div></div>
    <div class="form-row"><div class="form-group"><label>Date Created</label><input type="date" id="npf-date" value="${n.date}"></div><div class="form-group"><label>Due Date</label><input type="date" id="npf-due" value="${n.dueDate||''}"></div><div class="form-group"><label>% Complete</label><input type="number" id="npf-pct" min="0" max="100" value="${n.percentComplete||0}"></div></div>
    <div class="form-group"><div style="display:flex;align-items:flex-end;justify-content:space-between;gap:8px"><label>Add Note <span style="font-weight:400;text-transform:none">(date-stamped — appended to the note log)</span></label>${item?`<button class="btn btn-sm" style="margin-bottom:4px" onclick="closeModal();openNoteLogModal('np','${key}','${item.id}')">View Full Log (${migrateNoteLog(item).noteLog.length})</button>`:''}</div>${item&&migrateNoteLog(item).noteLog[0]?`<div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">Latest (${item.noteLog[0].date?fmtDate(item.noteLog[0].date):'undated'}): ${esc(item.noteLog[0].text.length>100?item.noteLog[0].text.slice(0,100)+'…':item.noteLog[0].text)}</div>`:''}<textarea id="npf-notes" placeholder="${item?'New note entry…':'Initial note…'}"></textarea></div>
    <div class="form-group"><label>Subtasks</label><div id="npf-subtasks">${subtasksHtml}</div><button class="btn btn-sm" style="margin-top:4px" onclick="addNPSubtaskField()">+ Subtask</button></div>`;
  openModalDev(item?'Edit Item':'Add Item', body, () => {
    const subtasks = [];
    document.querySelectorAll('#npf-subtasks > div').forEach((_,i) => {
      const text = document.querySelector(`[name="npst-text-${i}"]`)?.value.trim();
      if(!text) return;
      // Preserve subtask IDs so their note logs survive edits
      const stId = document.querySelector(`[name="npst-id-${i}"]`)?.value || uid();
      const old = item ? (item.subtasks||[]).find(x=>x.id===stId) : null;
      subtasks.push({id:stId, text, completed:!!document.querySelector(`[name="npst-done-${i}"]`)?.checked, dueDate:document.querySelector(`[name="npst-due-${i}"]`)?.value||'', noteLog:old?.noteLog||[], noteText:old?.noteText||''});
    });
    const vals = {task:document.getElementById('npf-task').value.trim(), priority:document.getElementById('npf-pri').value, date:document.getElementById('npf-date').value, dueDate:document.getElementById('npf-due').value, assignee:document.getElementById('npf-assignee').value.trim(), percentComplete:parseInt(document.getElementById('npf-pct').value)||0, subtasks};
    if(!vals.task) return alert('Task required');
    const newNote = document.getElementById('npf-notes').value.trim();
    if(item) {
      Object.assign(item, vals);
      if(newNote) addNoteEntry(item, newNote);
    } else {
      const created = {id:uid(),...vals,completed:false,completedDate:'',noteLog:[],noteText:''};
      if(newNote) addNoteEntry(created, newNote);
      items.push(created);
    }
    logChange('—',sectionLabel(key),item?`Updated "${vals.task}"${newNote?' (note added)':''}`:`Added "${vals.task}"`);
    saveState(); showToast('Saved'); renderMain();
  });
}

function addNPSubtaskField() {
  const c = document.getElementById('npf-subtasks');
  const i = c.children.length;
  const d = document.createElement('div');
  d.style.cssText='display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;align-items:center';
  d.innerHTML=`<input type="hidden" name="npst-id-${i}" value=""><input type="checkbox" name="npst-done-${i}" style="flex-shrink:0"><input name="npst-text-${i}" placeholder="Subtask..." style="flex:1;min-width:120px"><span style="font-size:10px;color:var(--text-muted)">Due</span><input type="date" name="npst-due-${i}" style="flex:0 0 140px" title="Subtask due date">`;
  c.appendChild(d);
}

function toggleNPItem(key, itemId) {
  const n = data.nonProject[key].find(x=>x.id===itemId);
  n.completed = !n.completed;
  n.completedDate = n.completed ? todayStr() : '';
  if(n.completed) { n.percentComplete = 100; (n.subtasks||[]).forEach(s=>s.completed=true); }
  saveState(); showToast('Saved'); renderMain();
}

function toggleNPSubtask(key, itemId, stId) {
  const n = data.nonProject[key].find(x=>x.id===itemId);
  const st = n.subtasks.find(x=>x.id===stId);
  st.completed = !st.completed;
  const done = n.subtasks.filter(s=>s.completed).length;
  n.percentComplete = n.subtasks.length ? pct(done/n.subtasks.length*100) : 0;
  saveState(); showToast('Saved'); renderMain();
}

function deleteNPItem(key, itemId) {
  if(!confirm('Delete?')) return;
  data.nonProject[key] = data.nonProject[key].filter(n=>n.id!==itemId);
  saveState(); showToast('Saved'); renderMain();
}

// MILESTONE TRACKER
// ════════════════════════════════════════════════════════════════════
function getMilestoneData(projectId, phaseId) {
  if(!data.milestones) data.milestones=[];
  return data.milestones.find(m=>m.projectId===projectId && m.phaseId===phaseId);
}

function renderMilestones() {
  if(!data.milestones) data.milestones=[];
  const milestoneFields = ['earthwork','wetUtilities','paving','accountingSC','legalSC'];
  const milestoneLabels = ['Earthwork','Wet Utilities','Paving','Accounting SC','Legal SC'];
  // Build project selector
  const projOpts = data.projects.map(p=>`<option value="${p.id}" ${currentProjectId===p.id?'selected':''}>${esc(p.name)}</option>`).join('');
  const projSelect = data.projects.length ? `<select id="ms-proj-select" onchange="switchMilestoneProject(this.value)" style="font-size:13px;padding:5px 10px;border-radius:var(--radius);border:1px solid var(--border)"><option value="">— Select Project —</option>${projOpts}</select>` : '';
  const proj = currentProjectId ? data.projects.find(p=>p.id===currentProjectId) : null;
  const pv = proj ? visiblePhases(proj) : [];
  let tableHtml = '';
  if(proj && pv.length) {
    const rows = pv.map((ph,i) => {
      const ms = getMilestoneData(proj.id, ph.id) || {};
      const rowClass = i%2===0 ? 'ms-row-even' : 'ms-row-odd';
      const cells = milestoneFields.map(f => `<td>${ms[f] ? fmtDate(ms[f]) : '—'}</td>`).join('');
      return `<tr class="${rowClass}" style="${ph.archived?'opacity:.6':''}">
        <td style="font-weight:600">${esc(ph.name)}${ph.archived?' <span style="font-weight:400;font-size:10px;color:var(--text-light)">(archived)</span>':''}</td><td>${ph.lotCount||'—'}</td><td>${ms.startDate ? fmtDate(ms.startDate) : '—'}</td>
        ${cells}
        <td><div class="table-actions"><button onclick="openMilestoneModal('${proj.id}','${ph.id}')">Edit</button></div></td>
      </tr>`;
    }).join('');
    tableHtml = `<div class="card" style="overflow-x:auto"><table class="ms-table"><thead><tr>
      <th>Phase</th><th>Lots</th><th>Start Date</th>
      ${milestoneLabels.map(l=>`<th>${l}</th>`).join('')}
      <th>Actions</th>
    </tr></thead><tbody>${rows}</tbody></table></div>`;
  } else if(proj && (proj.phases||[]).length) {
    tableHtml = `<div class="card"><div class="empty-state"><p>${archivedCount(proj)?'All phases are archived. Use “Show archived” to view them.':'No phases defined for this project. Edit the project to add phases.'}</p></div></div>`;
  } else if(proj) {
    tableHtml = `<div class="card"><div class="empty-state"><p>No phases defined for this project. Edit the project to add phases.</p></div></div>`;
  } else {
    tableHtml = `<div class="card"><div class="empty-state"><p>Select a project above to view its milestone tracker.</p></div></div>`;
  }
  return `<div class="section-header"><h2>Milestone Tracker</h2><div style="display:flex;gap:10px;align-items:center">${proj?archivedToggleChip(proj):''}${projSelect}</div></div>${tableHtml}`;
}

function switchMilestoneProject(id) {
  currentProjectId = id || null;
  renderMain();
}

function openMilestoneModal(projectId, phaseId) {
  const proj = data.projects.find(p=>p.id===projectId);
  const phase = proj ? (proj.phases||[]).find(ph=>ph.id===phaseId) : null;
  if(!proj || !phase) return;
  if(!data.milestones) data.milestones=[];
  const ms = getMilestoneData(projectId, phaseId) || {};
  const body = `
    <div class="form-group"><label>Phase</label><input value="${esc(phase.name)}" disabled style="background:#f0f0f0"></div>
    <div class="form-group"><label>Start Date</label><input type="date" id="mf-startDate" value="${ms.startDate||''}"></div>
    <div class="form-row"><div class="form-group"><label>Earthwork</label><input type="date" id="mf-earthwork" value="${ms.earthwork||''}"></div><div class="form-group"><label>Wet Utilities</label><input type="date" id="mf-wetUtilities" value="${ms.wetUtilities||''}"></div></div>
    <div class="form-row"><div class="form-group"><label>Paving</label><input type="date" id="mf-paving" value="${ms.paving||''}"></div><div class="form-group"><label>Accounting SC</label><input type="date" id="mf-accountingSC" value="${ms.accountingSC||''}"></div></div>
    <div class="form-group"><label>Legal SC</label><input type="date" id="mf-legalSC" value="${ms.legalSC||''}"></div>`;
  openModalDev(`Milestones — ${esc(phase.name)}`, body, () => {
    const vals = {projectId, phaseId,
      startDate: document.getElementById('mf-startDate').value,
      earthwork: document.getElementById('mf-earthwork').value,
      wetUtilities: document.getElementById('mf-wetUtilities').value,
      paving: document.getElementById('mf-paving').value,
      accountingSC: document.getElementById('mf-accountingSC').value,
      legalSC: document.getElementById('mf-legalSC').value
    };
    const existing = data.milestones.find(m=>m.projectId===projectId && m.phaseId===phaseId);
    if(existing) Object.assign(existing, vals);
    else data.milestones.push({id:uid(), ...vals});
    logChange(proj.name, 'Milestones', `Updated milestones for ${phase.name}`);
    saveState(); showToast('Saved'); renderMain();
  });
}

function renderHistory() {
