// Cross-project rollup: one "what needs me" view across every project.
// Pure read over `data` — reuses existing helpers.
const PORTFOLIO_HORIZON = 14; // days ahead counted as "coming due"

// Calendar days from today to an ISO date (negative = in the past).
function daysFromToday(dateStr) {
  if(!dateStr) return null;
  return Math.round((new Date(dateStr+'T00:00:00') - new Date(todayStr()+'T00:00:00'))/86400000);
}
function phaseOf(p, phaseId){ return (p.phases||[]).find(x=>x.id===phaseId); }
// Skip records in archived (completed) phases; keep records whose phase was
// deleted (phase undefined) so nothing silently disappears from the rollup.
function pfLivePhase(ph){ return !(ph && ph.archived); }

// Critical-path schedule items finishing within the horizon (not done, not on hold).
function pfComingDue() {
  const out = [];
  data.projects.forEach(p => (p.schedule||[]).forEach(s => {
    if((s.category||'secondary')!=='critical-path' || s.status==='completed' || s.status==='on-hold' || !s.projectedFinish) return;
    const ph = phaseOf(p, s.phaseId); if(!pfLivePhase(ph)) return;
    const d = daysFromToday(s.projectedFinish);
    if(d===null || d<0 || d>PORTFOLIO_HORIZON) return;
    out.push({p, ph, task:s.task, date:s.projectedFinish, days:d, status:s.status});
  }));
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}

// Anything past its date and not done: schedule tasks, notes, and subtasks.
function pfOverdue() {
  const out = [];
  data.projects.forEach(p => {
    (p.schedule||[]).forEach(s => {
      if(s.status==='completed' || s.status==='on-hold' || !s.projectedFinish) return;
      const ph = phaseOf(p, s.phaseId); if(!pfLivePhase(ph)) return;
      const d = daysFromToday(s.projectedFinish);
      if(d===null || d>=0) return;
      out.push({p, ph, kind:'Task', cp:(s.category||'secondary')==='critical-path', label:s.task, date:s.projectedFinish, days:d, tab:'schedule'});
    });
    (p.notes||[]).forEach(n => {
      if(n.completed) return;
      const ph = phaseOf(p, n.phaseId); if(!pfLivePhase(ph)) return;
      if(n.dueDate){ const d=daysFromToday(n.dueDate); if(d!==null && d<0) out.push({p, ph, kind:'Note', label:n.task, date:n.dueDate, days:d, tab:'notes'}); }
      (n.subtasks||[]).forEach(st => {
        if(st.completed || !st.dueDate) return;
        const d = daysFromToday(st.dueDate); if(d===null || d>=0) return;
        out.push({p, ph, kind:'Subtask', label:esc(st.text)+' · '+esc(n.task), raw:true, date:st.dueDate, days:d, tab:'notes'});
      });
    });
  });
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}

// Contractors awarded but not yet released (NTP not "yes").
function pfPendingNTP() {
  const out = [];
  data.projects.forEach(p => (p.bidding||[]).forEach(b => {
    if(b.contractStatus!=='awarded' || (b.ntp||'no')==='yes') return;
    const ph = phaseOf(p, b.phaseId); if(!pfLivePhase(ph)) return;
    out.push({p, ph, contractor:b.contractor, specialty:b.specialty, ntp:b.ntp||'no', amount:b.amount});
  }));
  return out;
}

// Franchise utilities physically underway (install reached) but not energized.
function pfUtilities() {
  const out = [];
  const order = UTILITY_STAGE_DEFS.map(d=>d.key);
  const installIdx = order.indexOf('install');
  data.projects.forEach(p => (p.utilities||[]).forEach(u => {
    migrateUtility(u);
    if((u.stages.energization||{}).status==='complete') return;
    const started = UTILITY_STAGE_DEFS.filter(sd => { const st=u.stages[sd.key]||{}; return st.status==='in-progress' || st.status==='complete'; });
    if(!started.length) return;
    const last = started[started.length-1];
    if(order.indexOf(last.key) < installIdx) return; // still in pre-con design — not "near" energization
    const ph = phaseOf(p, u.phaseId); if(!pfLivePhase(ph)) return;
    out.push({p, ph, type:u.utilityType, provider:u.provider, stage:last.name});
  }));
  return out;
}

// Net working days of delay grouped by cause tag, across all projects.
function pfDelaysByTag() {
  const byTag = {};
  data.projects.forEach(p => (p.schedule||[]).forEach(s => (s.delays||[]).forEach(d => {
    const k = d.tag || 'Untagged'; byTag[k] = (byTag[k]||0) + (d.workingDays||0);
  })));
  return Object.entries(byTag).filter(([,v])=>v!==0).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));
}

// Jump from a portfolio row into the relevant project tab + phase.
function pfGoto(projId, phaseId, tab) {
  view='project'; currentProjectId=projId; devProjectTab=tab||'schedule';
  if(phaseId){ devPhaseFilter=phaseId; notesPhaseFilter=phaseId; biddingPhaseFilter=phaseId; utilityPhaseFilter=phaseId; }
  renderMain();
}

function renderPortfolio() {
  if(!data.projects.length) {
    return `<div class="section-header"><h2>Portfolio</h2></div><div class="empty-state"><p>No projects yet. Add a project to see the portfolio rollup.</p></div>`;
  }
  const projCount = data.projects.length;
  const totalLots = data.projects.reduce((s,p)=>s+(p.phases||[]).reduce((a,ph)=>a+(ph.lotCount||0),0),0);
  const phaseCount = data.projects.reduce((s,p)=>s+activePhases(p).length,0);
  const coming = pfComingDue();
  const overdue = pfOverdue();
  const ntp = pfPendingNTP();
  const utils = pfUtilities();
  const delays = pfDelaysByTag();
  let behind = 0;
  data.projects.forEach(p => activePhases(p).forEach(ph => { if(phaseVariance(p, ph.id).net > 0) behind++; }));
  const meetingDate = new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});

  const projPhase = e => `${esc(e.p.name)}${e.ph?' · '+esc(e.ph.name):' · <span style="color:var(--text-light)">(removed phase)</span>'}`;

  // ---- KPI strip ----
  const kpi = (label, val, color) => `<div class="card" style="padding:12px 16px;min-width:120px;flex:1"><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted)">${label}</div><div style="font-size:22px;font-weight:700;margin-top:2px;${color?'color:'+color:''}">${val}</div></div>`;
  const kpis = `<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px">
    ${kpi('Projects', projCount)}
    ${kpi('Phases', phaseCount)}
    ${kpi('Total Lots', totalLots.toLocaleString())}
    ${kpi('CP Due &le;'+PORTFOLIO_HORIZON+'d', coming.length, coming.length?'var(--warning)':'')}
    ${kpi('Overdue', overdue.length, overdue.length?'var(--danger)':'var(--success)')}
    ${kpi('Awaiting NTP', ntp.length, ntp.length?'var(--warning)':'')}
    ${kpi('Phases Behind', behind, behind?'var(--danger)':'var(--success)')}
  </div>`;

  // ---- Coming due (critical path) ----
  const dueRows = coming.map(e => `<tr style="cursor:pointer" onclick="pfGoto('${e.p.id}','${e.ph?e.ph.id:''}','schedule')">
    <td style="white-space:nowrap;font-weight:600">${fmtDate(e.date)}</td>
    <td style="white-space:nowrap;color:var(--text-muted);font-size:12px">${e.days===0?'today':e.days===1?'tomorrow':'in '+e.days+'d'}</td>
    <td>${esc(e.task)}</td>
    <td style="color:var(--text-muted);font-size:12px;white-space:nowrap">${projPhase(e)}</td>
    <td>${statusBadge(e.status)}</td></tr>`).join('');
  const dueCard = `<div class="section-header" style="margin-top:4px"><h2>Coming due — next ${PORTFOLIO_HORIZON} days <span style="font-weight:400;color:var(--text-muted);font-size:13px">· critical path</span></h2></div>
    <div class="card" style="margin-bottom:24px"><table><thead><tr><th>Finish</th><th>When</th><th>Task</th><th>Project · Phase</th><th>Status</th></tr></thead><tbody>${dueRows||`<tr><td colspan="5" style="text-align:center;color:var(--text-muted);padding:18px">Nothing on the critical path finishes in the next ${PORTFOLIO_HORIZON} days.</td></tr>`}</tbody></table></div>`;

  // ---- Overdue ----
  const odRows = overdue.map(e => `<tr style="cursor:pointer" onclick="pfGoto('${e.p.id}','${e.ph?e.ph.id:''}','${e.tab}')">
    <td><span class="badge badge-red">${-e.days}d late</span></td>
    <td style="white-space:nowrap;font-size:12px;color:var(--text-muted)">${e.kind}${e.cp?' · CP':''}</td>
    <td>${e.raw?e.label:esc(e.label)}</td>
    <td style="color:var(--text-muted);font-size:12px;white-space:nowrap">${projPhase(e)}</td>
    <td style="white-space:nowrap">${fmtDate(e.date)}</td></tr>`).join('');
  const odCard = `<div class="section-header"><h2>Overdue ${overdue.length?`<span style="color:var(--danger)">(${overdue.length})</span>`:''}</h2></div>
    <div class="card" style="margin-bottom:24px"><table><thead><tr><th>Late</th><th>Type</th><th>Item</th><th>Project · Phase</th><th>Due</th></tr></thead><tbody>${odRows||`<tr><td colspan="5" style="text-align:center;color:var(--success);padding:18px">Nothing overdue across the portfolio.</td></tr>`}</tbody></table></div>`;

  // ---- Awarded, awaiting NTP ----
  const ntpRows = ntp.map(e => `<tr style="cursor:pointer" onclick="pfGoto('${e.p.id}','${e.ph?e.ph.id:''}','bidding')">
    <td style="font-weight:600">${esc(e.contractor)}</td>
    <td style="font-size:12px;color:var(--text-muted)">${esc(e.specialty||'')}</td>
    <td style="white-space:nowrap;color:var(--text-muted);font-size:12px">${projPhase(e)}</td>
    <td>${statusBadge(e.ntp)}</td>
    <td style="white-space:nowrap">${fmtCurrency(e.amount)}</td></tr>`).join('');
  const ntpCard = `<div class="section-header"><h2>Awarded — awaiting NTP ${ntp.length?`<span style="color:var(--warning)">(${ntp.length})</span>`:''}</h2></div>
    <div class="card" style="margin-bottom:24px"><table><thead><tr><th>Contractor</th><th>Specialty</th><th>Project · Phase</th><th>NTP</th><th>Amount</th></tr></thead><tbody>${ntpRows||`<tr><td colspan="5" style="text-align:center;color:var(--text-muted);padding:18px">No awarded contracts waiting on NTP.</td></tr>`}</tbody></table></div>`;

  // ---- Franchise utilities underway ----
  const utilRows = utils.map(e => `<tr style="cursor:pointer" onclick="pfGoto('${e.p.id}','${e.ph?e.ph.id:''}','utilities')">
    <td style="font-weight:600">${esc(e.type)}</td>
    <td style="font-size:12px;color:var(--text-muted)">${esc(e.provider||'No provider')}</td>
    <td style="white-space:nowrap;color:var(--text-muted);font-size:12px">${projPhase(e)}</td>
    <td><span class="badge badge-yellow">${esc(e.stage)}</span></td></tr>`).join('');
  const utilCard = `<div class="section-header"><h2>Franchise utilities underway <span style="font-weight:400;color:var(--text-muted);font-size:13px">· not yet energized</span></h2></div>
    <div class="card" style="margin-bottom:24px"><table><thead><tr><th>Utility</th><th>Provider</th><th>Project · Phase</th><th>Furthest Stage</th></tr></thead><tbody>${utilRows||`<tr><td colspan="4" style="text-align:center;color:var(--text-muted);padding:18px">No utilities in construction yet.</td></tr>`}</tbody></table></div>`;

  // ---- Delays by cause ----
  let delayCard = '';
  if(delays.length) {
    const maxAbs = Math.max(...delays.map(([,v])=>Math.abs(v)));
    const bars = delays.map(([tag,v]) => {
      const w = maxAbs ? Math.round(Math.abs(v)/maxAbs*100) : 0;
      const color = v>0 ? 'var(--danger)' : 'var(--success)';
      return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
        <span style="font-size:12px;min-width:140px;color:var(--text-muted)">${esc(tag)}</span>
        <div style="flex:1;height:14px;background:var(--bg);border-radius:3px;overflow:hidden"><div style="width:${w}%;height:100%;background:${color};opacity:.6"></div></div>
        <span style="font-size:12px;font-weight:700;min-width:38px;text-align:right;color:${color}">${v>0?'+':''}${v} wd</span></div>`;
    }).join('');
    delayCard = `<div class="section-header"><h2>Delays by cause <span style="font-weight:400;color:var(--text-muted);font-size:13px">· working days, all projects</span></h2></div>
      <div class="card" style="margin-bottom:24px;padding:16px 18px">${bars}</div>`;
  }

  return `<div class="section-header"><h2>Portfolio <span style="font-weight:400;color:var(--text-muted);font-size:13px">| DFW West</span></h2><div style="font-size:12px;color:var(--text-muted)">${meetingDate}</div></div>
    ${kpis}${dueCard}${odCard}${ntpCard}${utilCard}${delayCard}`;
}

function renderSummaryTab(p) {
  const tasks = getProjectTasks(p.id);
  const byDept = {};
  DEPARTMENTS.forEach(d => { byDept[d] = tasks.filter(t => t.department === d); });

  function deptSummary(dept) {
    const dt = byDept[dept] || [];
    const open = dt.filter(t => t.status !== 'completed').length;
    const completed = dt.filter(t => t.status === 'completed').length;
    const critical = dt.filter(t => t.priority === 'critical' && t.status !== 'completed').length;
    const overdue = dt.filter(t => isOverdue(t.dueDate) && t.status !== 'completed').length;
    return `<div class="summary-panel">
      <h3>${DEPT_LABELS[dept]}</h3>
      <div class="summary-stat"><span>Open Tasks</span><strong>${open}</strong></div>
      <div class="summary-stat"><span>Completed</span><strong>${completed}</strong></div>
      <div class="summary-stat"><span>Critical</span><strong style="color:${critical ? 'var(--crit)' : 'inherit'}">${critical}</strong></div>
      <div class="summary-stat"><span>Overdue</span><strong style="color:${overdue ? 'var(--crit)' : 'inherit'}">${overdue}</strong></div>
      <div class="summary-stat"><span>Total</span><strong>${dt.length}</strong></div>
    </div>`;
  }

  // Critical tasks across all departments
  const criticalTasks = tasks.filter(t => t.priority === 'critical' && t.status !== 'completed');
  const critRows = criticalTasks.length ? criticalTasks.map(t => `
    <tr onclick="editTask('${t.id}')" style="cursor:pointer">
      <td style="font-weight:600">${esc(t.taskName)}</td>
      <td>${DEPT_LABELS[t.department]}</td>
      <td>${statusBadge(t.status)}</td>
      <td>${fmtDate(t.dueDate || t.projectedFinish)}</td>
      <td>${esc(t.assignee || '—')}</td>
    </tr>`).join('')
    : '<tr><td colspan="5" style="text-align:center;color:var(--text2)">No critical tasks</td></tr>';

  return `
    <div class="section-header">
      <h2>Summary — ${esc(p.name)}</h2>
      <button class="btn btn-primary" onclick="generatePDF('${p.id}')">📄 Generate PDF Summary</button>
    </div>

    <div class="summary-grid">
      ${DEPARTMENTS.map(d => deptSummary(d)).join('')}
    </div>

    <div style="margin-top:24px">
      <div class="card">
        <div class="card-header"><h3>🔴 Critical Tasks</h3></div>
        <div class="card-body" style="padding:0">
          <table><thead><tr><th>Task</th><th>Department</th><th>Status</th><th>Due</th><th>Assignee</th></tr></thead>
          <tbody>${critRows}</tbody></table>
        </div>
      </div>
    </div>`;
}

function generatePDF(projectId) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const p = getProject(projectId);
  if (!p) return;

  const tasks = getProjectTasks(projectId);
  const now = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

  // Cover
  doc.setFillColor(249, 115, 22);
  doc.rect(0, 0, 210, 40, 'F');
  doc.setTextColor(255);
  doc.setFontSize(24);
  doc.setFont(undefined, 'bold');
  doc.text('TaskAura', 20, 22);
  doc.setFontSize(12);
  doc.setFont(undefined, 'normal');
  doc.text('Project Summary Report', 20, 32);
  doc.setTextColor(0);
  doc.setFontSize(20);
  doc.setFont(undefined, 'bold');
  doc.text(p.name, 20, 60);
  doc.setFontSize(11);
  doc.setFont(undefined, 'normal');
  doc.setTextColor(100);
  doc.text(`Generated: ${now}`, 20, 70);
  doc.text(`PM: ${p.projectManager || '—'} | Location: ${[p.city, p.county, p.state].filter(Boolean).join(', ') || '—'}`, 20, 78);

  let yPos = 95;

  // Sort: by department, then priority order
  const priOrder = { critical: 0, high: 1, medium: 2, low: 3 };
  DEPARTMENTS.forEach(dept => {
    const deptTasks = tasks.filter(t => t.department === dept);
    if (!deptTasks.length) return;

    deptTasks.sort((a, b) => (priOrder[a.priority] || 2) - (priOrder[b.priority] || 2));

    if (yPos > 250) { doc.addPage(); yPos = 20; }

    // Department header
    doc.setFillColor(249, 115, 22);
    doc.rect(15, yPos - 5, 180, 8, 'F');
    doc.setTextColor(255);
    doc.setFontSize(11);
    doc.setFont(undefined, 'bold');
    doc.text(DEPT_LABELS[dept].toUpperCase(), 20, yPos + 1);
    doc.setTextColor(0);
    yPos += 12;

    // Table
    const tableData = deptTasks.map(t => [
      t.taskName,
      (t.priority || 'medium').charAt(0).toUpperCase() + (t.priority || 'medium').slice(1),
      (t.status || 'not-started').replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase()),
      t.dueDate ? fmtDate(t.dueDate) : (t.projectedFinish ? fmtDate(t.projectedFinish) : '—'),
      t.assignee || '—',
      `${pct(t.percentComplete || 0)}%`
    ]);

    doc.autoTable({
      startY: yPos,
      head: [['Task', 'Priority', 'Status', 'Due', 'Assignee', '%']],
      body: tableData,
      theme: 'grid',
      headStyles: { fillColor: [30, 30, 30], fontSize: 8, fontStyle: 'bold' },
      bodyStyles: { fontSize: 8 },
      columnStyles: { 0: { cellWidth: 55 }, 1: { cellWidth: 20 }, 2: { cellWidth: 25 }, 3: { cellWidth: 25 }, 4: { cellWidth: 25 }, 5: { cellWidth: 15 } },
      margin: { left: 15, right: 15 },
      didParseCell: (data) => {
        if (data.section === 'body' && data.column.index === 1) {
          const v = data.cell.raw.toLowerCase();
          if (v === 'critical') data.cell.styles.textColor = [220, 38, 38];
          else if (v === 'high') data.cell.styles.textColor = [249, 115, 22];
        }
      }
    });

    yPos = doc.lastAutoTable.finalY + 12;
  });

  // Footer on each page
  const pageCount = doc.internal.getNumberOfPages();
  for (let i = 1; i <= pageCount; i++) {
    doc.setPage(i);
    doc.setFontSize(8);
    doc.setTextColor(150);
    doc.text(`TaskAura — ${p.name} — Page ${i} of ${pageCount}`, 105, 290, { align: 'center' });
  }

  doc.save(`TaskAura_${p.name.replace(/\s+/g, '_')}_Summary.pdf`);
  showToast('PDF downloaded');
}

// PROJECT MODAL (Add / Edit)
// ════════════════════════════════════════════════════════════════════
function openProjectModal(proj) {
  const p = proj || { name: '', city: '', county: '', state: 'TX', projectManager: '', phases: [{ id: uid(), name: 'Phase 1', lotCount: '' }] };
  const isEdit = !!proj;

  const phasesHtml = (p.phases || []).map((ph, i) => `
    <div class="form-row" data-phase-idx="${i}" data-phase-id="${ph.id || ''}" style="align-items:flex-end">
      <div class="form-group"><label>Phase ${i + 1} Name</label><input class="ph-name" value="${esc(ph.name || '')}"></div>
      <div class="form-group" style="flex:0 0 80px"><label>Lots</label><input type="number" class="ph-lots" value="${ph.lotCount || ''}"></div>
      <div class="form-group" style="flex:0 0 auto"><label>&nbsp;</label><button class="btn btn-sm btn-danger" onclick="this.closest('[data-phase-idx]').remove()">✕</button></div>
    </div>`).join('');

  const body = `
    <div class="form-group"><label>Project Name</label><input id="pf-name" value="${esc(p.name)}"></div>
    <div class="form-row">
      <div class="form-group"><label>City</label><input id="pf-city" value="${esc(p.city || '')}"></div>
      <div class="form-group"><label>County</label><input id="pf-county" value="${esc(p.county || '')}"></div>
      <div class="form-group"><label>State</label><input id="pf-state" value="${esc(p.state || 'TX')}"></div>
    </div>
    <div class="form-group"><label>Project Manager</label><input id="pf-pm" value="${esc(p.projectManager || '')}"></div>
    <div class="form-group"><label>Phases</label><div id="pf-phases">${phasesHtml}</div>
      <button class="btn btn-sm" style="margin-top:6px" onclick="addPhaseField()">+ Add Phase</button>
    </div>`;

  openModal(isEdit ? 'Edit Project' : 'New Project', body,
    `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveProject(${isEdit ? `'${p.id}'` : 'null'})">Save</button>`);
}

function addPhaseField() {
  const c = document.getElementById('pf-phases');
  const idx = c.children.length;
  const div = document.createElement('div');
  div.innerHTML = `<div class="form-row" data-phase-idx="${idx}" data-phase-id="" style="align-items:flex-end">
    <div class="form-group"><label>Phase ${idx + 1} Name</label><input class="ph-name" value="Phase ${idx + 1}"></div>
    <div class="form-group" style="flex:0 0 80px"><label>Lots</label><input type="number" class="ph-lots" value=""></div>
    <div class="form-group" style="flex:0 0 auto"><label>&nbsp;</label><button class="btn btn-sm btn-danger" onclick="this.closest('[data-phase-idx]').remove()">✕</button></div>
  </div>`;
  c.appendChild(div.firstElementChild);
}

function saveProject(editId) {
  const name = document.getElementById('pf-name').value.trim();
  if (!name) { alert('Project name required'); return; }

  const phaseRows = document.querySelectorAll('#pf-phases [data-phase-idx]');
  const phases = [];
  phaseRows.forEach(row => {
    const phName = row.querySelector('.ph-name').value.trim() || 'Phase';
    const lots = parseInt(row.querySelector('.ph-lots').value) || 0;
    const existingId = row.dataset.phaseId;
    phases.push({
      id: existingId || uid(),
      name: phName,
      lotCount: lots,
      currentStage: 'Pre-Construction',
      constructionStart: '',
      originalSubComp: '',
      archived: false
    });
  });

  if (!phases.length) { alert('At least one phase required'); return; }

  if (editId) {
    const p = state.projects.find(x => x.id === editId);
    if (p) {
      // Preserve existing phase data for phases that still exist
      const oldById = new Map((p.phases || []).map(ph => [ph.id, ph]));
      phases.forEach(ph => {
        const old = oldById.get(ph.id);
        if (old) {
          ph.currentStage = old.currentStage || 'Pre-Construction';
          ph.constructionStart = old.constructionStart || '';
          ph.originalSubComp = old.originalSubComp || '';
          ph.archived = old.archived || false;
        }
      });
      p.name = name;
      p.city = document.getElementById('pf-city').value.trim();
      p.county = document.getElementById('pf-county').value.trim();
      p.state = document.getElementById('pf-state').value.trim();
      p.projectManager = document.getElementById('pf-pm').value.trim();
      p.phases = phases;
    }
  } else {
    state.projects.push({
      id: uid(), name,
      city: document.getElementById('pf-city').value.trim(),
      county: document.getElementById('pf-county').value.trim(),
      state: document.getElementById('pf-state').value.trim(),
      projectManager: document.getElementById('pf-pm').value.trim(),
      phases,
      schedule: [], bidding: [], utilities: [], notes: [],
      resources: {contacts: [], links: []},
      amenityCenters: [], parks: []
    });
  }

  saveState(); closeModal();
  if (!editId) {
    const newP = state.projects[state.projects.length - 1];
    navTo('project', { projectId: newP.id });
  } else {
    renderMain();
  }
  renderSidebar();
  showToast(editId ? 'Project updated' : 'Project created');
}

function deleteProject(projId) {
  if (!confirm('Delete this project and all its tasks?')) return;
  state.projects = state.projects.filter(p => p.id !== projId);
  state.tasks = state.tasks.filter(t => t.projectId !== projId);
  saveState();
  if (selectedProjectId === projId) selectedProjectId = null;
  navTo('dashboard');
  showToast('Project deleted');
}

// ════════════════════════════════════════════════════════════════════
// NEW TASK MODAL
// ════════════════════════════════════════════════════════════════════
function openNewTaskModal(dept, prefillDate) {
  const projOpts = state.projects.map(p => `<option value="${p.id}" ${p.id === selectedProjectId ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
  if (!state.projects.length) { showToast('Create a project first'); return; }

  const ls = state.legalSettings;
  const deptVal = dept || 'acquisition';

  const body = `
    <div class="form-row">
      <div class="form-group"><label>Department</label>
        <select id="nt-dept" onchange="toggleDevFields()">
          ${DEPARTMENTS.map(d => `<option value="${d}" ${d === deptVal ? 'selected' : ''}>${DEPT_LABELS[d]}</option>`).join('')}
        </select>
      </div>
      <div class="form-group"><label>Project</label>
        <select id="nt-proj" onchange="updatePhaseSelect()">${projOpts}</select>
      </div>
    </div>
    <div class="form-group"><label>Task Name</label><input id="nt-name"></div>
    <div class="form-row">
      <div class="form-group"><label>Priority</label>
        <select id="nt-pri">${PRIORITIES.map(pr => `<option value="${pr}" ${pr === 'medium' ? 'selected' : ''}>${pr.charAt(0).toUpperCase() + pr.slice(1)}</option>`).join('')}</select>
      </div>
      <div class="form-group"><label>Status</label>
        <select id="nt-status">${STATUSES.map(s => `<option value="${s}">${s.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase())}</option>`).join('')}</select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Assignee</label><input id="nt-assignee"></div>
      <div class="form-group"><label>Due Date</label><input type="date" id="nt-due" value="${prefillDate || ''}"></div>
    </div>
    <div id="devFields" style="display:none">
      <div class="form-row">
        <div class="form-group"><label>Phase</label><select id="nt-phase"></select></div>
        <div class="form-group"><label>Category</label>
          <select id="nt-cat"><option value="critical-path">Critical Path</option><option value="secondary" selected>Secondary</option></select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Start Date</label><input type="date" id="nt-start"></div>
        <div class="form-group"><label>Projected Finish</label><input type="date" id="nt-finish"></div>
      </div>
    </div>
    <div id="legalFields" style="display:none">
      <div class="form-row">
        <div class="form-group"><label>Counsel Type</label>
          <select id="nt-counsel"><option value="">—</option>${ls.counselTypes.map(c => `<option>${esc(c)}</option>`).join('')}</select>
        </div>
        <div class="form-group"><label>Action Type</label>
          <select id="nt-action"><option value="">—</option>${ls.actionTypes.map(a => `<option>${esc(a)}</option>`).join('')}</select>
        </div>
      </div>
    </div>
    <div class="form-group"><label>Description</label><textarea id="nt-desc"></textarea></div>
    <div class="form-group"><label>Checklist</label>
      <div id="nt-checklist" class="checklist"></div>
      <button class="cl-add" onclick="addChecklistItem('nt-checklist')">+ Add item</button>
    </div>`;

  openModal('New Task', body,
    `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveNewTask()">Create Task</button>`);

  toggleDevFields();
  updatePhaseSelect();
}

function toggleDevFields() {
  const dept = document.getElementById('nt-dept').value;
  const df = document.getElementById('devFields');
  const lf = document.getElementById('legalFields');
  df.style.display = dept === 'development' ? 'block' : 'none';
  lf.style.display = dept === 'legal' ? 'block' : 'none';
}

function updatePhaseSelect() {
  const projId = document.getElementById('nt-proj').value;
  const p = getProject(projId);
  const sel = document.getElementById('nt-phase');
  if (!sel) return;
  sel.innerHTML = (p && p.phases ? p.phases : []).filter(ph => !ph.archived).map(ph => `<option value="${ph.id}">${esc(ph.name)}</option>`).join('');
}

function addChecklistItem(containerId) {
  const c = document.getElementById(containerId);
  const div = document.createElement('div');
  div.className = 'cl-item';
  div.innerHTML = `<input type="checkbox"><input type="text" placeholder="Checklist item..."><button class="cl-rm" onclick="this.parentElement.remove()">×</button>`;
  c.appendChild(div);
  div.querySelector('input[type=text]').focus();
}

function saveNewTask() {
  const name = document.getElementById('nt-name').value.trim();
  if (!name) { alert('Task name required'); return; }
  const dept = document.getElementById('nt-dept').value;
  const projId = document.getElementById('nt-proj').value;

  const checklist = [];
  document.querySelectorAll('#nt-checklist .cl-item').forEach(item => {
    const text = item.querySelector('input[type=text]').value.trim();
    if (text) checklist.push({ id: uid(), text, done: item.querySelector('input[type=checkbox]').checked });
  });

  const task = {
    id: uid(), department: dept, projectId: projId,
    taskName: name, priority: document.getElementById('nt-pri').value || 'medium',
    status: document.getElementById('nt-status').value || 'not-started',
    assignee: document.getElementById('nt-assignee').value.trim(),
    dueDate: document.getElementById('nt-due').value,
    percentComplete: 0,
    description: document.getElementById('nt-desc').value.trim(),
    notes: '', checklist,
    bucket: 'To Do',
    createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
  };

  // Development-specific
  if (dept === 'development') {
    task.phaseId = document.getElementById('nt-phase').value;
    task.category = document.getElementById('nt-cat').value;
    task.startDate = document.getElementById('nt-start').value;
    task.projectedFinish = document.getElementById('nt-finish').value;
    task.originalFinish = task.projectedFinish;
    task.dueDate = task.projectedFinish;
    task.delays = [];
  }

  // Legal-specific
  if (dept === 'legal') {
    task.counselType = document.getElementById('nt-counsel').value;
    task.actionType = document.getElementById('nt-action').value;
    if (task.dueDate) task.priority = lt_calcPriority(task.dueDate);
  }

  state.tasks.push(task);
  saveState(); closeModal(); renderMain();
  showToast('Task created');
}

// Dev-specific task add shortcut
function openDevTaskModal(projId, phaseId) {
  openNewTaskModal('development');
  // Pre-select phase after modal renders
  setTimeout(() => {
    const pSel = document.getElementById('nt-proj');
    if (pSel) pSel.value = projId;
    updatePhaseSelect();
    setTimeout(() => {
      const phSel = document.getElementById('nt-phase');
      if (phSel) phSel.value = phaseId;
    }, 50);
  }, 50);
}

// ════════════════════════════════════════════════════════════════════
// EDIT TASK MODAL
// ════════════════════════════════════════════════════════════════════
function editTask(taskId) {
  const t = state.tasks.find(x => x.id === taskId);
  if (!t) return;
  const ls = state.legalSettings;
  const p = getProject(t.projectId);

  const projOpts = state.projects.map(pr => `<option value="${pr.id}" ${pr.id === t.projectId ? 'selected' : ''}>${esc(pr.name)}</option>`).join('');
  const phaseOpts = p ? (p.phases || []).filter(ph => !ph.archived).map(ph => `<option value="${ph.id}" ${ph.id === t.phaseId ? 'selected' : ''}>${esc(ph.name)}</option>`).join('') : '';

  const checklistHtml = (t.checklist || []).map(c => `
    <div class="cl-item"><input type="checkbox" ${c.done ? 'checked' : ''} data-cl-id="${c.id}"><input type="text" value="${esc(c.text)}" data-cl-id="${c.id}"><button class="cl-rm" onclick="this.parentElement.remove()">×</button></div>`).join('');

  const body = `
    <div class="form-row">
      <div class="form-group"><label>Department</label>
        <select id="et-dept" onchange="toggleEditDevFields()">
          ${DEPARTMENTS.map(d => `<option value="${d}" ${d === t.department ? 'selected' : ''}>${DEPT_LABELS[d]}</option>`).join('')}
        </select>
      </div>
      <div class="form-group"><label>Project</label><select id="et-proj">${projOpts}</select></div>
    </div>
    <div class="form-group"><label>Task Name</label><input id="et-name" value="${esc(t.taskName)}"></div>
    <div class="form-row">
      <div class="form-group"><label>Priority</label>
        <select id="et-pri">${PRIORITIES.map(pr => `<option value="${pr}" ${pr === t.priority ? 'selected' : ''}>${pr.charAt(0).toUpperCase() + pr.slice(1)}</option>`).join('')}</select>
      </div>
      <div class="form-group"><label>Status</label>
        <select id="et-status">${STATUSES.map(s => `<option value="${s}" ${s === t.status ? 'selected' : ''}>${s.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase())}</option>`).join('')}</select>
      </div>
      <div class="form-group"><label>% Complete</label><input type="number" id="et-pct" min="0" max="100" value="${t.percentComplete || 0}"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Assignee</label><input id="et-assignee" value="${esc(t.assignee || '')}"></div>
      <div class="form-group"><label>Due Date</label><input type="date" id="et-due" value="${t.dueDate || ''}"></div>
    </div>
    <div id="editDevFields" style="display:${t.department === 'development' ? 'block' : 'none'}">
      <div class="form-row">
        <div class="form-group"><label>Phase</label><select id="et-phase">${phaseOpts}</select></div>
        <div class="form-group"><label>Category</label>
          <select id="et-cat"><option value="critical-path" ${t.category === 'critical-path' ? 'selected' : ''}>Critical Path</option><option value="secondary" ${t.category !== 'critical-path' ? 'selected' : ''}>Secondary</option></select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Start Date</label><input type="date" id="et-start" value="${t.startDate || ''}"></div>
        <div class="form-group"><label>Projected Finish</label><input type="date" id="et-finish" value="${t.projectedFinish || ''}"></div>
      </div>
    </div>
    <div id="editLegalFields" style="display:${t.department === 'legal' ? 'block' : 'none'}">
      <div class="form-row">
        <div class="form-group"><label>Counsel Type</label>
          <select id="et-counsel"><option value="">—</option>${ls.counselTypes.map(c => `<option ${c === t.counselType ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
        </div>
        <div class="form-group"><label>Action Type</label>
          <select id="et-action"><option value="">—</option>${ls.actionTypes.map(a => `<option ${a === t.actionType ? 'selected' : ''}>${esc(a)}</option>`).join('')}</select>
        </div>
      </div>
    </div>
    <div class="form-group"><label>Description</label><textarea id="et-desc">${esc(t.description || '')}</textarea></div>
    <div class="form-group"><label>Checklist</label>
      <div id="et-checklist" class="checklist">${checklistHtml}</div>
      <button class="cl-add" onclick="addChecklistItem('et-checklist')">+ Add item</button>
    </div>`;

  openModal('Edit Task', body,
    `<button class="btn btn-danger" style="margin-right:auto" onclick="deleteTask('${t.id}');closeModal()">Delete</button>
     <button class="btn" onclick="closeModal()">Cancel</button>
     <button class="btn btn-primary" onclick="saveEditTask('${t.id}')">Save</button>`);
}

function toggleEditDevFields() {
  const dept = document.getElementById('et-dept').value;
  document.getElementById('editDevFields').style.display = dept === 'development' ? 'block' : 'none';
  document.getElementById('editLegalFields').style.display = dept === 'legal' ? 'block' : 'none';
}

function saveEditTask(taskId) {
  const t = state.tasks.find(x => x.id === taskId);
  if (!t) return;
  const name = document.getElementById('et-name').value.trim();
  if (!name) { alert('Task name required'); return; }

  t.department = document.getElementById('et-dept').value;
  t.projectId = document.getElementById('et-proj').value;
  t.taskName = name;
  t.priority = document.getElementById('et-pri').value || 'medium';
  t.status = document.getElementById('et-status').value;
  t.percentComplete = pct(parseInt(document.getElementById('et-pct').value) || 0);
  t.assignee = document.getElementById('et-assignee').value.trim();
  t.dueDate = document.getElementById('et-due').value;
  t.description = document.getElementById('et-desc').value.trim();

  if (t.status === 'completed') { t.percentComplete = 100; t.bucket = 'Complete'; }

  // Dev fields
  if (t.department === 'development') {
    t.phaseId = document.getElementById('et-phase').value;
    t.category = document.getElementById('et-cat').value;
    t.startDate = document.getElementById('et-start').value;
    const newFinish = document.getElementById('et-finish').value;
    if (t.projectedFinish !== newFinish && !(t.delays || []).length) t.originalFinish = newFinish;
    t.projectedFinish = newFinish;
    t.dueDate = t.projectedFinish || t.dueDate;
  }

  // Legal fields
  if (t.department === 'legal') {
    t.counselType = document.getElementById('et-counsel').value;
    t.actionType = document.getElementById('et-action').value;
  }

  // Checklist
  const checklist = [];
  document.querySelectorAll('#et-checklist .cl-item').forEach(item => {
    const text = item.querySelector('input[type=text]').value.trim();
    if (text) checklist.push({ id: item.querySelector('input[type=checkbox]').dataset.clId || uid(), text, done: item.querySelector('input[type=checkbox]').checked });
  });
  t.checklist = checklist;
  t.updatedAt = new Date().toISOString();

  saveState(); closeModal(); renderMain();
  showToast('Task updated');
}

function deleteTask(taskId) {
  if (!confirm('Delete this task?')) return;
  state.tasks = state.tasks.filter(t => t.id !== taskId);
  saveState(); renderMain();
  showToast('Task deleted');
}

function toggleChecklist(taskId, clId) {
  const t = state.tasks.find(x => x.id === taskId);
  if (!t || !t.checklist) return;
  const item = t.checklist.find(c => c.id === clId);
  if (item) { item.done = !item.done; t.updatedAt = new Date().toISOString(); saveState(); renderMain(); }
}
